://app.notion.com/2a2127970a6280dc9cdefc8e0e433a2c"},{"db":"met","name":"MOUNTAINEER","year":2023,"phase":"II","cancer":"CRC","biomarker":"HER2","setting":"2L / 3L","n":null,"population":"RAS wild-type, HER2-positive chemorefractory mCRC. Median 2–3 prior lines. Prior anti-HER2 excluded.","treatment":"Tucatinib + trastuzumab (vs tucatinib alone)","tx":["TKI","Anti-HER2"],"endpoints":[["ORR (1°)","38.1%"],["DCR","71%"],["PFS","8.2 mo"],["OS","24.1 mo"]],"takeaway":"Tucatinib + trastuzumab is active and well tolerated in HER2+ RAS wild-type refractory mCRC — a 24-month median OS in a heavily pretreated population. Led to FDA approval.","url":"https://app.notion.com/302127970a62803ba5f5e4c2f10ac1a7"},{"db":"met","name":"MVAC (Loehrer)","year":1992,"phase":"III","cancer":"UC","biomarker":null,"setting":"1L","n":246,"population":"Advanced urothelial carcinoma, cisplatin-eligible.","treatment":"MVAC vs single-agent cisplatin","tx":["ChT"],"endpoints":[["ORR","39% vs 11.6%"],["PFS","6.6 vs 2.4 mo"],["OS","12.5 vs 8.2 mo"]],"takeaway":"The trial that established combination chemotherapy in urothelial carcinoma — more than tripling response rate over single-agent cisplatin. The foundation everything since has been measured against.","url":"https://app.notion.com/2bb127970a628053a2cfee9a2ed5d382"},{"db":"met","name":"MyPathway (HER2 CRC cohort)","year":2019,"phase":"II","cancer":"CRC","biomarker":"HER2","setting":"2L / 3L","n":null,"population":"HER2-amplified mCRC, median 4 prior lines. Prior anti-HER2 excluded.","treatment":"Trastuzumab + pertuzumab (single-arm basket)","tx":["Anti-HER2"],"endpoints":[["ORR","32%"],["DCR","44%"],["PFS","2.9 mo"],["OS","11.5 mo"]],"takeaway":"Dual HER2 antibody blockade is active and well tolerated in HER2-amplified mCRC, particularly in KRAS wild-type. The short PFS reflects how heavily pretreated these patients were.","url":"https://app.notion.com/2ff127970a6280d180c0e132aa2d9b01"},{"db":"met","name":"NALA","year":2020,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"3L","n":null,"population":"HER2+ metastatic breast cancer after ≥2 prior HER2-directed regimens. ECOG 0–1, 59% HR+, 84% visceral, 16.6% baseline brain mets. Prior: 99.7% trastuzumab, 42% pertuzumab, 54% T-DM1.","treatment":"Neratinib + capecitabine vs lapatinib + capecitabine","tx":["TKI","ChT"],"endpoints":[["ORR","⚠️ 32.8% vs 26.7%, P=0.12, NS"],["CBR","✅ 44.5% vs 35.6%, P=0.033"],["PFS (co-1°)","✅ Median 5.6 vs 5.5 mo but mean 8.8 vs 6.6 — HR 0.76 (0.63–0.93), P=0.006"],["OS (co-1°)","⚠️ 21.0 vs 18.7 mo — HR 0.88 (0.72–1.07), P=0.21"],["CNS","✅ Fewer CNS interventions 22.8% vs 29.2%, P=0.043; DoR 8.5 vs 5.6 mo"]],"takeaway":"The first TKI-versus-TKI superiority trial in metastatic breast cancer. Note the tell-tale pattern — identical median PFS but separated mean PFS, meaning the benefit is in the tail. Grade 3 diarrhoea in 24% despite prophylaxis.","url":"https://app.notion.com/385127970a6281a6b1e2c96cad1e748d"},{"db":"met","name":"NO16966","year":2008,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"Previously untreated mCRC, ECOG ≤1.","treatment":"Bevacizumab + oxaliplatin-based chemo (FOLFOX4 or XELOX) vs chemo alone","tx":["Anti-VEGF","ChT"],"endpoints":[["ORR","❌ 47% vs 49%"],["PFS (1°)","✅ 9.4 vs 8.0 mo — HR 0.83 (0.72–0.95), P=0.002"],["OS","⚠️ 21.3 vs 19.9 mo — HR 0.89 (0.76–1.03), P=0.077"]],"takeaway":"Bevacizumab improved PFS but not OS or response rate with an oxaliplatin backbone — a weaker effect than with irinotecan. A key subtlety: many patients stopped bevacizumab early for chemo toxicity, which is why the trial argues for continuing bevacizumab until progression.","url":"https://app.notion.com/2e3127970a6280c285eaf9753ff43656"},{"db":"met","name":"NSABP-B27 (real-world, Jordan)","year":2017,"phase":"Retrospective","cancer":"Breast","biomarker":"HR","setting":"Neoadjuvant","n":346,"population":"346 women with high-risk early breast cancer treated neoadjuvantly in Jordan 2003–2014. Median tumour 6.0 cm; 78.3% node-positive — notably more advanced than the original B-27 trial.","treatment":"AC ×4 → docetaxel ×4 (single arm)","tx":["ChT"],"endpoints":[["pCR","25.0% — comparable to B-27 RCT's 26%"],["DCR","96.2%"],["DFS","Median 101.9 mo; 5-yr 63.5%"],["OS","5-yr 76.6%"]],"takeaway":"Real-world outcomes matched the trial (pCR 25% vs 26%) despite larger tumours and far more nodal involvement. HR-negative, node-negative and smaller tumours predicted higher pCR. Note: this row sits in your Metastatic DB but is an early-stage neoadjuvant study — it may belong in the Early DB.","url":"https://app.notion.com/386127970a628134b7ead2588b0f0024"},{"db":"met","name":"OlympiAD","year":2017,"phase":"III","cancer":"Breast","biomarker":"BRCA","setting":"2L / 3L","n":null,"population":"Germline BRCA1/2-mutant, HER2-negative metastatic breast cancer, ≤2 prior metastatic chemo lines. Prior anthracycline and taxane required; prior platinum for metastatic disease EXCLUDED.","treatment":"Olaparib vs physician's-choice chemotherapy","tx":["PARPi","ChT"],"endpoints":[["ORR","59.9% vs 28.8%"],["PFS (1°)","✅ 7.0 vs 4.2 mo — HR 0.58 (0.43–0.80), P<0.001"],["OS","❌ 19.3 vs 17.1 mo — HR 0.89 (0.67–1.18), NS"]],"takeaway":"First PARP inhibitor trial in breast cancer — PFS benefit, no OS. But an OS signal in the chemotherapy-naive subgroup pointed toward earlier use, which is exactly what OlympiA went on to prove in the adjuvant setting.","url":"https://app.notion.com/383127970a6281a9b76ceaa0afe9706a"},{"db":"met","name":"P025","year":2001,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"1L","n":null,"population":"Postmenopausal advanced breast cancer, HR-positive (65%) or unknown (35%). Prior adjuvant endocrine therapy allowed.","treatment":"Letrozole vs tamoxifen, first-line for advanced disease","tx":["Endocrine"],"endpoints":[["ORR","✅ 32% vs 21% — OR 1.78 (1.32–2.40), P=0.0002"],["CBR","50% vs 38%"],["TTP (1°)","✅ 9.4 vs 6.0 mo — HR 0.70 (0.60–0.82), P<0.0001"],["OS","⚠️ 34.0 vs 30.3 mo, NS"]],"takeaway":"Established aromatase inhibitors over tamoxifen as first-line endocrine therapy in advanced disease — the metastatic counterpart to ATAC and BIG 1-98.","url":"https://app.notion.com/2d1127970a6280b594f3e1bf68c8babd"},{"db":"met","name":"PALOMA-2","year":2016,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"1L","n":null,"population":"Postmenopausal ER+/HER2− advanced breast cancer, no prior treatment for advanced disease.","treatment":"Palbociclib + letrozole vs placebo + letrozole","tx":["CDK4/6i","NSAI"],"endpoints":[["ORR","42.1% vs 34.7%"],["CBR","84.9% vs 70.3%"],["PFS (1°)","✅ 24.8 vs 14.5 mo — HR 0.58 (0.46–0.72), P<0.001"],["OS","⚠️ 53.9 vs 51.2 mo — HR 0.96 (0.78–1.18), P=0.34"]],"takeaway":"Palbociclib clearly extends PFS but — unlike ribociclib in MONALEESA-2 — never delivered an OS benefit. The central unexplained puzzle of the CDK4/6 class. Main toxicity is myelosuppression.","url":"https://app.notion.com/2d1127970a6280178ea6d1e996c141f3"},{"db":"met","name":"PALOMA-3","year":2016,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"2L","n":null,"population":"HR+/HER2− advanced breast cancer progressing on endocrine therapy, CDK4/6i-naive. Any menopausal status; ≤1 prior metastatic chemo line. Primary endocrine resistance ~21%.","treatment":"Palbociclib + fulvestrant vs placebo + fulvestrant","tx":["CDK4/6i","SERD"],"endpoints":[["ORR","✅ 25% vs 11%"],["CBR","67% vs 40%"],["PFS (1°)","✅ 9.5 vs 4.6 mo — HR 0.46 (0.36–0.59), P<0.0001"],["OS ITT","⚠️ 34.9 vs 28.0 mo — HR 0.81 (0.64–1.03), P=0.09"],["OS endocrine-sensitive","✅ 39.7 vs 29.7 mo — HR 0.43 (0.33–0.57), P<0.0001"]],"takeaway":"Doubles PFS after endocrine progression. The OS story is subgroup-dependent: no ITT benefit, but a large one in endocrine-sensitive patients — prior endocrine sensitivity predicts who gains.","url":"https://app.notion.com/37c127970a6280f39c7efdf8bbee9036"},{"db":"met","name":"PAOLA-1","year":2019,"phase":"III","cancer":"Ovary","biomarker":"BRCA / HRD","setting":"1L maintenance","n":null,"population":"FIGO III–IV ovarian/fallopian/peritoneal cancer in CR/PR after first-line platinum-taxane + bevacizumab. Enrolled regardless of surgical outcome or BRCA status.","treatment":"Maintenance olaparib + bevacizumab vs placebo + bevacizumab","tx":["Anti-VEGF","PARPi"],"endpoints":[["PFS (1°)","✅ Overall 22.1 vs 16.6 mo — HR 0.59 (0.49–0.72)"],["PFS HRD+","✅ 37.2 vs 17.7 mo — HR 0.33 (0.25–0.45)"],["PFS HRD−","❌ No benefit"],["5-yr OS HRD+","✅ 66% vs 48% — HR 0.62 (0.45–0.85)"],["OS HRD−","❌ No benefit"]],"takeaway":"The only PARP inhibitor trial to show an OS benefit in first-line ovarian cancer — but only in HRD-positive tumours, including BRCA wild-type. HRD-negative patients gain nothing, which makes HRD testing essential before committing.","url":"https://app.notion.com/339127970a62808ba0d1de02a811efc4"},{"db":"met","name":"PARADIGM","year":2023,"phase":"III","cancer":"CRC","biomarker":"RAS","setting":"1L","n":null,"population":"RAS wild-type mCRC, ECOG 0–1, prior adjuvant oxaliplatin excluded. Primary analysis in LEFT-SIDED tumours.","treatment":"Panitumumab vs bevacizumab, both with mFOLFOX6","tx":["Anti-VEGF","Anti-EGFR"],"endpoints":[["ORR","✅ Left-sided 80.2% vs 68.6%"],["PFS","Left-sided 13.1 vs 11.9 mo"],["OS (1°)","✅ Left-sided 37.9 vs 34.3 mo — HR 0.82 (0.68–0.99), P=0.03; ITT 36.2 vs 31.3 mo — HR 0.84, P=0.03"],["Right-sided","❌ 20.2 vs 23.2 mo — bevacizumab numerically better"]],"takeaway":"The definitive prospective answer to the sidedness question — anti-EGFR first in LEFT-sided RAS wild-type disease, anti-VEGF for right-sided. Depth of response correlated with better OS.","url":"https://app.notion.com/2e6127970a6280799440dc93482b00ff"},{"db":"met","name":"PARSIFAL","year":2021,"phase":"II","cancer":"Breast","biomarker":"HR","setting":"1L","n":null,"population":"HR+/HER2− advanced breast cancer, ENDOCRINE-SENSITIVE, no prior treatment for advanced disease. Prior perioperative ET allowed if DFS >12 months.","treatment":"Fulvestrant + palbociclib vs letrozole + palbociclib","tx":["CDK4/6i","NSAI","SERD"],"endpoints":[["ORR","❌ 46.5% vs 50.2%, P=0.41"],["CBR","⚠️ 70.8% vs 69.1%, P=0.69"],["PFS (1°)","❌ 27.9 vs 32.8 mo — HR 1.13 (0.89–1.45), P=0.32 — superiority NOT shown"],["OS","⚠️ 3-yr 79.4% vs 77.1% — HR 1.00, immature"]],"takeaway":"Fulvestrant is not a better CDK4/6 partner than an aromatase inhibitor in endocrine-sensitive first-line disease. Keep the NSAI.","url":"https://app.notion.com/379127970a6280b69a54e549ce24f5ab"},{"db":"met","name":"postMONARCH","year":2025,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"2L","n":null,"population":"HR+/HER2− advanced breast cancer progressing on a CDK4/6 inhibitor (60% palbociclib), in either the advanced or early setting. Prior metastatic chemotherapy excluded. Not biomarker-selected.","treatment":"SWITCHED endocrine therapy (AI → fulvestrant) + abemaciclib vs switched ET + placebo","tx":["CDK4/6i","SERD"],"endpoints":[["ORR","✅ 17% vs 7% in measurable disease, P=0.015"],["CBR","✅ 29.0% vs 18.1%, P=0.036"],["PFS (1°)","✅ 6.0 vs 5.3 mo — HR 0.73 (0.57–0.95), P=0.017; by BICR HR 0.55 (0.39–0.77)"]],"takeaway":"Confirms in phase III what MAINTAIN suggested — CDK4/6 inhibition beyond progression works, without biomarker selection. Unlike MAINTAIN, prior CDK4/6i duration did not affect the benefit. Be realistic about magnitude: the median PFS gain is under a month.","url":"https://app.notion.com/380127970a628040acb1d578b81c41ae"},{"db":"met","name":"PRIME","year":2013,"phase":"III","cancer":"CRC","biomarker":"RAS","setting":"1L","n":null,"population":"KRAS exon 2 wild-type mCRC, ECOG ≤2. Prior adjuvant oxaliplatin excluded.","treatment":"Panitumumab + FOLFOX4 vs FOLFOX4","tx":["Anti-EGFR","ChT"],"endpoints":[["ORR","⚠️ 55% vs 48%"],["PFS (1°)","✅ 10.1 vs 7.9 mo — HR 0.72 (0.58–0.90), P=0.004"],["OS","✅ 25.8 vs 20.2 mo — HR 0.77 (0.64–0.94), P=0.009"]],"takeaway":"Panitumumab + FOLFOX improves both PFS and OS — but only in fully RAS wild-type tumours. The extended RAS analysis of this trial is what expanded testing beyond KRAS exon 2.","url":"https://app.notion.com/2e3127970a62804f8b94feb716c1be2c"},{"db":"met","name":"PYNNACLE","year":2026,"phase":"I/II (Ongoing)","cancer":"Pan-tumour","biomarker":"TP53 Y220C","setting":"3L","n":null,"population":"Solid tumours carrying the TP53 Y220C mutation (ovary, pancreas, breast, CRC, endometrial, lung, HEENT and others). ECOG 0–1, median 3 prior lines.","treatment":"Rezatapopt (PC14586), an oral selective p53 reactivator (single-arm)","tx":["Others"],"endpoints":[["ORR","20% overall; 30% in KRAS wild-type at ≥1150 mg"],["DCR","68% (PR 20% + SD 48%; no CRs)"],["PFS","4.3 mo (2.8–5.5)"],["OS","11.4 mo (6.4–14.9)"]],"takeaway":"Proof of concept that a mutant p53 protein can be pharmacologically reactivated — a target considered undruggable for decades. RP2D 2000 mg daily with food; main toxicities GI and anaemia.","url":"https://app.notion.com/334127970a62806996bfd195c40a88a8"},{"db":"met","name":"RAINBOW","year":2014,"phase":"III","cancer":"GC / Esophagus","biomarker":null,"setting":"2L","n":665,"population":"Metastatic gastric (80%) or GEJ (20%) adenocarcinoma progressing on or within 4 months of first-line platinum + fluoropyrimidine. ECOG 0–1, White 61% / Asian 34%. Deliberately poor-prognosis: 67% progressed during first line, 47% peritoneal mets, 36% ascites.","treatment":"Ramucirumab + paclitaxel vs placebo + paclitaxel (double-blind, no crossover)","tx":["Anti-VEGF","ChT"],"endpoints":[["ORR","✅ 28% vs 16%, P=0.0001; median DoR 4.4 vs 2.8 mo"],["DCR","✅ 80% vs 64%, P<0.0001"],["PFS","✅ 4.4 vs 2.9 mo — HR 0.635 (0.536–0.752), P<0.0001"],["OS (1°)","✅ 9.6 vs 7.4 mo — HR 0.807 (0.678–0.962), P=0.017"],["By site/region","✅ GEJ HR 0.52 vs gastric HR 0.90; West HR 0.73 vs East Asia HR 0.99"]],"takeaway":"The only anti-angiogenic to succeed in gastric cancer, and it works in all comers with no biomarker. Adding ramucirumab did not increase febrile neutropenia despite more grade 3–4 neutropenia — the real VEGFR-2 toxicities are hypertension, epistaxis and proteinuria. Benefit is much larger in GEJ and Western patients.","url":"https://app.notion.com/3d7127970a6281edb67ef339e6b63e3a"},{"db":"met","name":"RASolute 302","year":2026,"phase":"III","cancer":"Pancreas","biomarker":"RAS","setting":"2L","n":500,"population":"Previously treated metastatic pancreatic adenocarcinoma with ≥1 prior fluoropyrimidine- or gemcitabine-based line. ECOG 0–1. RAS status required; RAS G12 in 91.8%.","treatment":"Daraxonrasib 300 mg daily (RAS(ON) multi-selective inhibitor) vs investigator's-choice chemotherapy","tx":["Others","ChT"],"endpoints":[["ORR","✅ 33.2% vs 11.8% (RAS G12)"],["PFS","✅ 7.3 vs 3.5 mo — HR 0.45 (0.34–0.59), P<0.001"],["OS (1°)","✅ 13.2 vs 6.6 mo — HR 0.40 (0.30–0.54), P<0.001"],["QoL","✅ Quality of life and time to pain deterioration both significantly improved"]],"takeaway":"The first RAS(ON) inhibitor to show an OS benefit in pancreatic cancer — doubling median survival in second line, in the disease where RAS has been the defining undruggable target for 40 years.","url":"https://app.notion.com/38d127970a62811895f0da325461d8e1"},{"db":"met","name":"RATIONALE-301","year":2023,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":null,"population":"Unresectable HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Vp4 status not specified.","treatment":"Tislelizumab vs sorafenib (non-inferiority design)","tx":["ICI"],"endpoints":[["ORR","14.3% vs 8.3%"],["PFS","❌ 2.1 vs 3.4 mo — HR 1.11 (0.92–1.33)"],["OS (1°)","↔ 15.9 vs 14.1 mo — HR 0.85, P=0.04, non-inferiority met"]],"takeaway":"Tislelizumab monotherapy is non-inferior to sorafenib — a chemo-free, bevacizumab-free option for patients unsuitable for combination therapy. But PFS is worse, so it is not a substitute for atezo/bev.","url":"https://app.notion.com/2a2127970a628050af00f276d45ff963"},{"db":"met","name":"RATIONALE-302","year":2022,"phase":"III","cancer":"Esophagus","biomarker":"PD-L1","setting":"2L","n":512,"population":"Esophageal squamous cell carcinoma only, after one prior chemotherapy line. 79% Asia. PD-L1 TAP ≥10% in 31%.","treatment":"Tislelizumab vs taxane or irinotecan (open-label)","tx":["ICI"],"endpoints":[["ORR","✅ 20.3% vs 9.8% — OR 2.39 (1.42–4.01); median DoR 7.1 vs 4.0 mo"],["PFS","❌ 1.6 vs 2.1 mo — HR 0.83; but 12-mo PFS 12.7% vs 1.9%, curves separate after ~3 mo"],["OS (1°)","✅ ITT 8.6 vs 6.3 mo — HR 0.70 (0.57–0.85), P=0.0001"],["OS TAP ≥10%","✅ 10.3 vs 6.8 mo — HR 0.54 (0.36–0.79)"],["OS TAP <10%","⚠️ 6.9 vs 5.8 mo — HR 0.82"]],"takeaway":"OS benefit regardless of PD-L1, and it survived crossover — aligning with ATTRACTION-3 rather than KEYNOTE-181. Again no PFS benefit: the curves cross at 3 months.","url":"https://app.notion.com/3d7127970a62817f8166ce85e0abed4d"},{"db":"met","name":"RATIONALE-306","year":2023,"phase":"III","cancer":"Esophagus","biomarker":"PD-L1","setting":"1L","n":649,"population":"Treatment-naive esophageal squamous cell carcinoma. 75% Asian; 44% had prior definitive therapy. PD-L1 TAP ≥10% in 34%.","treatment":"Tislelizumab + chemo (platinum/5-FU or platinum/taxane) vs placebo + chemo (double-blind)","tx":["ICI","ChT"],"endpoints":[["ORR","✅ 63% vs 42% — OR 2.38 (1.73–3.27), P<0.0001"],["PFS","✅ 7.3 vs 5.6 mo — HR 0.62 (0.52–0.75), P<0.0001; 12-mo 30.0% vs 15.7%"],["OS (1°)","✅ ITT 17.2 vs 10.6 mo — HR 0.66 (0.54–0.80), P<0.0001"],["OS TAP ≥10%","✅ HR 0.62 (0.44–0.87)"],["OS TAP <10%","⚠️ 15.8 vs 10.4 mo — HR 0.77 (0.59–1.01)"]],"takeaway":"Median OS of 17.2 months is the longest reported in first-line ESCC, and — unlike KEYNOTE-590 — the benefit is consistent across PD-L1 levels, with either chemo backbone.","url":"https://app.notion.com/3d7127970a628170a29bf5015efa03cb"},{"db":"met","name":"RATIONALE-309","year":2023,"phase":"III","cancer":"NPC","biomarker":null,"setting":"1L","n":263,"population":"Treatment-naive recurrent/metastatic NPC, all Asian (China only). Liver mets ~40%, baseline EBV-positive ~80%, 75% prior chemoradiation. 49% crossover.","treatment":"Tislelizumab + gemcitabine/cisplatin vs placebo + GP, induction then maintenance","tx":["ICI","ChT"],"endpoints":[["ORR","69.5% vs 55.3% (IRC); median DoR 8.5 vs 6.1 mo"],["PFS (1°)","✅ 9.2 vs 7.4 mo — HR 0.52 (0.38–0.73), P<0.0001; 24-mo 23.5% vs 7.3%"],["OS","⚠️ 45.3 vs 31.8 mo — HR 0.73 (0.51–1.05), NS — confounded by 49% crossover"]],"takeaway":"PFS benefit matches the rest of the class, but OS is non-significant purely because half the control arm crossed over — a design difference, not a class failure. Cite this whenever OS is compared naively across CAPTAIN-1st, JUPITER-02 and RATIONALE-309. The landmark PFS rates separate far more than the 2-month median gap implies. Do not confuse with the early-stage NPC tislelizumab trial (NCT05211232).","url":"https://app.notion.com/3d9127970a62817d83b9fa231686f9b4"},{"db":"met","name":"FOLFOXIRI — GONO","year":2007,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"Previously untreated mCRC, median age 62. ECOG 0–1 in 98% — a deliberately FIT population.","treatment":"FOLFOXIRI vs FOLFIRI (oxaliplatin 85, irinotecan 165, infusional 5-FU 46 h)","tx":["ChT"],"endpoints":[["ORR","✅ 60% vs 34%, P<0.0001"],["DCR","80% vs 70%"],["PFS (1°)","✅ 9.8 vs 6.9 mo — HR 0.63, P=0.0006"],["OS","✅ 22.6 vs 16.7 mo — HR 0.70, P=0.032"]],"takeaway":"Triplet chemotherapy improves response, PFS and OS — but only in genuinely fit patients (98% were ECOG 0–1). Patient selection is the whole story; see the HORG trial for what happens without it.","url":"https://app.notion.com/2e2127970a6280459330dc467ad32aa2"},{"db":"met","name":"FOLFOXIRI — HORG","year":2006,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"Previously untreated mCRC, median age 66, age ≥75 permitted. ECOG 0 in only 36%, ECOG 2 in 11%. Crossover allowed.","treatment":"FOLFOXIRI vs FOLFIRI (lower doses: oxaliplatin 65, irinotecan 150, bolus 5-FU)","tx":["ChT"],"endpoints":[["ORR","⚠️ 43% vs 33.6%, P=0.17"],["PFS","⚠️ 8.4 vs 6.9 mo, P=0.17"],["OS","⚠️ 21.5 vs 19.5 mo, P=0.34"]],"takeaway":"The negative mirror image of the GONO trial — an older, less fit population, lower drug doses and bolus 5-FU produced no benefit and heavy toxicity. Together the two trials define exactly who FOLFOXIRI is for.","url":"https://app.notion.com/2e2127970a62801aa24ff2deda552ac6"},{"db":"met","name":"REACH-2","year":2019,"phase":"III","cancer":"HCC","biomarker":"AFP","setting":"2L","n":292,"population":"Advanced HCC, Child-Pugh A, ECOG ≤1, BCLC B/C, AFP >400 ng/mL, progressing on sorafenib. Biomarker-selected after REACH failed in all comers.","treatment":"Ramucirumab vs placebo","tx":["Anti-VEGF"],"endpoints":[["ORR","5% vs 1%"],["DCR","60% vs 39%"],["PFS","✅ 2.8 vs 1.5 mo — HR 0.45 (0.34–0.60), P<0.001"],["OS (1°)","✅ 8.5 vs 7.3 mo — HR 0.71 (0.53–0.95), P=0.02"]],"takeaway":"The first positive biomarker-selected trial in HCC — rescuing a failed drug by restricting to AFP >400. A model for salvaging negative trials through biomarker enrichment.","url":"https://app.notion.com/2a2127970a6280b98ca5da00789bb339"},{"db":"met","name":"RECOURSE","year":2015,"phase":"III","cancer":"CRC","biomarker":null,"setting":"3L","n":null,"population":"Refractory mCRC, median 3 prior regimens, 20% prior regorafenib. ECOG 0 in ~56%.","treatment":"Trifluridine/tipiracil (TAS-102) vs placebo","tx":["ChT"],"endpoints":[["ORR","⚠️ 1.6% vs 0.4%"],["DCR","✅ 44% vs 16%"],["PFS","✅ 2.0 vs 1.7 mo — HR 0.48 (0.41–0.57), P<0.001"],["OS (1°)","✅ 7.1 vs 5.3 mo — HR 0.68 (0.58–0.81), P<0.001"]],"takeaway":"Established TAS-102 as a third-line option in refractory mCRC. Like regorafenib, the benefit is real but small — disease stabilisation rather than response.","url":"https://app.notion.com/302127970a628060b413d00d81963e33"},{"db":"met","name":"REFLECT","year":2018,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":954,"population":"Unresectable HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Excluded Vp4 invasion, bile duct invasion and >50% liver involvement — a selected, better-prognosis population.","treatment":"Lenvatinib vs sorafenib (non-inferiority)","tx":["TKI"],"endpoints":[["ORR","✅ 19% vs 7% (RECIST); 24% vs 9% (mRECIST)"],["DCR","73% vs 59%"],["PFS","✅ 7.4 vs 3.7 mo — HR 0.66 (0.57–0.77), P<0.001"],["OS (1°)","↔ 13.6 vs 12.3 mo — HR 0.92 (0.79–1.06), non-inferiority met"]],"takeaway":"Lenvatinib is non-inferior to sorafenib with a doubled PFS and far higher response rate — making it the preferred TKI. Read the eligibility criteria: the excluded high-risk features flatter the results.","url":"https://app.notion.com/2a2127970a62806cbb43c57c5567809d"},{"db":"met","name":"RESORCE","year":2017,"phase":"III","cancer":"HCC","biomarker":null,"setting":"2L","n":573,"population":"Advanced HCC, Child-Pugh A, ECOG ≤1, progressing on sorafenib — and critically, required to have TOLERATED sorafenib.","treatment":"Regorafenib vs placebo","tx":["TKI"],"endpoints":[["ORR","11% vs 4% (mRECIST)"],["DCR","65% vs 36%"],["PFS","✅ 3.1 vs 1.5 mo — HR 0.46 (0.37–0.56), P<0.001"],["OS (1°)","✅ 10.6 vs 7.8 mo — HR 0.63 (0.50–0.79), P<0.001"]],"takeaway":"First positive second-line trial in HCC. The tolerance requirement matters — these results apply only to patients who got through sorafenib without unacceptable toxicity, not to those who stopped for side effects.","url":"https://app.notion.com/2a2127970a62809caac4f53e93d2cd2d"},{"db":"met","name":"ReTrITA","year":2025,"phase":"Retrospective","cancer":"CRC","biomarker":null,"setting":"3L","n":null,"population":"Refractory mCRC after ≥2 prior lines.","treatment":"Sequencing study — regorafenib → TAS-102 vs TAS-102 → regorafenib","tx":["TKI","ChT"],"endpoints":[["ORR","5.5% vs 3.4%"],["DCR","52.1% vs 32.9%"],["PFS","✅ 11.5 vs 8.5 mo — HR 0.60 (0.49–0.74), P<0.0001 (monotherapy PFS nearly identical: 3.2 vs 3.3 mo)"],["OS","✅ 16.6 vs 12.6 mo — HR 0.67 (0.53–0.83), P=0.0004"]],"takeaway":"Sequence matters — regorafenib first, then TAS-102. Note the tell: each drug's individual PFS is identical, so the benefit comes from the ordering, not from either agent. Retrospective, so treat with appropriate caution.","url":"https://app.notion.com/303127970a6280b28a0ec8a03845ff98"},{"db":"met","name":"RIGHT Choice","year":2024,"phase":"II","cancer":"Breast","biomarker":"HR","setting":"1L","n":null,"population":"PRE/PERI-MENOPAUSAL women with aggressive HR+/HER2− advanced breast cancer — including visceral crisis — with no prior treatment for advanced disease. The population clinicians reflexively give chemotherapy.","treatment":"Ribociclib + NSAI + ovarian function suppression vs investigator's-choice combination chemotherapy","tx":["CDK4/6i","NSAI"],"endpoints":[["ORR","66.1% vs 61.8%"],["CBR","81.3% vs 74.5%"],["PFS (1°)","✅ 21.8 vs 12.8 mo — HR 0.61 (0.43–0.87), P=0.003"],["OS","⚠️ NR vs NR, immature"]],"takeaway":"Directly challenges the instinct to reach for chemotherapy in visceral crisis — endocrine therapy plus ribociclib gave 9 months more PFS with better tolerability. Practice-changing for aggressive premenopausal HR+ disease.","url":"https://app.notion.com/37a127970a628065b66dc3a84a6823cb"},{"db":"met","name":"RMC-6236 (daraxonrasib, CRC)","year":null,"phase":"I (Ongoing)","cancer":"CRC","biomarker":"RAS","setting":"3L","n":null,"population":"RAS-mutant refractory colorectal cancer (details not yet captured).","treatment":"RMC-6236 (daraxonrasib) — RAS(ON) multi-selective inhibitor","tx":["Others"],"endpoints":[["Status","📝 Row is a placeholder — results not captured yet"]],"takeaway":"Placeholder for the colorectal cohort of daraxonrasib. Worth filling in — the same drug produced a doubling of OS in pancreatic cancer (RASolute 302).","url":"https://app.notion.com/306127970a6280e9886cde79d66431dd"},{"db":"met","name":"Saltz et al.","year":2000,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"Previously untreated mCRC, median age ~60. Over half were ECOG 1–2; 80% had liver metastases.","treatment":"Irinotecan + 5-FU/LV (IFL) vs 5-FU/LV vs irinotecan alone","tx":["ChT"],"endpoints":[["ORR","✅ 50% vs 28%"],["PFS (1°)","✅ 7.0 vs 4.3 mo — HR 0.64 (0.51–0.79), P=0.004"],["OS","✅ 14.8 vs 12.6 mo — HR 0.78 (0.63–0.97), P=0.04"]],"takeaway":"The trial that moved metastatic colorectal cancer from single-agent fluorouracil to doublet chemotherapy, lifting response rates from ~20% to 50%. The starting point of the modern mCRC treatment sequence.","url":"https://app.notion.com/2e2127970a6280839850d939c66169b9"},{"db":"met","name":"SERENA-6","year":2025,"phase":"III","cancer":"Breast","biomarker":"ESR1","setting":"1L","n":null,"population":"ER+/HER2− advanced breast cancer with an EMERGENT ESR1 mutation detected on ctDNA surveillance during first-line AI + CDK4/6i (≥6 months), with NO radiographic progression yet. A genuinely novel entry criterion.","treatment":"Switch to camizestrant + continue the same CDK4/6 inhibitor vs continue AI + CDK4/6i","tx":["SERD","CDK4/6i"],"endpoints":[["PFS (1°)","✅ 16.0 vs 9.2 mo — HR 0.44 (0.31–0.60), P<0.0001"],["OS","⚠️ NR, immature (39 deaths)"],["QoL","✅ Time to deterioration HR 0.54 (0.34–0.84)"]],"takeaway":"The first trial to act on a molecular relapse before it becomes a radiographic one — switching endocrine partner on emergent ESR1 ctDNA nearly doubles PFS while keeping the CDK4/6 inhibitor. A new treatment paradigm, though OS is not yet known.","url":"https://app.notion.com/381127970a6281bbac1af49ad3f221cb"},{"db":"met","name":"SHARP","year":2008,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":602,"population":"Advanced HCC, Child-Pugh A, ECOG ≤2. Over 80% from Europe and Australasia — a non-viral-predominant population.","treatment":"Sorafenib vs placebo","tx":["TKI"],"endpoints":[["ORR","0% vs 0% — not a single objective response"],["DCR","43% vs 32%"],["PFS","✅ 5.5 vs 2.8 mo — HR 0.58 (0.45–0.74), P<0.001"],["OS (1°)","✅ 10.7 vs 7.9 mo — HR 0.69 (0.55–0.87), P<0.001"]],"takeaway":"The trial that created systemic therapy for HCC and defined the standard for a decade. Remarkable for showing an OS benefit with a 0% response rate — a lesson that RECIST response is not the same as clinical benefit.","url":"https://app.notion.com/2a2127970a628030ad01d8980163a13d"},{"db":"met","name":"SOFT (adjuvant)","year":2015,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"Adjuvant","n":null,"population":"Pre/perimenopausal women with HR+ early breast cancer — adjuvant setting.","treatment":"Tamoxifen alone vs tamoxifen + OFS vs exemestane + OFS","tx":["Endocrine"],"endpoints":[["12-yr DFS","71.9% (TAM) vs 76.1% (TAM+OFS) vs 79.0% (EXE+OFS)"],["12-yr OS","86.8% vs 89.0% vs 89.4%"],["TAM+OFS vs TAM","✅ DFS HR 0.82 (0.69–0.98), P=0.03; ⚠️ OS HR 0.78 (0.60–1.01), P=0.06"],["EXE+OFS vs TAM","✅ DRFI HR 0.83 (0.70–0.98), P=0.03"]],"takeaway":"High-risk premenopausal women benefit from ovarian function suppression. Note: this row sits in your Metastatic DB but is an adjuvant trial, and largely duplicates the SOFT/TEXT entry in your Early DB — worth consolidating.","url":"https://app.notion.com/2d1127970a6280128e60c8cb24bc0d4e"},{"db":"met","name":"SOHO-01","year":2025,"phase":"I","cancer":"Lung","biomarker":"HER2","setting":"2L / 3L","n":null,"population":"HER2-mutant NSCLC (details not yet captured).","treatment":"Sevabertinib (BAY 2927088) — HER2-selective TKI","tx":["TKI"],"endpoints":[["Status","📝 Row is a placeholder — results not captured yet"]],"takeaway":"Placeholder for sevabertinib in HER2-mutant NSCLC — a sibling to zongertinib (Beamion Lung-01). Worth filling both in together for comparison.","url":"https://app.notion.com/2ac127970a6280568fdfdb79bc4bb31b"},{"db":"met","name":"SOLAR-1","year":2019,"phase":"III","cancer":"Breast","biomarker":"PIK3CA","setting":"2L","n":null,"population":"HR+/HER2− advanced breast cancer (men and postmenopausal women) relapsing/progressing on an AI. No prior chemo for advanced disease. Prior CDK4/6i in only 6%. Primary analysis in the PIK3CA-mutant cohort. Diabetics/poor glycaemic control excluded.","treatment":"Alpelisib + fulvestrant vs placebo + fulvestrant","tx":["TKI","SERD"],"endpoints":[["ORR","26.6% vs 12.8%"],["CBR","61.5% vs 45.3% (PIK3CA-mutant)"],["PFS (1°)","✅ 11.0 vs 5.7 mo — HR 0.65 (0.50–0.85)"],["OS","⚠️ 39.3 vs 31.4 mo — HR 0.86 (0.64–1.15), NS"]],"takeaway":"First PI3K inhibitor approved in breast cancer, doubling PFS in PIK3CA-mutant disease. Two caveats: bone-only disease seemed not to benefit, and severe hyperglycaemia is a real, limiting toxicity. Only 6% had prior CDK4/6i — which is why BYLieve was needed.","url":"https://app.notion.com/37e127970a6280559cafde66fb0097ec"},{"db":"met","name":"Sorafenib in desmoid tumour","year":2018,"phase":"III","cancer":"Sarcoma (desmoid)","biomarker":null,"setting":"1L / 2L","n":null,"population":"Progressive, symptomatic or recurrent desmoid tumours. Median age 37, 69% female, 40% prior systemic therapy, 50% prior surgery. Crossover allowed at progression.","treatment":"Sorafenib 400 mg daily vs placebo","tx":["TKI"],"endpoints":[["ORR","✅ 33% vs 20% — median time to response 9.6 mo"],["PFS (1°)","✅ NR vs 11.3 mo — HR 0.13 (0.05–0.31), P<0.001; 2-yr PFS 81% vs 36%"],["Placebo ORR","⚠️ 20% — desmoids regress spontaneously"]],"takeaway":"First randomised phase III in desmoid tumours, with a striking 87% reduction in progression risk. Two clinical lessons: responses are late (median 9.6 months) so don't abandon stable disease early, and the 20% placebo response rate supports watchful waiting as a first move. 20% discontinued for skin toxicity.","url":"https://app.notion.com/3d5127970a62810888a2e38043b5845f"},{"db":"met","name":"STELLAR-303","year":2025,"phase":"III","cancer":"CRC","biomarker":null,"setting":"3L","n":null,"population":"MSS/pMMR refractory mCRC — a true third line: all had received 5-FU, irinotecan and oxaliplatin; no prior regorafenib, TAS-102 or ICI; BRAF-mutant required prior BRAF-targeted therapy.","treatment":"Zanzalintinib + atezolizumab vs regorafenib","tx":["ICI","TKI"],"endpoints":[["ORR","4% vs 1%"],["DCR","54% vs 41%"],["PFS","⚠️ 3.7 vs 2.0 mo — HR 0.68 (0.59–0.79)"],["OS (1°)","✅ 10.9 vs 9.4 mo — HR 0.80 (0.69–0.93), P=0.0045"],["Toxicity","⚠️ Grade ≥3 TRAE 60% vs 37%"]],"takeaway":"Immunotherapy finally shows an OS signal in MSS colorectal cancer — but with a modest 1.5-month gain and substantially more toxicity. Weigh carefully in a late-line population.","url":"https://app.notion.com/344127970a6280e9be7fd72a77ff971b"},{"db":"met","name":"SUNLIGHT","year":2023,"phase":"III","cancer":"CRC","biomarker":null,"setting":"3L","n":null,"population":"Refractory mCRC — >90% had exactly 2 prior lines. ECOG 0 in 43–48%.","treatment":"TAS-102 + bevacizumab vs TAS-102 alone","tx":["ChT","Anti-VEGF"],"endpoints":[["ORR","6.1% vs 1.2%"],["PFS","✅ 5.6 vs 2.4 mo — HR 0.44 (0.36–0.54), P<0.001"],["OS (1°)","✅ 10.8 vs 7.5 mo — HR 0.61 (0.49–0.77), P<0.001"],["By prior bev","✅ No prior bev HR 0.40 vs prior bev HR 0.72"]],"takeaway":"Adding bevacizumab to TAS-102 more than doubles PFS and gives a 3.3-month OS gain — the best third-line result in mCRC. Benefit is much larger in bevacizumab-naive patients.","url":"https://app.notion.com/302127970a6280748657d6d213f3d752"},{"db":"met","name":"TRIBE","year":2015,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"All-comer mCRC, unselected for RAS/BRAF or sidedness. ECOG 0 in ~90%; right-sided 25–35%.","treatment":"Bevacizumab + FOLFOXIRI (triplet) vs bevacizumab + FOLFIRI (doublet)","tx":["Anti-VEGF","ChT"],"endpoints":[["ORR","✅ 65% vs 54%"],["PFS (1°)","✅ 12.3 vs 9.7 mo — HR 0.75 (0.62–0.90), P=0.003"],["OS","✅ 29.8 vs 25.8 mo — HR 0.80 (0.65–0.98), P=0.03"]],"takeaway":"Triplet chemotherapy plus bevacizumab improves OS in fit patients. Subgroup analysis supports it particularly for right-sided tumours, where anti-EGFR does not work.","url":"https://app.notion.com/2e6127970a6280f6ba39ccab0544184d"},{"db":"met","name":"TRIBE2","year":2020,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L / 2L","n":null,"population":"All-comer mCRC, unselected for RAS/BRAF or sidedness. ECOG 0 in ~85%; right-sided 40%.","treatment":"Upfront bevacizumab-triplet (with reintroduction after progression) vs sequential bevacizumab-doublet","tx":["Anti-VEGF","ChT"],"endpoints":[["ORR","✅ 62% vs 50%"],["PFS1","✅ 12.0 vs 9.8 mo"],["PFS2 (1°)","✅ 19.2 vs 16.4 mo — HR 0.74 (0.63–0.88), P=0.0005"],["OS","✅ 27.4 vs 22.5 mo — HR 0.82 (0.68–0.98), P=0.032"]],"takeaway":"Confirms TRIBE with a strategy endpoint — giving the triplet upfront, then reintroducing it, beats sequential doublets on PFS2 and OS. Particularly relevant for right-sided disease.","url":"https://app.notion.com/2e6127970a628080aec4dca781381cae"},{"db":"met","name":"TriComB","year":2025,"phase":"I/II (Ongoing)","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"UNFIT, elderly mCRC — median age 80, ECOG 1 in ~55%, RAS-mutant ~80%.","treatment":"TAS-102 + capecitabine + bevacizumab","tx":["Anti-VEGF","ChT"],"endpoints":[["ORR","55%"],["PFS","10.3 mo"],["OS","Not yet reported"]],"takeaway":"A chemo-light triplet for patients too frail for standard doublets — 55% response and 10 months PFS at a median age of 80 is a strong early signal. Randomised confirmation pending.","url":"https://app.notion.com/303127970a6280c683eac8ef72b279bc"},{"db":"met","name":"TRIPLETE","year":2022,"phase":"III","cancer":"CRC","biomarker":"RAS / RAF","setting":"1L","n":null,"population":"RAS/BRAF wild-type mCRC, left-sided 88%, ECOG 0 in ~80%. Prior adjuvant oxaliplatin excluded.","treatment":"Panitumumab + FOLFOXIRI vs panitumumab + FOLFOX","tx":["Anti-EGFR","ChT"],"endpoints":[["ORR (1°)","❌ 73% vs 76% — OR 0.87 (0.56–1.34), P=0.53, NOT met"],["DCR","91% vs 93%"],["PFS","⚠️ 12.7 vs 12.3 mo — HR 0.88 (0.70–1.11), P=0.28"],["OS","✅ 41.1 vs 33.3 mo — HR 0.79 (0.63–0.99), P=0.049 — inconsistent with the primary result"]],"takeaway":"In RAS/BRAF wild-type disease, anti-EGFR plus a doublet is already good enough — the triplet adds toxicity without improving response or PFS. Treat the borderline OS finding with scepticism given the negative primary endpoint.","url":"https://app.notion.com/2e6127970a628071aebeca3193fd2ef5"},{"db":"met","name":"TROPION-Breast02","year":2026,"phase":"III","cancer":"Breast","biomarker":null,"setting":"1L","n":null,"population":"Treatment-naive metastatic TNBC, ICI-INELIGIBLE. No DFI requirement — deliberately includes the worst-prognosis first-line patients: DFI 0–6 mo 15%, de novo 34%, brain mets 10%.","treatment":"Datopotamab deruxtecan (Dato-DXd) vs investigator's-choice chemotherapy","tx":["ADC","ChT"],"endpoints":[["ORR","✅ 63% vs 29%"],["DCR","✅ 84% vs 60% at 12 wk"],["PFS (co-1°)","✅ 10.8 vs 5.6 mo — HR 0.57 (0.44–0.73), P<0.0001"],["OS (co-1°)","✅ 23.7 vs 18.7 mo — HR 0.79 (0.64–0.98), P=0.029"]],"takeaway":"First-line Dato-DXd improves BOTH PFS and OS in ICI-ineligible metastatic TNBC — and did so in a deliberately poor-prognosis population (the highest brain-met and short-DFI proportions of any first-line TNBC trial). Sits alongside ASCENT-03 as the answer for CPS <10 disease.","url":"https://app.notion.com/383127970a62813d8918cc28743d1bbf"},{"db":"met","name":"VIKTORIA-1","year":2026,"phase":"III","cancer":"Breast","biomarker":"PIK3CA wild-type","setting":"2L","n":null,"population":"HR+/HER2− advanced breast cancer that is PIK3CA WILD-TYPE, progressing after CDK4/6i + NSAI — the population left behind by alpelisib, capivasertib and inavolisib.","treatment":"Gedatolisib + fulvestrant ± palbociclib vs fulvestrant alone","tx":["TKI","SERD","CDK4/6i"],"endpoints":[["ORR","31.5% (triplet) vs 28.3% (doublet) vs 1.0% (fulvestrant)"],["PFS (1°)","✅ 9.3 vs 7.4 vs 2.0 mo — triplet HR 0.24 (0.17–0.35), doublet HR 0.33 (0.24–0.48), both P<0.001"],["OS","⚠️ 23.7 (triplet) vs 18.5 mo — HR 0.69 (0.43–1.12), immature"]],"takeaway":"Addresses the neglected PIK3CA wild-type population after CDK4/6i failure, with a hazard ratio of 0.24 — among the largest PFS effects in HR+ breast cancer. Note how poorly fulvestrant alone performs (ORR 1%, PFS 2 months), which amplifies the ratio. Triplet costs neutropenia.","url":"https://app.notion.com/37e127970a62808d89a3f9a3980ccf16"},{"db":"early","name":"ATTRACTION-5","year":2024,"phase":"III","cancer":"GC","biomarker":"PD-L1","setting":"Adjuvant","n":755,"population":"Pathological stage IIIA–C gastric/GEJ adenocarcinoma after gastrectomy with D2+ lymph-node dissection. Asian only (Japan, Korea, Taiwan, China).","treatment":"Adjuvant nivolumab + chemotherapy vs placebo + chemotherapy","tx":["ICI","ChT"],"endpoints":[["RFS (1°, central)","❌ 3-yr 68.4% vs 65.3% — HR 0.90 (0.69–1.18), P=0.44"],["RFS (investigator)","❌ HR 0.87 (0.69–1.11)"],["OS","⚠️ HR 0.88 (0.66–1.17) — immature, not formally tested"],["Toxicity","⚠️ Endocrine AEs 21% vs 3%; discontinuation 9% vs 4%"]],"takeaway":"Adjuvant nivolumab added to chemotherapy did not improve RFS after D2 gastrectomy for stage III gastric/GEJ cancer. It is the first phase 3 of adjuvant ICI after D2 surgery in Asia and it is negative, in contrast with the perioperative approaches tested in KEYNOTE-585 and MATTERHORN. The nivolumab arm paid for it in toxicity — endocrine adverse events 21% vs 3% and more discontinuations — with no efficacy in return.","url":"https://app.notion.com/3dc127970a62811da5b8ee5de38d8021"},{"db":"met","name":"CheckMate-141","year":2016,"phase":"III","cancer":"HEENT","biomarker":"PD-L1","setting":"2L / 3L","n":null,"population":"Recurrent/metastatic HNSCC progressing within 6 months of platinum given either as adjuvant therapy or as first-line treatment for metastatic disease. Oral cavity 50%, oropharynx 35%, larynx 14%. Prior cetuximab 62%, ≥2 prior lines 55%, PD-L1 ≥1% 57%.","treatment":"Nivolumab monotherapy vs investigator's choice (methotrexate, docetaxel or cetuximab), randomised 2:1","tx":["ICI","ChT"],"endpoints":[["ORR","✅ 13.3% vs 5.8%"],["PFS","❌ 2.0 vs 2.3 mo — HR 0.89 (0.70–1.13), P=0.32; 6-mo PFS rate 19.7% vs 9.9%"],["OS (1°)","✅ ITT 7.5 vs 5.1 mo — HR 0.70 (97.73% CI 0.51–0.96), P=0.01"],["OS by PD-L1","✅ ≥1% 8.7 vs 4.6 mo, HR 0.55 (0.36–0.83); ❌ <1% 5.7 vs 5.8 mo, HR 0.89 (0.54–1.45)"]],"takeaway":"Nivolumab monotherapy improves overall survival in platinum-refractory recurrent/metastatic HNSCC without improving PFS — the gain is in the tail of the curve, not the early one. Benefit is concentrated in PD-L1-positive disease and vanishes below 1%. Its entry criteria were broader than KEYNOTE-040's: patients recurring within 3 months of definitive platinum-based therapy were eligible here.","url":"https://app.notion.com/3dc127970a628174be30cfc83a881f97"},{"db":"early","name":"CheckMate-238","year":2017,"phase":"III","cancer":"Skin (melanoma)","biomarker":"PD-L1","setting":"Adjuvant","n":906,"population":"Completely resected stage IIIB, IIIC or IV cutaneous melanoma (AJCC 7th) — stage IIIA excluded. Resected brain metastases allowed (24% of the stage IV subset). IIIB 35%, IIIC 45%, IV ~20%; BRAF-mutant 40%.","treatment":"Nivolumab 3 mg/kg q2w vs ipilimumab 10 mg/kg q3w ×4 then q12w — both up to 1 year","tx":["ICI"],"endpoints":[["RFS (1°, 18-mo primary)","✅ 1-yr 70.5% vs 60.8% — HR 0.65 (97.56% CI 0.51–0.83), P<0.001"],["RFS (9-yr final)","✅ 9-yr 44% vs 37%; median 61.1 vs 24.2 mo — HR 0.76 (0.63–0.90)"],["DMFS","✅ 9-yr 54% vs 48%; median NR vs 83.8 mo — HR 0.81 (0.65–1.00)"],["OS","↔ 9-yr 69% vs 65%, median NR (>9 yr) in both — HR 0.88 (95.03% CI 0.69–1.11); melanoma-specific HR 0.87 (0.67–1.13)"],["RFS subgroups","PD-L1 <5% HR 0.71, ≥5% HR 0.50; stage III HR 0.65, stage IV HR 0.70"]],"takeaway":"One year of adjuvant nivolumab beat high-dose ipilimumab on RFS and DMFS and became the adjuvant standard of care in resected stage III/IV melanoma, with far less toxicity than the comparator. OS never separated, but the control arm was itself an active adjuvant drug, so the flat OS curve is a consequence of the comparator rather than evidence that adjuvant therapy does not extend life.","url":"https://app.notion.com/3dc127970a6281a795d6c2669e1027fe"},{"db":"met","name":"CheckMate-511","year":2019,"phase":"III","cancer":"Skin (melanoma)","biomarker":"PD-L1","setting":"1L","n":null,"population":"Previously untreated unresectable stage III or IV melanoma (AJCC 7th), ECOG 0–1, RECIST v1.1-measurable disease. Prior adjuvant/neoadjuvant therapy allowed if completed ≥6 wk before randomisation; active brain metastases, ocular melanoma and autoimmune disease excluded.","treatment":"NIVO3 + IPI1 (nivolumab 3 mg/kg + ipilimumab 1 mg/kg q3w ×4) vs NIVO1 + IPI3 — both followed by nivolumab 480 mg q4w maintenance","tx":["ICI"],"endpoints":[["Grade 3–5 TRAE (1°)","✅ 33.9% vs 48.3% — difference −14.4% (−24.5 to −4.3), P=0.006"],["Toxicity by organ","✅ Hepatic 7.2% vs 16.3%; GI 6.1% vs 10.7%; endocrine 2.8% vs 7.3%"],["ORR","↔ 45.6% (38.1–53.1) vs 50.6% (43.0–58.1), P=0.35"],["PFS","↔ 9.9 vs 8.9 mo; 12-mo 47.2% vs 46.4% — HR 1.06 (0.79–1.42), descriptive only"],["OS","↔ NR vs NR; 12-mo 79.7% vs 81.0% — HR 1.09 (0.73–1.62), descriptive only"],["Treatment delivery","66.1% vs 56.2% completed the combination; 56.7% vs 42.1% reached maintenance"]],"takeaway":"Flipping the dose ratio to nivolumab 3 / ipilimumab 1 cut grade 3–5 treatment-related adverse events from 48.3% to 33.9% — its primary endpoint, and it was met — with the savings concentrated in hepatic, GI and endocrine toxicity, and more patients finishing induction and reaching maintenance. Efficacy looked similar, but every efficacy endpoint was descriptive and the trial was never powered for non-inferiority, so it does not license a switch on efficacy grounds. Long-term survival evidence still rests on CheckMate-067 using NIVO1+IPI3 (4-yr OS 53%).","url":"https://app.notion.com/3dc127970a62814a9aadfd996fb7851c"},{"db":"early","name":"CheckMate-76K","year":2023,"phase":"III","cancer":"Skin (melanoma)","biomarker":"BRAF","setting":"Adjuvant","n":790,"population":"Resected stage IIB or IIC cutaneous melanoma (AJCC 8th), no treatment other than surgery; ocular and mucosal melanoma excluded. IIB 60%; superficial spreading 30%, nodular 50%, acral 5%; BRAF V600E-mutant 28–30%.","treatment":"Adjuvant nivolumab 480 mg q4w × 1 yr vs placebo, randomised 2:1","tx":["ICI"],"endpoints":[["RFS (1°)","✅ 12-mo 89.0% vs 79.4% — HR 0.42 (0.30–0.59), P<0.0001"],["DMFS (2°)","✅ 12-mo 92.3% vs 86.7% — HR 0.47 (0.30–0.72)"],["RFS by BRAF","⚠️ V600-mutant HR 0.56 (0.30–1.04); ✅ wild-type HR 0.33 (0.21–0.53)"],["Endpoint definitions","⚠️ New primary melanomas COUNTED as RFS events and death COUNTED as a DMFS event — unlike KEYNOTE-716"],["OS","⚠️ Not reported"]],"takeaway":"Adjuvant nivolumab for 1 year more than halves the recurrence hazard in resected stage IIB–IIC melanoma, with a matching distant-metastasis benefit. There is still no OS report, and the price is real: 50% discontinued for adverse events and 15% needed hormone replacement for endocrine immune toxicity. Because it counts new primary melanomas as RFS events where KEYNOTE-716 does not, the two trials' hazard ratios are not directly comparable.","url":"https://app.notion.com/3dc127970a6281b8bab4c179bd603acb"},{"db":"early","name":"CheckMate-915","year":2023,"phase":"III","cancer":"Skin (melanoma)","biomarker":"PD-L1 / BRAF","setting":"Adjuvant","n":1844,"population":"Completely resected stage IIIB–D or IV melanoma (AJCC 8th); complete lymph-node dissection NOT required. Cutaneous ~88%, acral ~3%, mucosal ~1%; stage IV 13%; BRAF-mutant 31%.","treatment":"Nivolumab 240 mg q2w + ipilimumab 1 mg/kg q6w vs nivolumab 480 mg q4w + placebo — both ≤1 year","tx":["ICI"],"endpoints":[["RFS, ITT (co-1°)","❌ 2-yr 64.6% vs 63.2% — HR 0.92 (97.295% CI 0.77–1.09), P=0.269"],["RFS, PD-L1 <1% (co-1°)","❌ 2-yr 53.6% vs 52.4% — HR 0.91 (0.73–1.14), P=0.417"],["DMFS (exploratory, stage III)","❌ 2-yr 75.4% vs 77.4% — HR 1.01 (0.83–1.23); PD-L1 <1% HR 0.94 (0.70–1.25)"],["OS","⚠️ 2-yr 89.8% vs 91.8% — HR 1.09 (0.80–1.32), immature and numerically favours nivolumab alone"],["BRAF subgroup","⚠️ Wild-type RFS HR 0.78 (0.62–0.99), unstratified"]],"takeaway":"Adding low-dose ipilimumab to adjuvant nivolumab failed both co-primary RFS endpoints and DMFS, with immature OS running numerically the wrong way — single-agent nivolumab, as in CheckMate-238, is enough. The one useful design lesson is that enrolling patients who had not had a completion lymph-node dissection did not degrade RFS.","url":"https://app.notion.com/3dd127970a6281bbb68af91b37bf0f95"},{"db":"early","name":"COMBI-AD","year":2017,"phase":"III","cancer":"Skin (melanoma)","biomarker":"BRAF (V600E/K)","setting":"Adjuvant","n":870,"population":"Completely resected stage IIIA (nodal deposit >1 mm), IIIB or IIIC cutaneous melanoma (AJCC 7th) carrying a BRAF V600E (90%) or V600K mutation. IIIB 40%, IIIC 40%.","treatment":"Dabrafenib 150 mg BID + trametinib 2 mg QD × 1 yr vs placebo","tx":["TKI"],"endpoints":[["RFS (1°)","✅ 1-yr 88% vs 56%; 3-yr 58% vs 39%; median NR vs 16.6 mo — HR 0.47 (0.39–0.58), P<0.001"],["DMFS (2°)","✅ Events 25% vs 35% — HR 0.51 (0.40–0.65), P<0.001"],["OS","⚠️ 3-yr 86% vs 77% — HR 0.57 (0.42–0.79), P=0.0006 against a required P=0.000019, so not significant"]],"takeaway":"One year of adjuvant dabrafenib/trametinib halves the recurrence hazard and improves DMFS in resected BRAF V600-mutant stage III melanoma; OS improved numerically but never crossed the extremely stringent interim boundary. It makes targeted therapy a legitimate adjuvant option in BRAF-mutant disease — but DREAMseq later showed that in the metastatic setting ICI should come before BRAF/MEK inhibition.","url":"https://app.notion.com/3dc127970a62819ca6bae6ce49651c85"},{"db":"met","name":"DREAMseq","year":2022,"phase":"III","cancer":"Skin (melanoma)","biomarker":"RAF (BRAF V600E/K)","setting":"1L / 2L","n":null,"population":"Treatment-naive for metastatic disease, unresectable stage III or IV melanoma with a CLIA-confirmed BRAF V600E/K mutation, RECIST v1.1-measurable, ECOG 0–1. Prior adjuvant allowed unless it was PD-1/PD-L1, CTLA-4, BRAF or MEK directed; brain metastases required prior surgery or SRS.","treatment":"Sequence A/C: nivolumab + ipilimumab → nivolumab maintenance, then dabrafenib/trametinib at progression. Sequence B/D: dabrafenib/trametinib until progression, then nivolumab + ipilimumab","tx":["ICI","TKI"],"endpoints":[["2-yr OS rate (1°)","✅ 71.8% (62.5–79.1) vs 51.5% (41.7–60.4) — difference 20.3% (2.6–37.9), P=0.010; 3-yr 66.2% vs 42.8%"],["ORR, step 1","↔ 46.0% (36.6–55.6) vs 43.0% (33.8–52.6), P=0.690"],["PFS, step 1","⚠️ 11.8 (5.9–33.5) vs 8.5 (6.5–11.3) mo, P=0.054; 2-yr PFS 41.9% vs 19.2%"],["Step 2 after progression","⚠️ Dab/tram after ICI ORR 47.8%, mPFS 9.9 mo vs nivo/ipi after BRAF/MEKi ORR 29.6%, mPFS 2.9 mo"],["Duration of response","✅ Median NR vs 12.7 mo, P<0.001"],["Hazard ratios","⚠️ None reported — OS hazards were non-proportional (biphasic, curves cross), so no HR or forest plot was presented"]],"takeaway":"In BRAF V600-mutant metastatic melanoma, starting with nivolumab/ipilimumab and reserving dabrafenib/trametinib gave a 20-point absolute 2-year OS gain and the trial was stopped early; every subgroup favoured ICI first, including the normal-LDH, PS 0, non-M1c and V600K patients thought to do best on targeted therapy. Durability rather than response rate is the driver, and the second line is asymmetric — BRAF/MEK still works after ICI, whereas ICI works poorly after BRAF/MEK. The caveat: OS curves are biphasic and cross, 18% died within 10 months on ICI first, crossover was feasible in only 52%, and grade ≥3 toxicity was similar (50–60%) in all four arms, so the first choice largely is the whole treatment plan.","url":"https://app.notion.com/3dc127970a6281698df9e12be43732eb"},{"db":"early","name":"EORTC 18071","year":2016,"phase":"III","cancer":"Skin (melanoma)","biomarker":null,"setting":"Adjuvant","n":951,"population":"Completely resected stage IIIA (nodal deposit >1 mm), IIIB or IIIC cutaneous melanoma (AJCC 7th); LDH >2× ULN excluded. IIIB 40%, IIIC 40%. BRAF status not prespecified.","treatment":"Ipilimumab 10 mg/kg q3w ×4 then q12w for up to 3 years vs placebo","tx":["ICI"],"endpoints":[["RFS (1°, BICR)","✅ 5-yr 40.8% vs 30.3%; median 27.6 vs 17.1 mo — HR 0.76 (0.64–0.89), P<0.001"],["DMFS (2°)","✅ 5-yr 48.3% vs 38.9%; median 48.3 vs 27.5 mo — HR 0.76 (95.8% CI 0.64–0.92), P=0.002"],["OS (2°)","✅ 5-yr 65.4% vs 54.4%; median NR in both — HR 0.72 (95.1% CI 0.58–0.88), P=0.001"]],"takeaway":"The first adjuvant melanoma trial to show an overall survival benefit, proving that adjuvant checkpoint blockade can do more than delay recurrence. It is a landmark rather than a current option: high-dose ipilimumab was so toxic that the median patient received only 4 doses of a planned 3-year course, and it was superseded by adjuvant nivolumab in CheckMate-238.","url":"https://app.notion.com/3dd127970a62813ba0cafbe79725dcce"},{"db":"met","name":"EXTREME","year":2008,"phase":"III","cancer":"HEENT","biomarker":"EGFR","setting":"1L","n":null,"population":"Treatment-naive recurrent/metastatic HNSCC with detectable EGFR expression.","treatment":"Platinum + 5-FU + cetuximab (400 → 250 mg/m² weekly) vs platinum + 5-FU alone; chemotherapy q3w for up to 6 cycles","tx":["ChT","Anti-EGFR"],"endpoints":[["ORR","✅ 36% vs 20% — odds ratio 2.33 (1.50–3.60), P<0.001"],["DCR","✅ 81% (75–86) vs 60% (53–67) — odds ratio 2.88 (1.87–4.44), P<0.001"],["PFS","✅ 5.6 vs 3.3 mo — HR 0.54 (0.43–0.67), P<0.001"],["OS (1°)","✅ 10.1 vs 7.4 mo — HR 0.80 (0.64–0.99), P=0.04"]],"takeaway":"Adding cetuximab to platinum/5-FU improved response, PFS and overall survival, making it the first-line standard of care in recurrent/metastatic HNSCC until KEYNOTE-048 displaced it. The cost is more sepsis and hypomagnesaemia.","url":"https://app.notion.com/3dc127970a628180bcdcd7bf01eebb99"},{"db":"early","name":"INFINITY","year":2025,"phase":"II","cancer":"GC","biomarker":"MSI-H / dMMR","setting":"Neoadjuvant","n":36,"population":"Resectable dMMR/MSI-H, EBV-negative gastric/GEJ adenocarcinoma (Italian GONO). Cohort 1 (n=18) cT≥2 any N M0 proceeds to surgery; cohort 2 (n=18) cT2–3 any N M0 goes to definitive non-operative management if a clinical CR is achieved (T4 excluded after cohort 1).","treatment":"Chemo-free tremelimumab 300 mg ×1 + durvalumab 1500 mg q4w ×3 (T300/D), single arm","tx":["ICI"],"endpoints":[["pCR (cohort 1)","✅ 60% (9/15 evaluable); MPR–pCR 80%"],["pCR by T stage","⚠️ T4 17% (1/6) vs T2–3 89% (8/9), P=0.011"],["PFS","Cohort 1: 24-mo 66.7% (46.6–95.3), GC-specific 84.8%. Cohort 2: 12-mo 93.8% (83.0–100)"],["OS","Cohort 1: 24-mo 73.3% (54.0–99.5), GC-specific 91.7%. Cohort 2: 12-mo 100%"],["Comparator","⚠️ Single-arm — no DFS, no hazard ratios"]],"takeaway":"Chemo-free neoadjuvant tremelimumab + durvalumab produced a 60% pCR and 80% major pathological response in resectable MSI-H gastric/GEJ cancer, reproducing NEONIPIGA. Cohort 2 provides the first prospective feasibility data for organ preservation in this disease — 76% reached a clinical CR and avoided surgery, with a single local regrowth salvaged surgically. T4 tumours respond far less well (pCR 17% vs 89%), linked to an M2-macrophage-rich immunosuppressive microenvironment, and are now excluded from the non-operative cohort.","url":"https://app.notion.com/3dc127970a6281f8988cc4f56fa664cc"},{"db":"early","name":"INT-0099","year":1998,"phase":"III","cancer":"NPC","biomarker":null,"setting":"Peri-OP","n":193,"population":"Stage III–IV nasopharyngeal carcinoma (AJCC/UICC), no prior chemotherapy or radiotherapy, performance status 0–2.","treatment":"Concurrent cisplatin chemoradiation → adjuvant cisplatin/5-FU vs radiotherapy alone","tx":["ChT","RT"],"endpoints":[["PFS (co-1°)","✅ NR vs 15 mo; 3-yr 66% vs 26% — HR 4.34 (2.47–7.69) for RT alone vs chemoradiation, P<0.001"],["OS (co-1°)","✅ NR vs 34 mo; 3-yr 76% vs 46% — HR 2.50 (1.29–4.84) for RT alone vs chemoradiation, P=0.005"]],"takeaway":"The landmark trial that made concurrent cisplatin chemoradiation followed by adjuvant chemotherapy the standard of care in stage III–IV nasopharyngeal carcinoma, roughly doubling 3-year PFS and OS over radiotherapy alone. Read the hazard ratios carefully: they are expressed with radiotherapy alone in the numerator, so values above 1 favour chemoradiation.","url":"https://app.notion.com/3dc127970a6281ea8129fe7477684a6b"},{"db":"early","name":"KEYNOTE-585","year":2024,"phase":"III","cancer":"GC","biomarker":"PD-L1","setting":"Peri-OP","n":804,"population":"Untreated, locally advanced, resectable gastric/GEJ adenocarcinoma (T3 or deeper, or node-positive, M0). Global — 143 centres in 24 countries, 47% Asia.","treatment":"Neoadjuvant + adjuvant pembrolizumab + chemotherapy vs placebo + chemotherapy on a cisplatin/capecitabine or 5-FU backbone (separate FLOT safety cohort, n=203)","tx":["ICI","ChT"],"endpoints":[["pCR","✅ 12.9% (9.8–16.6) vs 2.0% (0.9–3.9); Δ 10.9% (7.5–14.8), P<0.00001"],["EFS (1°, investigator)","⚠️ 44.4 vs 25.3 mo — HR 0.81 (0.67–0.99), P=0.0198 against a boundary of P<0.0178, so not met; 2-yr EFS 58% vs 51%"],["OS","❌ 60.7 vs 58.0 mo — HR 0.90 (0.73–1.12), P=0.174, immature"]],"takeaway":"Perioperative pembrolizumab produced a large pCR gain but missed the prespecified EFS significance boundary by a hair (P=0.0198 vs the required 0.0178), and OS was not significant. It is the first global phase 3 of perioperative ICI in resectable gastric/GEJ cancer and a near-miss, contrasting with the subsequently positive MATTERHORN. The main cohort did not use FLOT as the chemotherapy backbone, which limits how far the result travels outside Asia.","url":"https://app.notion.com/3dc127970a6281c58338c000120418e2"},{"db":"met","name":"KEYNOTE-040","year":2019,"phase":"III","cancer":"HEENT","biomarker":"PD-L1","setting":"2L / 3L","n":null,"population":"Recurrent/metastatic HNSCC progressing on platinum, or recurring within 3–6 months of platinum-based definitive therapy — a narrower window than CheckMate-141. Prior cetuximab 60%, ≥2 prior lines ~30%, PD-L1 ≥1% 80%.","treatment":"Pembrolizumab monotherapy vs investigator's choice (methotrexate, docetaxel or cetuximab)","tx":["ICI","ChT"],"endpoints":[["ORR","❌ 14.6% vs 10.1%, P=0.0610"],["PFS","❌ 2.1 vs 2.3 mo (ITT) — HR 0.96 (0.79–1.16)"],["OS (1°)","✅ ITT 8.4 vs 6.9 mo — HR 0.80 (0.65–0.98), P=0.0161"],["OS by PD-L1","✅ CPS ≥1 8.7 vs 7.1 mo, HR 0.74 (0.58–0.93), P=0.0049; ✅ TPS ≥50% 11.6 vs 6.6 mo, HR 0.53 (0.35–0.81), P=0.0014; ❌ CPS <1 HR 1.28"]],"takeaway":"Pembrolizumab monotherapy improves overall survival in platinum-refractory recurrent/metastatic HNSCC with no gain in PFS or response rate. The benefit is confined to PD-L1-positive disease, is largest at TPS ≥50%, and actually reverses below CPS 1. Its eligible population was narrower than CheckMate-141's, admitting only recurrence 3–6 months after definitive therapy.","url":"https://app.notion.com/3dc127970a62814ca700fdf3924c57b4"},{"db":"early","name":"KEYNOTE-054","year":2018,"phase":"III","cancer":"Skin (melanoma)","biomarker":"PD-L1","setting":"Adjuvant","n":1019,"population":"Completely resected stage IIIA (nodal deposit >1 mm), IIIB or IIIC cutaneous melanoma (AJCC 7th). IIIA 15%, IIIB 45%, IIIC 37%; BRAF V600-mutant 40–45%.","treatment":"Pembrolizumab 200 mg q3w × 18 doses (~1 yr) vs placebo","tx":["ICI"],"endpoints":[["RFS, ITT (co-1°)","✅ 1-yr 75.4% vs 61.0%, median NR in both — HR 0.57 (98.4% CI 0.43–0.74), P<0.001"],["RFS, PD-L1-positive (co-1°)","✅ 1-yr 77.1% vs 62.6% (n=853) — HR 0.54 (0.42–0.69), P<0.001"],["RFS, PD-L1-negative","✅ HR 0.47 (99% CI 0.26–0.85)"],["DMFS (2°)","✅ Events 15.2% vs 27.3%"],["OS","⚠️ Not reported"]],"takeaway":"One year of adjuvant pembrolizumab became a standard of care in resected stage III melanoma, cutting the recurrence hazard by roughly 43% with a matching distant-metastasis benefit, and it works regardless of PD-L1 status. OS is still immature, and — unlike CheckMate-238 — no stage IV patients were enrolled, so the result does not extend to resected metastatic disease.","url":"https://app.notion.com/3dc127970a6281f3803bdb22ec829ff2"},{"db":"early","name":"KEYNOTE-716","year":2024,"phase":"III","cancer":"Skin (melanoma)","biomarker":null,"setting":"Adjuvant","n":976,"population":"Resected stage IIB or IIC cutaneous melanoma (AJCC 8th), no treatment other than surgery. IIB 65%. Histological subtype and BRAF status were deliberately not prespecified for subgroup analysis.","treatment":"Adjuvant pembrolizumab 200 mg q3w × 1 yr vs placebo","tx":["ICI"],"endpoints":[["RFS (1°)","✅ 12-mo 90% vs 83%; 36-mo 76.2% vs 63.4% — HR 0.65 (0.46–0.92), P=0.0066; 0.62 (0.49–0.79) at the 4th interim analysis"],["RFS including new primaries","✅ HR 0.64 (0.46–0.88) at the 1st interim analysis"],["DMFS (2°)","✅ 36-mo 84.4% vs 74.7% — HR 0.59 (0.44–0.79), final"],["Endpoint definitions","⚠️ New primary melanomas NOT counted as RFS events and death NOT counted as a DMFS event — unlike CheckMate-76K"],["OS","⚠️ Immature"]],"takeaway":"One year of adjuvant pembrolizumab improves RFS and DMFS in resected stage IIB–IIC melanoma, the stage-II counterpart to CheckMate-76K. Check the endpoint definitions before comparing the two: this trial excluded new primary melanomas from RFS events and deaths from DMFS events, where CheckMate-76K counted both. OS is immature, and BRAF and PD-L1 subgroups were deliberately not prespecified.","url":"https://app.notion.com/3dc127970a628136aa2af53f5e4e9a4b"},{"db":"early","name":"NADINA","year":2024,"phase":"III","cancer":"Skin (melanoma)","biomarker":"BRAF","setting":"Neoadjuvant","n":423,"population":"Stage IIIB–IIID melanoma (AJCC 8th) with clinically overt nodal disease. Unknown primary 20%, in-transit metastases 10%; T2 20%, T3 20%, T4 25%; BRAF-mutant 50%.","treatment":"Perioperative nivolumab 240 mg + ipilimumab 80 mg q3w ×2 → therapeutic lymph node dissection → response-driven therapy (nothing further after a major pathological response; dabrafenib/trametinib ×46 wk if BRAF-mutant, nivolumab ×11 if wild-type) vs adjuvant control (TLND → nivolumab 480 mg q4w ×12)","tx":["ICI","TKI"],"endpoints":[["EFS (1°)","✅ 1-yr 83.7% vs 57.2% — HR 0.32 (99.9% CI 0.15–0.66), P<0.001"],["Pathological response","✅ pCR 47.2% + near-pCR 11.8% = MPR 59.0%; by BRAF, mutant 53.8% vs wild-type 65.3%; radiologic ORR at wk 6 35.8%"],["EFS by BRAF","✅ Mutant HR 0.29 (99.9% CI 0.11–0.79); ⚠️ wild-type HR 0.35 (0.12–1.03)"],["12-mo RFS by pathological response","MPR 95.1% (87.4–99.9) · pPR 76.1% (44.4–99.9) · pNR 57.0% (33.3–97.6); pCR 95.4%, near-pCR 94.1%"],["OS","⏳ Blinded until the prespecified final analysis, 3 years after the last patient is enrolled"]],"takeaway":"Two cycles of neoadjuvant nivolumab/ipilimumab before lymph node dissection cut the event hazard by two-thirds versus standard adjuvant nivolumab, and 59% of patients achieved a major pathological response and needed no further therapy at all. It also establishes pathological response as predictive of survival — 12-month RFS runs from 95% in major responders down to 57% in non-responders — which is what makes response-driven escalation and de-escalation possible. OS is still blinded.","url":"https://app.notion.com/3dc127970a6281aba107ea95f71fe6af"},{"db":"early","name":"NEONIPIGA","year":2022,"phase":"II","cancer":"GC","biomarker":"MSI-H / dMMR","setting":"Peri-OP","n":32,"population":"Resectable dMMR/MSI-H gastric/GEJ adenocarcinoma, cT2–T4 N0/1 M0, ECOG 0–1, age ≤75; French GERCOR study across 11 centres.","treatment":"Neoadjuvant nivolumab + low-dose ipilimumab → surgery → adjuvant nivolumab (single arm)","tx":["ICI"],"endpoints":[["pCR (1°)","✅ 58.6% (17/29 operated), 90% CI 41.8–74.1 (ypT0N0, Becker TRG1a); MPR (TRG1a+1b) 72.4%"],["EFS (2°)","Not reached at 14.9-mo median follow-up; 30/31 (97%) eligible patients alive and event-free (1 postoperative death)"],["OS","Not reached; 30/31 (97%) alive at data cutoff"],["Comparator","⚠️ Single-arm — no DFS, no hazard ratios"]],"takeaway":"Neoadjuvant nivolumab plus low-dose ipilimumab produced a 58.6% pCR in resectable dMMR/MSI-H gastric/GEJ cancer, far above the ~3–11% historically achieved with chemotherapy, with 100% R0 resection and manageable immune-related toxicity. It raised the question of a watch-and-wait, non-operative strategy for MSI-H gastric cancer, tested prospectively in INFINITY cohort 2. Neither PD-L1 CPS nor Lynch-versus-sporadic status predicted pathological response.","url":"https://app.notion.com/3dc127970a62819bae29c3e96833c0c5"},{"db":"early","name":"PRODIGY","year":2021,"phase":"III","cancer":"GC","biomarker":null,"setting":"Peri-OP","n":530,"population":"Korean, ECOG 0–1, cT2–3 node-positive or cT4 any N gastric cancer (AJCC 7th). Stage III 80%.","treatment":"Neoadjuvant DOS (docetaxel/oxaliplatin/S-1) ×3 → surgery → adjuvant S-1 vs surgery → adjuvant S-1","tx":["ChT"],"endpoints":[["pCR","10.4% (23/222) in the neoadjuvant arm; not applicable to the surgery-first arm"],["PFS (1°)","✅ 3-yr 66.3% vs 60.2% — HR 0.70 (0.52–0.95), P=0.023"],["OS","⚠️ 3-yr 74.2% vs 73.4% — HR 0.84 (0.60–1.19), P=0.338; immature and underpowered"]],"takeaway":"The first Asian phase 3 to show that adding neoadjuvant chemotherapy to surgery plus adjuvant S-1 improves progression-free survival in locally advanced gastric cancer. The gain did not carry through to overall survival — the OS analysis was immature and underpowered — so it supports rather than proves the perioperative approach in a D2-gastrectomy population.","url":"https://app.notion.com/3dc127970a628139812cd49caf2c787b"},{"db":"met","name":"RELATIVITY-047","year":2022,"phase":"II/III","cancer":"Skin (melanoma)","biomarker":"PD-L1 / RAF","setting":"1L","n":null,"population":"Age ≥12 with previously untreated, histologically confirmed unresectable stage III or IV melanoma, RECIST v1.1-measurable, ECOG 0–1; evaluable LAG-3 and PD-L1 expression required. Prior adjuvant/neoadjuvant PD-1, CTLA-4, BRAF or MEK therapy allowed if completed ≥6 months before recurrence; uveal melanoma and active untreated brain or leptomeningeal metastases excluded.","treatment":"Fixed-dose relatlimab 160 mg + nivolumab 480 mg q4w as a single 60-min IV infusion vs nivolumab 480 mg q4w","tx":["ICI"],"endpoints":[["PFS (1°, BICR)","✅ 10.1 (6.4–15.7) vs 4.6 (3.4–5.6) mo — HR 0.75 (0.62–0.92), P=0.006; 12-mo PFS 47.7% vs 36.0%"],["PFS by PD-L1","⚠️ ≥1% HR 0.95 (0.68–1.33); <1% HR 0.66 (0.51–0.84)"],["PFS by BRAF","Mutant HR 0.74 (0.54–1.03); wild-type HR 0.76 (0.59–0.98)"],["ORR / DCR","⏳ Blinded at this analysis — assessed only after all patients reach ≥28 wk follow-up and tested after OS in the hierarchy"],["OS","⏳ Blinded — a prespecified interim analysis had not reached significance, so no hazard ratio is available"],["Toxicity","⚠️ Grade 3/4 TRAE 18.9% vs 9.7% — between nivolumab alone and nivo/ipi (~48% in CheckMate-511)"]],"takeaway":"The first phase 3 to validate LAG-3 as a third actionable checkpoint: fixed-dose relatlimab plus nivolumab roughly doubled median PFS over nivolumab alone. OS and ORR were still blinded at this report, so the PFS gain stands alone and this is not yet a survival result. Neither LAG-3 nor PD-L1 expression predicted benefit — the authors state explicitly that neither has a clear role in treatment selection — but the effect held across poor-prognosis subgroups including visceral disease, high tumour burden, elevated LDH, mucosal and acral melanoma, and both BRAF strata.","url":"https://app.notion.com/3dc127970a6281fea2afd14c577f5cf7"},{"db":"early","name":"SWOG S1801","year":2023,"phase":"II","cancer":"Skin (melanoma)","biomarker":"BRAF","setting":"Peri-OP","n":313,"population":"Resectable stage IIIB–IIID or oligometastatic stage IV melanoma (AJCC 8th) with clinically overt nodal disease (resectable node >1.5 cm short axis). Prior ICI and brain metastases excluded. IIIB 40%, IIIC 45%; acral 3%, mucosal 3%; BRAF-mutant ~25%.","treatment":"Perioperative pembrolizumab ×3 → surgery → pembrolizumab ×15 vs surgery → adjuvant pembrolizumab ×18 — 200 mg q3w, 18 total doses in both arms","tx":["ICI"],"endpoints":[["EFS (1°)","✅ 2-yr 72% vs 49%, P=0.004"],["Pathological / radiographic response","✅ pCR 21%; radiographic CR 6% + PR 41% = ORR 47%"],["OS","⏳ Immature — 36 deaths in total (14 vs 22), too few for a definitive comparison"]],"takeaway":"Giving the same total amount of pembrolizumab but moving three doses in front of surgery improved 2-year event-free survival by over 20 percentage points. It is the proof of concept that neoadjuvant ICI beats purely adjuvant ICI — sequence, not dose or duration, is what changed. OS is still immature.","url":"https://app.notion.com/3dc127970a628147b299cdb77a7826f7"},{"db":"met","name":"CheckMate-067","year":2017,"phase":"III","cancer":"Skin (melanoma)","biomarker":"PD-L1 / RAF (BRAF V600)","setting":"1L","n":945,"population":"Previously untreated, histologically confirmed unresectable stage III or stage IV melanoma; ECOG 0–1, measurable disease per RECIST v1.1, known BRAF V600 status. Active brain metastases, ocular melanoma and autoimmune disease were excluded — brain metastases as such were not, and 3.6% had them at baseline. 58% M1c, 36% elevated LDH, 31.5% BRAF-mutant, 23.6% PD-L1-positive at the ≥5% cut-off.","treatment":"Nivolumab 1 mg/kg + ipilimumab 3 mg/kg q3w ×4 → nivolumab 3 mg/kg q2w vs nivolumab 3 mg/kg q2w vs ipilimumab 3 mg/kg q3w ×4 (monotherapy arms given matched placebo)","tx":["ICI"],"endpoints":[["PFS (1°)","✅ 11.5 vs 6.9 vs 2.9 mo — HR vs ipilimumab 0.42 (99.5% CI 0.31–0.57) and 0.57 (0.43–0.76), both P<0.001 (2015); 3-yr PFS 39% vs 32% vs 10%"],["OS (1°)","✅ NR vs 37.6 vs 19.9 mo — HR 0.55 (0.45–0.69) and 0.65 (0.53–0.80), both P<0.001; 3-yr OS 58% vs 52% vs 34%"],["ORR","✅ 58% vs 44% vs 19%; CR deepened from 11.5% to 19% in the combination arm between the 2015 and 2017 reports"],["PFS by PD-L1 (2015)","⚠️ PD-L1 ≥5%: 14.0 vs 14.0 vs 3.9 mo — no gain from adding ipilimumab. PD-L1 <5%: 11.2 vs 5.3 vs 2.8 mo"],["Combination vs nivolumab","⚠️ Descriptive only — OS HR 0.85 (0.68–1.07), PFS HR 0.74 (0.60–0.92) in 2015; never powered for this comparison"],["Toxicity","⚠️ Grade 3–4 TRAE 55–59% vs 16–21% vs 27–28%; 36–39% discontinued — but 67% of those who stopped the combination for toxicity were alive at 3 years"]],"takeaway":"Both nivolumab-containing regimens beat ipilimumab in previously untreated advanced melanoma on both co-primary endpoints — PFS in the 2015 report, OS in 2017 — and the combination's median OS was still not reached at 36 months, with responses deepening rather than multiplying over time (CR 11.5% → 19%). The combination-versus-nivolumab comparison was never powered, but the 2015 PD-L1 split is where the combination earns its place: at PD-L1 ≥5% nivolumab alone matched it (14.0 vs 14.0 mo), while below that threshold it more than doubled PFS (11.2 vs 5.3 mo) — though the 3-year ROC analysis then found PD-L1 alone a poor predictive biomarker with no usable cut-off, and BRAF-mutant and high-LDH patients also favoured the combination descriptively. The costs are grade 3–4 toxicity of 55–59% versus 16–21% for nivolumab alone (though 67% of those who stopped for toxicity were alive at 3 years) and a hard applicability limit: active brain metastases were excluded, so the trial says nothing about CNS-active disease.","url":"https://app.notion.com/3df127970a628133982df336b8cddf4e"},{"db":"met","name":"ARASENS","year":2022,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1306,"population":"mHSPC; 86% metastatic at initial diagnosis; 80% bone mets (M1b), 18% visceral mets (M1c); all patients received ADT + 6 cycles docetaxel as backbone.","treatment":"Darolutamide + ADT + docetaxel vs placebo + ADT + docetaxel (triplet vs doublet)","tx":["ARPI","ChT"],"endpoints":[["OS (1°)","✅ NE vs 48.9 mo — HR 0.68 (0.57–0.80), P<0.001"],["Time to CRPC","✅ NR vs 19.1 mo — HR 0.36 (0.30–0.42), P<0.001"],["Time to pain progression","✅ NR vs 27.5 mo — HR 0.79 (0.66–0.95), P=0.01"]],"takeaway":"Adding darolutamide to ADT + docetaxel (triplet therapy) significantly extended overall survival, cutting the risk of death by roughly a third versus the doublet, without added toxicity beyond the chemotherapy period. Established triplet therapy as a standard option for patients fit for docetaxel.","url":"https://app.notion.com/3df127970a628146936fd523264a599b"},{"db":"met","name":"ARCHES","year":2019,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1150,"population":"mHSPC, de novo or recurrent after local therapy; 63% high-volume disease (CHAARTED criteria); 18% had prior docetaxel.","treatment":"Enzalutamide + ADT vs placebo + ADT","tx":["ARPI"],"endpoints":[["rPFS (1°)","✅ NR vs 19.0 mo — HR 0.39 (0.30–0.50), P<0.001"],["ORR","✅ 83.1% vs 63.7%, P<0.001"],["OS","⏳ Immature at interim — HR 0.81 (0.53–1.25), P=0.34"]],"takeaway":"Enzalutamide added to ADT cut the risk of radiographic progression or death by 61% in mHSPC, with the benefit holding regardless of disease volume or prior docetaxel. OS was still immature at this analysis; a later long-term follow-up (not this paper) confirmed the survival benefit.","url":"https://app.notion.com/3df127970a62814da92dd4b899150518"},{"db":"met","name":"CHAARTED","year":2015,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":790,"population":"mHSPC; ~65% high-volume disease by CHAARTED criteria (visceral mets and/or ≥4 bone lesions with ≥1 beyond the axial skeleton).","treatment":"ADT + docetaxel vs ADT alone","tx":["ChT"],"endpoints":[["OS (1°)","✅ 57.6 vs 44.0 mo — HR 0.61 (0.47–0.80), P<0.001"],["OS, high-volume subgroup","✅ 49.2 vs 32.2 mo — HR 0.60 (0.45–0.81), P<0.001"],["OS, low-volume subgroup","⚠️ HR 0.60 (0.32–1.13), P=0.11 — underpowered, not significant"],["Time to CRPC","✅ 20.2 vs 11.7 mo — HR 0.61 (0.51–0.72), P<0.001"]],"takeaway":"The landmark trial establishing early docetaxel added to ADT (chemohormonal therapy) as standard of care for mHSPC — a 13.6-month OS gain overall, concentrated in high-volume disease. Became the doublet backbone that later triplet-therapy trials (ARASENS, PEACE-1) built on by adding an ARPI.","url":"https://app.notion.com/3df127970a62813381f6c667f533a52f"},{"db":"met","name":"ENZAMET","year":2019,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1125,"population":"mHSPC; 52% high-volume disease; 45% planned early docetaxel at randomization; comparator was a standard nonsteroidal antiandrogen, not ADT alone.","treatment":"Enzalutamide + ADT (± early docetaxel) vs standard nonsteroidal antiandrogen (bicalutamide/nilutamide/flutamide) + ADT (± early docetaxel)","tx":["ARPI"],"endpoints":[["OS (1°)","✅ 3-yr 80% vs 72% — HR 0.67 (0.52–0.86), P=0.002"],["Clinical PFS","✅ 3-yr rate 68% vs 41% — HR 0.40 (0.33–0.49), P<0.001"],["OS, early-docetaxel subgroup","⚠️ HR 0.90 (0.62–1.31) — smaller, not significant; PFS benefit held regardless"],["Safety","⚠️ Seizures in 7 patients (1%) on enzalutamide vs 0 on standard care"]],"takeaway":"Adding enzalutamide to first-line ADT significantly improved OS against a stringent nonsteroidal-antiandrogen comparator. The exploratory subgroup that also received early docetaxel showed an attenuated OS benefit (HR 0.90 vs 0.53) — an unresolved question about optimal triplet vs doublet sequencing — while enzalutamide added toxicity including a small seizure risk.","url":"https://app.notion.com/3df127970a6281c187c3e9cedd40c6c4"},{"db":"met","name":"CAPItello-281","year":2025,"phase":"III","cancer":"Prostate","biomarker":"PTEN (≥90% loss by IHC)","setting":"1L","n":1012,"population":"PTEN-deficient de novo mHSPC (≥90% loss of PTEN protein by IHC); 64–74% high-risk/high-volume disease; 79% Gleason ≥8.","treatment":"Capivasertib + abiraterone + ADT vs placebo + abiraterone + ADT","tx":["ARPI","AKTi"],"endpoints":[["rPFS (1°)","✅ 33.2 vs 25.7 mo — HR 0.81 (0.66–0.98), P=0.034"],["rPFS, 100% PTEN-deficient (post hoc)","✅ 34.1 vs 22.1 mo — HR 0.68 (0.48–0.96)"],["OS","⏳ Immature (26% maturity) — HR 0.90 (0.71–1.15), P=0.401"],["Safety","⚠️ Gr ≥3 AE 67.0% vs 40.4% — diarrhea, hyperglycemia and rash drove the excess"]],"takeaway":"First randomized trial to validate the PI3K/AKT pathway (via PTEN loss) as an actionable biomarker in mHSPC, extending IPATential150's mCRPC finding to the hormone-sensitive setting. Efficacy tracked with how complete the PTEN loss was — a gradient supporting IHC-based patient selection — but OS is still immature and capivasertib added meaningful GI/metabolic/skin toxicity.","url":"https://app.notion.com/3df127970a62816c912afde9a859ba8d"},{"db":"met","name":"GETUG-AFU 15","year":2013,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":385,"population":"Metastatic, hormone-sensitive (non-castrate) prostate cancer; 67–75% metastatic at initial diagnosis; 81% bone metastases.","treatment":"ADT + docetaxel vs ADT alone","tx":["ChT"],"endpoints":[["OS (1°)","❌ 58.9 vs 54.2 mo — HR 1.01 (0.75–1.36), P=0.955"],["Biochemical PFS","✅ 22.9 vs 12.9 mo — HR 0.72 (0.57–0.91), P=0.005"],["Clinical PFS","✅ 23.5 vs 15.4 mo — HR 0.75 (0.59–0.94), P=0.015"]],"takeaway":"A negative trial for its primary OS endpoint, in apparent contrast to CHAARTED — despite clear gains on progression-free survival. Heavy crossover (62% of the ADT-alone arm later received docetaxel) and a longer-than-expected control-arm survival likely diluted the OS signal; larger, later trials (CHAARTED, STAMPEDE) went on to confirm the OS benefit of early docetaxel.","url":"https://app.notion.com/3df127970a6281d8b96dee42ff47a1c6"},{"db":"met","name":"LATITUDE","year":2017,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1199,"population":"High-risk, newly diagnosed metastatic castration-sensitive prostate cancer; all patients had ≥2 of Gleason ≥8, ≥3 bone lesions, or measurable visceral metastasis. 50% symptomatic at baseline.","treatment":"Abiraterone + prednisone + ADT vs placebo + ADT","tx":["ARPI"],"endpoints":[["OS (1°)","✅ NR vs 34.7 mo — HR 0.62 (0.51–0.76), P<0.001"],["rPFS (1°)","✅ 33.0 vs 14.8 mo — HR 0.47 (0.39–0.55), P<0.001"],["Time to PSA progression","✅ 33.2 vs 7.4 mo — HR 0.30 (0.26–0.35), P<0.001"]],"takeaway":"Adding abiraterone to ADT as initial therapy for high-risk mCSPC cut the risk of death by 38% and of radiographic progression by 53%. Benefit was large and consistent enough that the trial unblinded early with crossover offered to the placebo arm.","url":"https://app.notion.com/3df127970a6281f480eddede72d3da81"},{"db":"met","name":"PEACE-1","year":2024,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1173,"population":"De novo metastatic castration-sensitive prostate cancer; 2×2 factorial adding abiraterone and/or prostate radiotherapy to a standard-of-care backbone of ADT ± docetaxel (docetaxel mandatory from 2017). 43% low-volume disease.","treatment":"Standard of care (ADT ± docetaxel) ± abiraterone, ± prostate radiotherapy (74 Gy/37 fx)","tx":["RT","ARPI","ChT"],"endpoints":[["rPFS, low-volume, RT added to abiraterone (1°)","✅ 7.5 vs 4.4 yr — HR 0.65 (99.9% CI 0.36–1.19), P=0.019"],["rPFS, low-volume, RT added to SOC alone","❌ HR 1.08 (99.9% CI 0.65–1.80), P=0.61 — no benefit without abiraterone"],["Castration resistance-free survival, low-volume","✅ 6.9 vs 3.6 yr — HR 0.62 (0.44–0.87), P=0.0056"],["OS, low-volume and overall (pooled RT vs no RT)","❌ HR 0.98 both — no survival benefit from adding RT"]],"takeaway":"Prostate radiotherapy added to an abiraterone-containing systemic backbone improved radiographic PFS and delayed castration resistance in low-volume de novo mCSPC, and cut serious genitourinary events across all volumes — but RT alone (without abiraterone) showed no rPFS benefit, and no arm showed an OS benefit from adding RT. The reported gain is disease-control and symptom-prevention, not survival.","url":"https://app.notion.com/3df127970a62815f993fe034745a3ebd"},{"db":"met","name":"INT-0162 (SWOG S9346)","year":2006,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1345,"population":"Newly diagnosed D2 (metastatic), hormone-naive prostate cancer, all receiving 7-month induction ADT (goserelin + bicalutamide) before eligible responders were randomized to continuous vs intermittent ADT.","treatment":"Induction ADT (goserelin + bicalutamide) → Continuous ADT vs Intermittent ADT","tx":["Endocrine"],"endpoints":[["OS by PSA strata at months 6–7","PSA >4: 13 mo · 0.2–4: 44 mo · ≤0.2 (undetectable): 75 mo"],["Risk of death, PSA 0.2–4 vs >4 ng/mL","✅ HR 0.30 (0.24–0.38), P<0.0001"],["Risk of death, PSA ≤0.2 vs >4 ng/mL","✅ HR 0.17 (0.13–0.21), P<0.0001"],["Continuous vs intermittent ADT (from the trial's primary report, not this substudy)","📝 Median OS 5.8 vs 5.1 yr — continuous numerically better; noninferiority of intermittent not established"]],"takeaway":"This substudy establishes that absolute PSA value after 7 months of induction ADT — especially reaching an undetectable level (≤0.2 ng/mL) — is the strongest independent predictor of survival identified in D2 prostate cancer, with median OS ranging almost sixfold (13 to 75 months) across strata. It is a prognostic-biomarker analysis, not the trial's headline continuous-vs-intermittent ADT comparison, which was reported separately and favored continuous therapy without meeting its noninferiority bar for intermittent dosing.","url":"https://app.notion.com/3df127970a6281ac96c9cd8bb88e7fd6"},{"db":"met","name":"HERO","year":2020,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"N/A — mixed disease settings, not metastatic-specific","n":930,"population":"⚠️ Only 31.7% of patien
