OT triple-negative at initial diagnosis.","treatment":"Sacituzumab govitecan vs physician's-choice single-agent chemo (eribulin 54%, vinorelbine 20%, capecitabine 13%, gemcitabine 12%). No crossover","tx":["ADC","ChT"],"endpoints":[["ORR","✅ 31% vs 4%; median DoR 6.3 vs 3.6 mo"],["DCR","69% vs 32%"],["PFS (1°, BICR)","✅ 5.6 vs 1.7 mo — HR 0.41 (0.32–0.52), P<0.001; ITT HR 0.43"],["OS","✅ 12.1 vs 6.7 mo — HR 0.48 (0.38–0.59), P<0.001"]],"takeaway":"Sacituzumab govitecan decisively beats single-agent chemo in late-line metastatic TNBC on OS, PFS and ORR. Cost is myelosuppression and diarrhoea. The 30% who weren't TNBC at diagnosis is a reminder that re-biopsy at recurrence matters.","url":"https://app.notion.com/3d8127970a6281a288e5c8dae5bda40f"},{"db":"met","name":"ASCENT-03","year":2025,"phase":"III","cancer":"Breast","biomarker":"PD-L1","setting":"1L","n":null,"population":"Treatment-naive metastatic TNBC, ICI-INELIGIBLE (PD-L1 CPS <10). De novo metastatic 31%, DFI 6–12 mo 21%, >12 mo 48%, brain mets 5%.","treatment":"Sacituzumab govitecan vs physician's-choice chemo (taxane, nab-paclitaxel or gem/carbo). 80% crossed over to SG","tx":["ADC","ChT"],"endpoints":[["ORR","↔ 48% vs 46%; but median DoR 12.2 vs 7.2 mo"],["DCR","89% vs 81%"],["PFS (1°, BICR)","✅ 9.7 vs 6.9 mo — HR 0.62 (0.50–0.77), P<0.001"],["OS","⚠️ Immature; 82% crossover"]],"takeaway":"First-line sacituzumab govitecan beats chemo in PD-L1-negative metastatic TNBC — a real gap, since CPS <10 is about 60% of the population. Similar response rate but far more durable. Watch infection: 6 treatment-related deaths, all infectious — consider primary G-CSF.","url":"https://app.notion.com/3d8127970a6281bbbde3d00b8c8dd7b7"},{"db":"met","name":"ASCENT-04","year":2026,"phase":"III","cancer":"Breast","biomarker":"PD-L1","setting":"1L","n":null,"population":"Treatment-naive metastatic TNBC with PD-L1 CPS ≥10. De novo 34%, DFI 6–12 mo 18%, >12 mo 48%, brain mets 3–4%.","treatment":"Sacituzumab govitecan + pembrolizumab vs chemo + pembrolizumab","tx":["ADC","ICI","ChT"],"endpoints":[["ORR","⚠️ 60% vs 53%"],["DCR","92% vs 85%"],["PFS (1°)","✅ 11.2 vs 7.8 mo — HR 0.65 (0.51–0.84), P<0.001"],["OS","⚠️ NR vs NR, immature"]],"takeaway":"Swapping chemo for sacituzumab govitecan alongside pembrolizumab improves PFS in first-line PD-L1-positive metastatic TNBC, with a much lower discontinuation rate (12% vs 31%).","url":"https://app.notion.com/383127970a6281c08643f192942dae0c"},{"db":"met","name":"ASPECCT","year":2014,"phase":"III","cancer":"CRC","biomarker":"RAS","setting":"1L / 2L","n":null,"population":"KRAS exon 2 wild-type mCRC progressing after oxaliplatin, irinotecan and fluoropyrimidine. ECOG 0–2.","treatment":"Panitumumab vs cetuximab (head-to-head non-inferiority)","tx":["Anti-EGFR"],"endpoints":[["ORR","22.0% vs 19.8%"],["DCR","69.4% vs 68.5%"],["PFS","↔ 4.1 vs 4.4 mo — HR 1.00 (0.88–1.14)"],["OS (1°)","↔ 10.4 vs 10.0 mo — HR 0.97 (0.84–1.11), non-inferiority met"]],"takeaway":"Panitumumab is non-inferior to cetuximab in chemo-refractory KRAS exon 2 wild-type mCRC. Choose on schedule and infusion-reaction profile, not efficacy.","url":"https://app.notion.com/32c127970a6280acb5a3c271f0f5d6ea"},{"db":"met","name":"ASPECT","year":null,"phase":"III","cancer":"CRC","biomarker":null,"setting":"2L","n":null,"population":"Not captured in your database.","treatment":"Anti-VEGF (details not entered)","tx":["Anti-VEGF"],"endpoints":[["Status","📝 Row is largely a placeholder"]],"takeaway":"Cetuximab and panitumumab have equivalent efficacy. (Row is sparse — may be a duplicate of ASPECCT worth merging or filling in.)","url":"https://app.notion.com/2e3127970a62809ca061d316f9d80d75"},{"db":"met","name":"ATTRACTION-3","year":2019,"phase":"III","cancer":"Esophagus","biomarker":"PD-L1","setting":"2L","n":419,"population":"Esophageal squamous cell carcinoma only, after one prior fluoropyrimidine-platinum regimen. Asian 96%, prior surgery 49%, prior RT 70%, tumour cell PD-L1 ≥1% in 48%.","treatment":"Nivolumab vs taxane (docetaxel or paclitaxel), open-label","tx":["ICI"],"endpoints":[["ORR","↔ 19% vs 22%; but median DoR ✅ 6.9 vs 3.9 mo"],["DCR","❌ 37% vs 63% — worse"],["PFS","❌ 1.7 vs 3.4 mo — HR 1.08 (0.87–1.34); yet 12-mo PFS 12% vs 7%, curves cross late"],["OS (1°)","✅ 10.9 vs 8.4 mo — HR 0.77 (0.62–0.96), P=0.019; 12-mo 47% vs 34%"]],"takeaway":"Second-line standard for ESCC regardless of PD-L1 (mOS 10.9 mo in both TC <1% and ≥1%). The textbook delayed-immunotherapy-effect pattern: PFS and DCR negative, ORR flat, yet OS clearly positive through durable responses.","url":"https://app.notion.com/3d7127970a628161b6cdd5c4f64619e1"},{"db":"met","name":"AVEX","year":2013,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"ELDERLY (≥70 years) mCRC, ECOG 0–2 — patients not considered fit for doublet chemotherapy.","treatment":"Bevacizumab + capecitabine vs capecitabine alone","tx":["Anti-VEGF"],"endpoints":[["ORR","✅ 19.3% vs 10.0%"],["DCR","✅ 74.3% vs 57.9%"],["PFS (1°)","✅ 9.1 vs 5.1 mo — HR 0.53 (0.41–0.69), P<0.0001"],["OS","⚠️ 20.7 vs 16.8 mo — HR 0.79 (0.57–1.09), P=0.18"]],"takeaway":"For elderly patients unfit for doublets, bevacizumab + capecitabine nearly doubles PFS — a practical first-line option.","url":"https://app.notion.com/2ed127970a6280a787ccdc7026cb72b6"},{"db":"met","name":"AVF2107g (Hurwitz)","year":2005,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"Previously untreated mCRC, ECOG 0–1 (adjuvant therapy allowed if ≥1 yr prior).","treatment":"Bevacizumab + IFL (irinotecan/5-FU/LV) vs IFL alone","tx":["Anti-VEGF"],"endpoints":[["ORR","✅ 44.8% vs 34.8%"],["PFS","✅ 10.6 vs 6.2 mo, P<0.001"],["OS (1°)","✅ 20.3 vs 15.6 mo, P<0.001"]],"takeaway":"The first trial showing bevacizumab improves survival in metastatic colorectal cancer — a 4.7-month OS gain that launched anti-angiogenic therapy in solid tumours.","url":"https://app.notion.com/2e3127970a6280afac66c2082857c466"},{"db":"met","name":"BEACON CRC","year":2019,"phase":"III","cancer":"CRC","biomarker":"RAF (BRAF V600E)","setting":"2L / 3L","n":null,"population":"BRAF V600E-mutant mCRC after 1–2 prior regimens. 50–60% right-sided.","treatment":"Triplet: encorafenib + binimetinib + cetuximab vs doublet: encorafenib + cetuximab vs control (irinotecan/cetuximab or FOLFIRI/cetuximab)","tx":["Anti-EGFR","TKI"],"endpoints":[["ORR","✅ 26% (triplet) vs 20% (doublet) vs 2% (control), P<0.001"],["PFS","✅ 4.3 vs 4.2 vs 1.5 mo — triplet HR 0.38, doublet HR 0.40, both P<0.001"],["OS (1°)","✅ 9.0 vs 8.4 vs 5.4 mo — triplet HR 0.52 (0.39–0.70), doublet HR 0.60 (0.45–0.79), both P<0.001"]],"takeaway":"BRAF-targeted therapy finally works in colorectal cancer when EGFR is blocked simultaneously. The MEK inhibitor adds little — the doublet (encorafenib + cetuximab) is enough, and is what entered practice.","url":"https://app.notion.com/2fc127970a6280a880d0fda9b5dd0792"},{"db":"met","name":"Beamion Lung-01","year":2025,"phase":"I","cancer":"Lung","biomarker":"HER2","setting":"2L / 3L","n":null,"population":"HER2-mutant NSCLC (details not yet captured).","treatment":"Zongertinib — HER2-selective TKI","tx":["TKI"],"endpoints":[["Status","📝 Row is a placeholder — results not captured yet"]],"takeaway":"Placeholder entry for the zongertinib trial in HER2-mutant NSCLC. Worth filling in.","url":"https://app.notion.com/2ac127970a6280acb57fc663caa20ca3"},{"db":"met","name":"BFR14","year":2007,"phase":"III","cancer":"GIST","biomarker":"KIT","setting":"1L","n":58,"population":"Advanced CD117+ GIST, imatinib-naive at entry, in CR/PR/SD after 1 year of imatinib 400 mg/d. 58 randomised of 182 enrolled. Median age 62, ECOG 0–1 in 88%, 82% metastatic.","treatment":"Imatinib interruption vs continuous imatinib 400 mg/d, randomised after 1 year of disease control","tx":["TKI"],"endpoints":[["PFS (1°)","⚠️ 6.1 vs 18.0 mo, P<0.0001 — strongly favours continuation"],["Re-challenge","✅ 92% (24/26) regained control after imatinib reintroduction"],["OS","↔ Medians NR, P=0.61"],["Time to resistance","↔ NS (P=0.32)"]],"takeaway":"Stopping imatinib in responding advanced GIST causes rapid progression — even in radiologic CR. Reintroduction restores control in 92% with no OS or resistance penalty, but interruption still cannot be recommended.","url":"https://app.notion.com/3ce127970a6281e18300d332a6483303"},{"db":"met","name":"BOLERO-2","year":2012,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"2L / 3L","n":null,"population":"Postmenopausal ER+/HER2− advanced breast cancer refractory to a non-steroidal AI. 84% had prior endocrine sensitivity, 68% prior chemo, ~54% in 3rd line or beyond.","treatment":"Everolimus + exemestane vs placebo + exemestane","tx":["Endocrine","Others"],"endpoints":[["ORR","✅ 9.5% vs 0.4%, P<0.001"],["CBR","⚠️ 79.6% vs 59.0%"],["PFS (1°)","✅ 6.9 vs 2.8 mo — HR 0.43 (0.35–0.54), P<0.001"],["OS","⚠️ 31.0 vs 26.6 mo — HR 0.89 (0.73–1.10), P=0.14, NS"]],"takeaway":"First mTOR inhibitor to overcome endocrine resistance after AI failure, more than doubling PFS. Validated PI3K/AKT/mTOR as a real target in HR+ breast cancer — but no OS benefit.","url":"https://app.notion.com/380127970a62800ab13ee8bc1e89e4a5"},{"db":"met","name":"BOND","year":2004,"phase":"III","cancer":"CRC","biomarker":null,"setting":"2L","n":null,"population":"Irinotecan-refractory mCRC, EGFR-inhibitor naive.","treatment":"Cetuximab + irinotecan vs cetuximab alone","tx":["ChT","Anti-EGFR"],"endpoints":[["ORR","✅ 22.9% vs 10.8%, P=0.007"],["DCR","✅ 55.5% vs 32.4%"],["TTP","✅ 4.1 vs 1.5 mo, P<0.001"],["OS","⚠️ 8.6 vs 6.9 mo, P=0.48"]],"takeaway":"Continuing irinotecan alongside cetuximab doubles response rate even in irinotecan-refractory disease — cetuximab appears to reverse irinotecan resistance.","url":"https://app.notion.com/2fe127970a62804cadf6c562b8cba59f"},{"db":"met","name":"BREAKWATER","year":2025,"phase":"III","cancer":"CRC","biomarker":"RAF (BRAF V600E)","setting":"1L","n":null,"population":"Previously untreated BRAF V600E-mutant mCRC. dMMR excluded.","treatment":"Encorafenib + cetuximab + FOLFOX vs standard-of-care chemotherapy","tx":["Anti-EGFR","TKI"],"endpoints":[["ORR","✅ 65.7% vs 37.4%"],["PFS","✅ 12.8 vs 7.1 mo — HR 0.53 (0.41–0.68), P<0.001"],["OS (1°)","✅ 30.3 vs 15.1 mo — HR 0.49 (0.38–0.63), P<0.001"]],"takeaway":"Moves BRAF-targeted therapy to first line and doubles median OS from 15 to 30 months — transformative for a subgroup that historically had the worst prognosis in colorectal cancer.","url":"https://app.notion.com/2fb127970a62800585abcf808405b80c"},{"db":"met","name":"BYLieve","year":2024,"phase":"II","cancer":"Breast","biomarker":"PIK3CA","setting":"2L","n":null,"population":"HR+/HER2− advanced breast cancer with PIK3CA mutation, progressing on a CDK4/6 inhibitor (cohort A). ≤2 prior advanced lines, ≤1 prior chemo.","treatment":"Alpelisib + fulvestrant (single-arm, no control)","tx":["TKI"],"endpoints":[["ORR","19% (23% in measurable disease)"],["CBR","46%; SD 44%"],["PFS","8.0 mo (5.6–8.6)"],["OS","27.3 mo (21.3–32.7)"],["6-mo alive without PD (1°)","53.8%"]],"takeaway":"Confirms alpelisib + fulvestrant retains activity specifically after CDK4/6 inhibitor failure — the population SOLAR-1 didn't cover.","url":"https://app.notion.com/37e127970a6280f8956ad3c9712d4e72"},{"db":"met","name":"CAIRO2","year":2009,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L","n":null,"population":"Previously untreated mCRC, ECOG ≤1, KRAS status unselected.","treatment":"Cetuximab + bevacizumab + CAPOX vs bevacizumab + CAPOX","tx":["Anti-VEGF","Anti-EGFR"],"endpoints":[["ORR","⚠️ 52.7% vs 50%"],["PFS (1°)","❌ 9.4 vs 10.7 mo — HR 1.22 (1.04–1.43), P=0.01 — WORSE"],["OS","❌ 19.4 vs 20.3 mo — HR 1.15, P=0.16"]],"takeaway":"Combining anti-EGFR with anti-VEGF made outcomes worse, not better. Dual biologic blockade is not additive in colorectal cancer — don't combine them.","url":"https://app.notion.com/2e5127970a628033a7d8e713543e4a40"},{"db":"met","name":"CAIRO3","year":2015,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L / 2L","n":null,"population":"mCRC in CR/PR/SD after 6 cycles of induction bevacizumab-CAPOX. CR/PR in 65%.","treatment":"Maintenance bevacizumab + capecitabine vs observation","tx":["Anti-VEGF"],"endpoints":[["PFS1","✅ 8.5 vs 4.1 mo — HR 0.43 (0.36–0.52), P<0.0001"],["PFS2 (1°)","✅ 11.7 vs 8.5 mo — HR 0.67 (0.56–0.81), P<0.0001"],["OS","⚠️ 21.6 vs 18.1 mo — HR 0.89 (0.73–1.07), P=0.22"]],"takeaway":"Maintenance bev + capecitabine after induction delays second progression — the benefit survives re-induction at progression, which is what PFS2 was designed to test.","url":"https://app.notion.com/2ee127970a6280c6996fdf310aa628d1"},{"db":"met","name":"CAIRO5","year":2023,"phase":"III","cancer":"CRC","biomarker":"RAS / RAF","setting":"1L","n":null,"population":"mCRC with initially unresectable liver-only metastases, ECOG 0–1, stratified by right primary tumour or RAS/BRAF mutation.","treatment":"Group A/B (right-sided or RAS/RAF-mut): bev-doublet vs bev-triplet (FOLFOXIRI). Group C/D (left-sided RAS/RAF-wt): bev-doublet vs panitumumab-doublet","tx":["Anti-VEGF","Anti-EGFR"],"endpoints":[["ORR","A/B 33% vs 54%; C/D 53% vs 80%"],["PFS","A/B ✅ 9.0 vs 10.6 mo — HR 0.76 (0.60–0.98), P=0.032; C/D ↔ 10.8 vs 10.4 mo — HR 1.11, P=0.46"],["OS","Not yet reached"]],"takeaway":"For right-sided or RAS/RAF-mutant liver-limited disease, a bevacizumab triplet improves PFS and conversion to resectability. For left-sided RAS/RAF wild-type, adding panitumumab to a doublet raises response rate but not PFS.","url":"https://app.notion.com/2e5127970a6280d0bdcbd46667e32bf1"},{"db":"met","name":"CALGB 150105 / SWOG S0033 (genotype)","year":2008,"phase":"III","cancer":"GIST","biomarker":"KIT / PDGFRA","setting":"1L","n":428,"population":"Advanced CD117+ GIST on first-line imatinib; 428 of 746 successfully genotyped (95.7% success). Genotypes: KIT exon 11 71.3%, KIT exon 9 8.2%, wild-type 17%. Median follow-up 4.5 yr.","treatment":"Prospective genotype–outcome correlative study within imatinib 400 mg/d vs 800 mg/d","tx":["TKI"],"endpoints":[["ORR by genotype","✅ 71.7% (exon 11) vs 44.4% (exon 9) vs 44.6% (WT), P=0.007 / 0.0002"],["Exon 9 by dose","✅ 67% (800 mg) vs 17% (400 mg), OR 9.05, P=0.02"],["TTP","✅ 24.7 vs 16.7 vs 12.8 mo — exon 9 HR 2.07, WT HR 1.85 vs exon 11"],["OS","✅ 60.0 vs 38.4 vs 49.0 mo; dose had no effect on OS in any genotype"]],"takeaway":"KIT exon 11 is the genotype that responds best to imatinib on every measure. Exon 9 tumours respond far better to 800 mg — but the higher dose changed neither time to progression nor overall survival in any genotype.","url":"https://app.notion.com/3ce127970a6281e2bbd9ded5c2537d19"},{"db":"met","name":"CALGB / SWOG 80405","year":2017,"phase":"III","cancer":"CRC","biomarker":"RAS","setting":"1L","n":null,"population":"KRAS wild-type mCRC, ECOG ≤1, previously untreated.","treatment":"Cetuximab vs bevacizumab, each added to FOLFIRI or mFOLFOX6 (a cetuximab+bevacizumab arm was dropped early)","tx":["Anti-VEGF","Anti-EGFR"],"endpoints":[["ORR","55.2% vs 59.6%"],["PFS","❌ 10.5 vs 10.8 mo — HR 0.95 (0.84–1.08), P=0.45"],["OS (1°)","❌ 29.9 vs 29.0 mo — HR 0.92 (0.78–1.09), P=0.34"]],"takeaway":"Cetuximab and bevacizumab are interchangeable as the first-line biologic in KRAS wild-type mCRC — median OS ~29 months either way. What determines outcome is the whole treatment sequence, not the first biologic. (Sidedness analyses later refined this.)","url":"https://app.notion.com/2e5127970a6280b2a782c22e82743035"},{"db":"met","name":"CAPItello-291","year":2023,"phase":"III","cancer":"Breast","biomarker":"PIK3CA / AKT","setting":"2L","n":null,"population":"HR+/HER2− advanced breast cancer relapsing/progressing during or after an AI. ~70% had prior CDK4/6 inhibitor. Enrolled regardless of PAM-pathway alteration; diabetics with HbA1c <8.0% allowed.","treatment":"Capivasertib + fulvestrant vs placebo + fulvestrant","tx":["TKI"],"endpoints":[["PFS overall (co-1°)","✅ 7.2 vs 3.6 mo — HR 0.60 (0.51–0.71)"],["PFS AKT-altered (co-1°)","✅ 7.3 vs 3.1 mo — HR 0.50 (0.38–0.65)"],["OS overall","❌ 29.4 vs 28.6 mo — HR 1.00 (0.83–1.19)"],["OS AKT-altered","⚠️ 28.5 vs 30.4 mo — HR 0.83 (0.63–1.10)"]],"takeaway":"Capivasertib doubles PFS after AI failure, with the benefit concentrated in PAM-pathway-altered tumours. No OS benefit in either population.","url":"https://app.notion.com/37d127970a628073a038f315eebd7399"},{"db":"met","name":"CAPTAIN-1st","year":2021,"phase":"III","cancer":"NPC","biomarker":null,"setting":"1L","n":263,"population":"Treatment-naive recurrent/metastatic NPC, all Asian (China-only). Liver mets ~50%, baseline EBV DNA positive ~70%, 64% with prior chemoradiation.","treatment":"Camrelizumab + gemcitabine/cisplatin vs placebo + GP, induction then maintenance. No crossover","tx":["ICI","ChT"],"endpoints":[["PFS (1°, IRC)","✅ 10.8 vs 6.9 mo — HR 0.51 (0.37–0.69); 12-mo 45.8% vs 20.5%"],["OS","✅ 34.5 vs 26.6 mo — HR 0.74 (0.55–0.99), P=0.047; age-adjusted HR 0.65"],["5-yr OS","✅ 37.8% vs 24.2% (Δ13.6%) — a visible survival plateau"]],"takeaway":"The only R/M NPC trial with 5-year follow-up and the current long-term benchmark. Caveat: OS was not multiplicity-controlled and the P value is marginal. Directly actionable finding — rapid plasma EBV DNA clearance within 3 cycles separated 5-yr OS of 46.8% from 7.5%, and 97% of 5-year survivors were EBV-negative at baseline or cleared early.","url":"https://app.notion.com/3d9127970a628152b5ffc69be84d9b96"},{"db":"met","name":"CARES-310","year":2023,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":543,"population":"Unresectable HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Asian 80%. Vp4 portal vein invasion excluded.","treatment":"Camrelizumab + rivoceranib (apatinib) vs sorafenib","tx":["ICI","TKI"],"endpoints":[["ORR","✅ 25% vs 6%"],["DCR","80% vs 54%; median DoR 14.8 vs 9.2 mo"],["PFS (co-1°)","✅ 5.6 vs 3.7 mo — HR 0.52 (0.41–0.65), P<0.0001"],["OS (co-1°)","✅ 22.1 vs 15.2 mo — HR 0.62 (0.49–0.80), P<0.0001"]],"takeaway":"An all-oral-plus-ICI alternative to atezo/bev in first-line HCC, with the longest median OS reported in a phase III at 22 months. Heavily Asian population.","url":"https://app.notion.com/2a2127970a628045a17fdd3dfb3672f4"},{"db":"met","name":"CASPIAN","year":2019,"phase":"III","cancer":"Lung (ES-SCLC)","biomarker":null,"setting":"1L","n":null,"population":"Treatment-naive extensive-stage SCLC, PS 0–1. Stable CNS metastases allowed.","treatment":"Durvalumab + etoposide/platinum ×4 → durvalumab maintenance vs EP ×6 (a durva + tremelimumab + EP arm was also studied)","tx":["ICI"],"endpoints":[["ORR","✅ 79% unconfirmed / 68% confirmed"],["DCR","~86%"],["PFS","✅ 5.1 vs 5.4 mo — HR 0.78 (0.65–0.94)"],["OS (1°)","✅ 13.0 vs 10.3 mo — HR 0.73 (0.59–0.91), P=0.0047"]],"takeaway":"Established chemo-immunotherapy as the first-line standard in extensive-stage SCLC. Note the PFS curves barely separate — as so often with ICI, the benefit is in the tail.","url":"https://app.notion.com/339127970a6280b69dcbdb340b63e48d"},{"db":"met","name":"CELESTIAL","year":2018,"phase":"III","cancer":"HCC","biomarker":null,"setting":"2L / 3L","n":707,"population":"Advanced HCC, Child-Pugh A, ECOG ≤1, BCLC B/C, progressing on sorafenib.","treatment":"Cabozantinib vs placebo","tx":["TKI"],"endpoints":[["ORR","4% vs 1% (RECIST)"],["DCR","64% vs 33%"],["PFS","✅ 5.2 vs 1.9 mo — HR 0.44 (0.36–0.52), P<0.001"],["OS (1°)","✅ 10.2 vs 8.0 mo — HR 0.76 (0.63–0.92), P=0.005"]],"takeaway":"Cabozantinib works after sorafenib failure, including in third line — a modest but real OS gain in a setting with few options.","url":"https://app.notion.com/2a2127970a6280499c53f95e3b51f12f"},{"db":"met","name":"CLEOPATRA","year":2012,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"1L","n":808,"population":"Treatment-naive HER2-positive advanced breast cancer. Prior (neo)adjuvant chemo allowed if ≥12-month interval. 88% visceral disease.","treatment":"Pertuzumab + trastuzumab + docetaxel vs placebo + trastuzumab + docetaxel","tx":["Anti-HER2","ChT"],"endpoints":[["ORR","✅ 80.2% vs 69.3% — OR 1.77, P=0.001"],["PFS (1°)","✅ 18.5 vs 12.4 mo — HR 0.62 (0.51–0.75), P<0.001"],["OS","✅ 57.1 vs 40.8 mo — HR 0.68 (0.56–0.84), P<0.001; 8-yr OS 37% vs 23%"]],"takeaway":"Dual HER2 blockade with docetaxel (THP) became the first-line standard for HER2+ metastatic breast cancer, with a 16-month median OS gain and a genuine long-term plateau.","url":"https://app.notion.com/385127970a6281269030e707092ba0dc"},{"db":"met","name":"CheckMate-040","year":2017,"phase":"I/II","cancer":"HCC","biomarker":null,"setting":"1L / 2L","n":null,"population":"Advanced HCC, Child-Pugh A or B7.","treatment":"Nivolumab monotherapy","tx":["ICI"],"endpoints":[["ORR","20%"],["DCR","64%"]],"takeaway":"The dose-escalation/expansion study that earned nivolumab FDA accelerated approval in HCC — later withdrawn when CheckMate-459 failed to confirm OS benefit.","url":"https://app.notion.com/2a2127970a62801ab455cc73851fe70c"},{"db":"met","name":"CheckMate-275","year":2017,"phase":"II","cancer":"UC","biomarker":"PD-L1","setting":"2L","n":null,"population":"Metastatic urothelial carcinoma after ≥1 line of platinum chemotherapy.","treatment":"Nivolumab monotherapy (single-arm)","tx":["ICI"],"endpoints":[["ORR","ITT 19.6%; PD-L1 ≥1% 23.8%; PD-L1 <1% 16.1%"],["PFS","ITT 2.0 mo"],["OS","ITT 8.74 mo; PD-L1 ≥1% 11.30 mo; PD-L1 <1% 5.95 mo"]],"takeaway":"Single-agent nivolumab has modest activity in platinum-refractory urothelial carcinoma, roughly doubling median OS in PD-L1-positive vs negative patients.","url":"https://app.notion.com/2bc127970a6280069608f67011d91aac"},{"db":"met","name":"CheckMate-459","year":2022,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":743,"population":"Advanced HCC, Child-Pugh A, macrovascular invasion 30%.","treatment":"Nivolumab vs sorafenib","tx":["ICI"],"endpoints":[["ORR","15% vs 7%"],["PFS","❌ 3.7 vs 3.8 mo — HR 0.93 (0.79–1.10)"],["OS (1°)","⚠️ 16.4 vs 14.7 mo — HR 0.85 (0.72–1.02), did not meet significance"]],"takeaway":"Single-agent nivolumab failed to beat sorafenib in first-line HCC — the trial that led to withdrawal of the accelerated approval. ICI in HCC needs a partner (bevacizumab, ipilimumab, or a TKI).","url":"https://app.notion.com/2a2127970a6280738268ef4eef2d3af1"},{"db":"met","name":"CheckMate-648","year":2022,"phase":"III","cancer":"Esophagus","biomarker":"PD-L1","setting":"1L","n":970,"population":"Almost all esophageal squamous cell carcinoma, treatment-naive. 70% Asian; tumour cell PD-L1 ≥1% in 49%.","treatment":"Nivolumab + cisplatin/5-FU vs nivolumab + ipilimumab vs chemotherapy alone (1:1:1, open-label)","tx":["ICI","ChT"],"endpoints":[["ORR (PD-L1 ≥1%)","✅ 53% (nivo-chemo) vs 35% (nivo-ipi) vs 20% (chemo)"],["OS PD-L1 ≥1% (1°)","✅ Nivo-chemo 15.4 vs 9.1 mo, HR 0.54, P<0.001; nivo-ipi 13.7 mo, HR 0.64, P=0.001"],["OS ITT","✅ Nivo-chemo HR 0.74, P=0.002; nivo-ipi HR 0.78, P=0.01"],["PFS PD-L1 ≥1%","✅ Nivo-chemo HR 0.65, P=0.002; ❌ nivo-ipi HR 1.02, P=0.90"],["PFS ITT nivo-ipi","❌ HR 1.26 — actively worse early"]],"takeaway":"Both nivo-chemo and nivo-ipi became first-line standards for ESCC, but benefit is driven by PD-L1 ≥1% (HR ≈1 below that). Nivo-ipi is chemo-free with the highest CR rate (18%) — but 30% progress early, so it demands close monitoring.","url":"https://app.notion.com/3d7127970a6281a7a60fdbbba89dc264"},{"db":"met","name":"CheckMate-8HW","year":2024,"phase":"III","cancer":"CRC","biomarker":"dMMR","setting":"1L–3L","n":null,"population":"dMMR/MSI-H metastatic colorectal cancer. 60% right-sided, 25% BRAF-mutant, 20% RAS-mutant.","treatment":"Nivolumab + ipilimumab vs nivolumab alone vs chemotherapy","tx":["ICI"],"endpoints":[["ORR","Nivo-ipi 73% vs nivo 61%"],["PFS (1°)","✅ 24-mo 72% (nivo-ipi) vs 55% (nivo) vs 14% (chemo) — HR 0.21, P<0.0001"],["OS","⚠️ 48-mo 78% (nivo-ipi) vs 65% (nivo)"]],"takeaway":"Dual checkpoint blockade beats nivolumab alone in dMMR mCRC, mainly by preventing early progression. Nivolumab monotherapy may still suffice in right-sided or RAS/BRAF-mutant disease.","url":"https://app.notion.com/2ad127970a6280c39659d7f8e03efb70"},{"db":"met","name":"CheckMate-901","year":2023,"phase":"III","cancer":"UC","biomarker":null,"setting":"1L","n":null,"population":"Treatment-naive advanced urothelial carcinoma — cisplatin-ELIGIBLE only.","treatment":"Nivolumab + gemcitabine/cisplatin vs gem/cis","tx":["ICI","ChT"],"endpoints":[["ORR","57.6% vs 43.1%"],["PFS (co-1°)","✅ 7.9 vs 7.6 mo — HR 0.72 (0.59–0.88), P=0.001"],["OS (co-1°)","✅ 21.7 vs 18.9 mo — HR 0.78 (0.63–0.96), P=0.02"]],"takeaway":"Adding nivolumab to gem/cis improves OS in cisplatin-eligible advanced urothelial carcinoma. Restricted to cisplatin-eligible patients — the cisplatin-ineligible population is served by EV-pembrolizumab.","url":"https://app.notion.com/2ba127970a6280c08282fb444faf425a"},{"db":"met","name":"CheckMate-9DW","year":2025,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":668,"population":"Advanced HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Asian 40%. Vp4 excluded.","treatment":"Nivolumab + ipilimumab vs lenvatinib (85%) or sorafenib","tx":["ICI"],"endpoints":[["ORR","✅ 36% vs 13%; median DoR 30.4 mo"],["PFS","❌ 9.1 vs 9.2 mo — HR 0.87 (0.72–1.06)"],["OS (1°)","✅ 23.7 vs 20.6 mo — HR 0.79 (0.65–0.96), P=0.018"]],"takeaway":"Chemo-free dual checkpoint blockade improves OS and produces remarkably durable responses (median DoR 30 months) in first-line HCC — despite no PFS benefit. A bevacizumab-free option for patients with varices or bleeding risk.","url":"https://app.notion.com/2a2127970a628059bac1e57cf4340c78"},{"db":"met","name":"CodeBreaK 300","year":2023,"phase":"III","cancer":"CRC","biomarker":"RAS (KRAS G12C)","setting":"2L / 3L","n":null,"population":"Chemorefractory KRAS G12C-mutant metastatic colorectal cancer.","treatment":"Sotorasib 960 mg or 240 mg + panitumumab vs trifluridine/tipiracil or regorafenib","tx":["Anti-EGFR","TKI"],"endpoints":[["ORR","✅ 26.4% (960 mg) vs 5.7% (240 mg) vs 0% (control)"],["DCR","71.7%"],["PFS (1°)","✅ 5.6 vs 3.9 vs 2.0 mo — 960 mg HR 0.48 (0.30–0.78), P=0.005; 240 mg HR 0.59, P=0.036"],["OS","⏳ Maturing"]],"takeaway":"KRAS G12C inhibition finally works in colorectal cancer when paired with EGFR blockade — the same lesson BEACON taught for BRAF. Full dose is clearly better.","url":"https://app.notion.com/2ff127970a6280d7bf94e425458cbdc4"},{"db":"met","name":"CodeBreaK 301","year":null,"phase":"III (Ongoing)","cancer":"CRC","biomarker":"RAS (KRAS G12C)","setting":"1L","n":null,"population":"Treatment-naive KRAS G12C-mutant metastatic colorectal cancer.","treatment":"Sotorasib + panitumumab + FOLFIRI vs bevacizumab-FOLFIRI","tx":["Anti-EGFR","TKI","ChT"],"endpoints":[["Status","⏳ Ongoing — no phase III results yet"],["Phase I lead-in (CodeBreaK 101, n=40)","ORR 57.5%, DCR 92.5%, PFS 8.2 mo, OS 17.9 mo"]],"takeaway":"Moving the sotorasib-panitumumab combination to first line. The phase I signal (ORR 58%) is strong; the phase III will decide.","url":"https://app.notion.com/306127970a62807ea3deebb484ecb5a8"},{"db":"met","name":"CONFIRM","year":2013,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"2L","n":null,"population":"Postmenopausal HR+ advanced breast cancer progressing after prior endocrine therapy.","treatment":"Fulvestrant 500 mg (q2w loading then monthly) vs 250 mg monthly","tx":["Endocrine"],"endpoints":[["ORR","9.1% vs 10.2%"],["PFS (1°)","✅ 6.5 vs 5.5 mo — HR 0.80 (0.68–0.94), P=0.006"],["OS","✅ 26.4 vs 22.3 mo — HR 0.81 (0.69–0.96), P=0.02"]],"takeaway":"Simple dose optimisation: 500 mg fulvestrant beats 250 mg on both PFS and OS with no added toxicity. Established the 500 mg dose used in every subsequent combination trial.","url":"https://app.notion.com/2d1127970a6280458faacdef074fb228"},{"db":"met","name":"CORRECT","year":2013,"phase":"III","cancer":"CRC","biomarker":null,"setting":"3L","n":null,"population":"Heavily pretreated mCRC — about half had ≥4 prior regimens. ECOG 0 in 52–57%.","treatment":"Regorafenib vs placebo","tx":["TKI","Anti-VEGF"],"endpoints":[["ORR","⚠️ 1.0% vs 0.4%"],["DCR","✅ 41% vs 15%"],["PFS","✅ 1.9 vs 1.7 mo — HR 0.49 (0.42–0.58), P<0.0001"],["OS (1°)","✅ 6.4 vs 5.0 mo — HR 0.77 (0.64–0.94), P=0.005 — absolute gain only 1.4 mo"]],"takeaway":"The first non-biomarker-selected third-line option in mCRC. Statistically positive but clinically modest — a 1.4-month median OS gain with real toxicity, which is why patient selection matters.","url":"https://app.notion.com/302127970a628055bda5cfa8334b0b14"},{"db":"met","name":"COSMIC-312","year":2022,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":649,"population":"Advanced HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Asian 30%, Vp4 invasion 20%.","treatment":"Atezolizumab + cabozantinib vs sorafenib","tx":["ICI","TKI"],"endpoints":[["ORR","11% vs 4%"],["DCR","78% vs 65%"],["PFS (co-1°)","✅ 6.8 vs 4.2 mo — HR 0.63 (0.44–0.91), P=0.0012"],["OS (co-1°)","❌ 15.4 vs 15.5 mo — HR 0.90 (0.69–1.18), P=0.44"]],"takeaway":"PFS without OS — the combination did not improve survival over sorafenib. A reminder that not every ICI-TKI pairing in HCC delivers; contrast with IMbrave150 and CARES-310.","url":"https://app.notion.com/2a2127970a6280bea0e2ecace359f262"},{"db":"met","name":"CROWN","year":2020,"phase":"III","cancer":"Lung","biomarker":"ALK","setting":"1L","n":null,"population":"Previously untreated advanced ALK-positive NSCLC, ECOG 0–2. Asymptomatic treated or untreated CNS metastases allowed.","treatment":"Lorlatinib vs crizotinib","tx":["TKI"],"endpoints":[["ORR","✅ 76% vs 58% (BICR); 81% vs 63% at 5 yr"],["PFS (1°)","✅ NR vs 9.3 mo — HR 0.28 (0.19–0.41), P<0.001; 5-yr investigator HR 0.19 (0.13–0.27)"],["5-yr PFS","✅ 60% vs 8%"],["Intracranial progression","✅ 5-yr HR 0.06 (0.03–0.12)"],["OS","⚠️ Immature — HR 0.72 (0.41–1.25) at interim"]],"takeaway":"Median PFS still not reached at 5 years, with 60% of patients progression-free — the longest reported PFS of any single-agent targeted therapy in any metastatic solid tumour. Intracranial control is near-absolute (94% risk reduction).","url":"https://app.notion.com/381127970a6281ed8ed1ff08e7da45db"},{"db":"met","name":"CRYSTAL","year":2009,"phase":"III","cancer":"CRC","biomarker":"RAS","setting":"1L","n":null,"population":"Previously untreated EGFR-expressing mCRC, ECOG ≤2, KRAS status unselected at enrolment (analysed retrospectively).","treatment":"Cetuximab + FOLFIRI vs FOLFIRI","tx":["Anti-EGFR","ChT"],"endpoints":[["ORR","✅ 46.9% vs 38.7%"],["PFS (1°)","✅ ITT 8.9 vs 8.0 mo — HR 0.85 (0.72–0.99), P=0.048; KRAS wt 9.9 vs 8.7 mo — HR 0.68, P=0.02"],["OS","⚠️ ITT 19.9 vs 18.6 mo — HR 0.93, P=0.31; KRAS wt 24.9 vs 21.0 mo — HR 0.84"]],"takeaway":"Improved PFS but not OS overall — and the retrospective KRAS analysis showed benefit confined to wild-type tumours. One of the trials that made RAS testing mandatory before anti-EGFR therapy.","url":"https://app.notion.com/2e3127970a628076aceafee842aa9245"},{"db":"met","name":"dd-MVAC (Sternberg)","year":2006,"phase":"III","cancer":"UC","biomarker":null,"setting":"1L","n":null,"population":"Advanced urothelial carcinoma, cisplatin-eligible.","treatment":"Dose-dense MVAC q2w (with G-CSF) vs classic MVAC q4w","tx":["ChT"],"endpoints":[["ORR","✅ 72% vs 58%"],["PFS","✅ 9.5 vs 8.0 mo — HR 0.73 (0.56–0.95), P=0.017"],["OS","✅ 15.1 vs 14.9 mo — HR 0.76 (0.58–0.99), P=0.042"]],"takeaway":"Compressing MVAC to every 2 weeks with growth factor support improves response and survival while reducing toxicity. Still more toxic than gem/cis, which is why GC dominates practice.","url":"https://app.notion.com/2bb127970a6280efb258e27bec88695a"},{"db":"met","name":"DeFi","year":2023,"phase":"III","cancer":"Sarcoma (desmoid)","biomarker":null,"setting":"1L–3L","n":null,"population":"Progressing desmoid tumours. Median age 34, 64% female, 77% previously treated (median 2 lines), 24% prior sorafenib. 41% multifocal, 75% extra-abdominal.","treatment":"Nirogacestat 150 mg BID vs placebo — an oral γ-secretase (Notch) inhibitor","tx":["Others"],"endpoints":[["ORR","✅ 41% vs 8%, P<0.001; median time to response 5.6 mo"],["PFS (1°)","✅ NE vs 15.1 mo — HR 0.29 (0.15–0.55), P<0.001; consistent across all subgroups"],["1-/2-yr EFS","✅ 85% vs 53% / 76% vs 44%"],["Patient-reported outcomes","✅ All 7 improved — pain, symptoms, physical and role function, QoL"]],"takeaway":"First FDA-approved therapy for desmoid tumours, with a 71% reduction in progression risk and benefit across every patient-reported outcome. Prior sorafenib did not blunt the effect. Watch GI, skin and ovarian toxicity.","url":"https://app.notion.com/3d5127970a628144b99ec725a02e53a9"},{"db":"met","name":"DeLLphi-304","year":2025,"phase":"III","cancer":"Lung (SCLC)","biomarker":null,"setting":"2L","n":null,"population":"Relapsed SCLC after one prior line of chemotherapy (71% prior ICI). ECOG 0–1. Stable brain metastases allowed (45%). No DLL3 expression requirement.","treatment":"Tarlatamab (DLL3 × CD3 bispecific T-cell engager) vs chemotherapy","tx":["BsAb"],"endpoints":[["ORR","35% vs 20%"],["DCR","68% vs 64%"],["PFS","✅ 4.2 vs 3.7 mo (RMST at 12 mo 5.3 vs 4.3, P=0.002)"],["OS (1°)","✅ 13.6 vs 8.3 mo — HR 0.60 (0.47–0.77), P<0.001"]],"takeaway":"A bispecific T-cell engager delivering a 5-month median OS gain in relapsed SCLC with FEWER grade ≥3 adverse events than chemotherapy. Manage cytokine release syndrome (56%, mostly grade 1–2); ICANS is infrequent (6%).","url":"https://app.notion.com/349127970a6280668b3ae5a8b9899c28"},{"db":"met","name":"DeLLphi-305","year":null,"phase":"I (Ongoing)","cancer":"Lung (SCLC)","biomarker":null,"setting":"1L","n":null,"population":"Extensive-stage SCLC entering maintenance after first-line chemo-immunotherapy.","treatment":"Maintenance tarlatamab + durvalumab vs durvalumab alone","tx":["ICI","BsAb"],"endpoints":[["OS signal","1-yr OS 80% per phase I DeLLphi-303 (vs ~60% 9-mo OS in IMpower133)"],["Status","⏳ Ongoing"]],"takeaway":"Moving tarlatamab into first-line maintenance. Early single-arm signal looks strong but is not a randomised comparison.","url":"https://app.notion.com/348127970a6280aaaa83ca2fb4df3ec2"},{"db":"met","name":"DESTINY-PanTumor02","year":2023,"phase":"II","cancer":"Pan-tumour (UC, endometrial, cervical, ovary, BTC, other)","biomarker":"HER2","setting":"2L","n":null,"population":"HER2-expressing (IHC 2+ or 3+ by gastric cancer criteria) advanced solid tumours after ≥1 prior line.","treatment":"Trastuzumab deruxtecan (single-arm, tumour-agnostic)","tx":["ADC"],"endpoints":[["ORR","All 37.1%; HER2 IHC 3+ 61.3%"],["PFS","6.9 mo"],["OS","13.4 mo"]],"takeaway":"The basis of T-DXd's tumour-agnostic HER2 indication. Centrally confirmed IHC 3+ is where the real benefit lives — 61% ORR vs 37% overall.","url":"https://app.notion.com/2bf127970a62808c8092fd0045c3980f"},{"db":"met","name":"DESTINY-Breast03","year":2022,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"2L","n":524,"population":"HER2+ metastatic breast cancer with prior trastuzumab and taxane. ~62% prior pertuzumab, ~70% visceral disease, ~16% baseline CNS metastases.","treatment":"T-DXd vs T-DM1","tx":["ADC"],"endpoints":[["ORR","✅ 79.7% vs 34.2%"],["DCR","96.6% vs 76.8%"],["PFS (1°, BICR)","✅ 28.8 vs 6.8 mo — HR 0.28 (0.22–0.37), P<0.001"],["OS","✅ 52.6 vs 42.7 mo — HR 0.73 (0.56–0.94)"]],"takeaway":"A four-fold PFS improvement — 28.8 vs 6.8 months — and the longest OS ever reported in second-line HER2+ metastatic breast cancer. T-DXd is unambiguously the second-line standard.","url":"https://app.notion.com/385127970a6281028b60ceeced1d6004"},{"db":"met","name":"DESTINY-Breast09","year":2026,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"1L","n":null,"population":"Treatment-naive HER2-positive advanced breast cancer. Prior (neo)adjuvant chemo allowed if ≥12-mo interval. 73.4% visceral disease, 6.5% CNS mets, 54% HR+.","treatment":"T-DXd + pertuzumab vs THP (taxane + trastuzumab + pertuzumab)","tx":["ADC","Anti-HER2","ChT"],"endpoints":[["ORR","✅ 85.1% vs 78.6% — OR 1.59 (1.09–2.32)"],["PFS (1°)","✅ 40.7 vs 26.9 mo — HR 0.56 (0.44–0.71), P<0.00001"],["OS","⚠️ NR, immature"]],"takeaway":"Directly challenges the CLEOPATRA-THP standard, extending first-line PFS past 40 months. Watch for interstitial lung disease — the recurring cost of T-DXd.","url":"https://app.notion.com/385127970a6281529299dc948e017540"},{"db":"met","name":"DESTINY-Breast12","year":2024,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"2L / 3L","n":504,"population":"HER2+ advanced breast cancer with ≥1 prior anti-HER2 regimen, ≤2 prior metastatic regimens, tucatinib-naive. Two cohorts: brain metastases (n=263, stable or ACTIVE) and no brain metastases (n=241).","treatment":"T-DXd 5.4 mg/kg q3w (single-arm)","tx":["ADC"],"endpoints":[["ORR","51.7% (brain mets) / 62.7% (no brain mets)"],["CNS ORR","✅ 71.7% in the brain-mets cohort"],["PFS","17.3 mo (13.7–22.1) in brain mets; 12-mo PFS 61.6%"],["OS","NR; 12-mo OS ~90% in both cohorts, immature"]],"takeaway":"T-DXd works in the brain — 72% intracranial response — and works whether the brain metastases are stable or active. Removes the old reason to reach for tucatinib first.","url":"https://app.notion.com/385127970a62810084e6da2d7ef98a84"},{"db":"met","name":"DESTINY-CRC01","year":2021,"phase":"II","cancer":"CRC","biomarker":"HER2","setting":"3L","n":null,"population":"HER2-expressing, RAS wild-type mCRC. Prior anti-HER2 therapy allowed. Median 4 prior lines.","treatment":"Trastuzumab deruxtecan (single-arm, by HER2 IHC cohort)","tx":["ADC"],"endpoints":[["ORR","✅ IHC 3+ 45.3%; IHC 2+/1+ 0%"],["DCR","3+ 83.0% vs 2+ 60.0% vs 1+ 22.2%"],["PFS","3+ 6.9 vs 2+ 2.1 vs 1+ 1.4 mo"],["OS","3+ 15.5 vs 2+ 7.3 vs 1+ 7.7 mo"]],"takeaway":"Striking activity in HER2 IHC 3+ colorectal cancer and literally zero responses below that — including IHC 2+/FISH+. Unlike breast cancer, there is no HER2-low story in CRC. DESTINY-CRC02 settled 5.4 mg/kg as the dose.","url":"https://app.notion.com/2ff127970a6280dc9337e8cbad4bbd21"},{"db":"met","name":"EMBRACA","year":2018,"phase":"III","cancer":"Breast","biomarker":"BRCA","setting":"2L / 3L","n":null,"population":"Germline BRCA1/2-mutant, HER2-negative metastatic breast cancer with ≤3 prior chemotherapy lines. Prior taxane and anthracycline required; prior platinum for metastatic disease allowed.","treatment":"Talazoparib vs physician's-choice single-agent chemotherapy","tx":["PARPi","ChT"],"endpoints":[["ORR","✅ 62.6% vs 27.2%, P<0.001"],["CBR at 24 wk","✅ 68.6% vs 36.1%, P<0.001"],["PFS (1°)","✅ 8.6 vs 5.6 mo — HR 0.54 (0.41–0.71), P<0.001"],["OS","❌ 19.3 vs 19.5 mo — HR 0.85 (0.67–1.07), P=0.17"]],"takeaway":"Talazoparib more than doubles response rate and improves PFS in germline BRCA-mutant metastatic breast cancer, but no OS benefit — likely diluted by heavy crossover and later-line enrolment compared with OlympiAD.","url":"https://app.notion.com/385127970a628110ab31e375ef953bd8"},{"db":"met","name":"EMERALD","year":2022,"phase":"III","cancer":"Breast","biomarker":"ESR1","setting":"2L / 3L","n":null,"population":"Postmenopausal ER+/HER2− advanced breast cancer progressing on prior endocrine therapy; ≤1 prior chemo. ALL required prior CDK4/6 inhibitor plus fulvestrant or AI. 47.8% ESR1-mutant; visceral mets ~68–71%.","treatment":"Elacestrant (oral SERD) vs standard-of-care endocrine therapy","tx":["SERD"],"endpoints":[["PFS ITT (co-1°)","✅ 2.8 vs 1.9 mo — HR 0.70 (0.55–0.88), P=0.002"],["PFS ESR1-mutant (co-1°)","✅ 3.8 vs 1.9 mo — HR 0.55 (0.39–0.77), P=0.0005"],["OS ITT","⚠️ HR 0.75 (0.54–1.04), P=0.08, immature"],["OS ESR1-mutant","⚠️ HR 0.59 (0.36–0.96), immature"]],"takeaway":"First oral SERD to show PFS benefit after CDK4/6 inhibitor failure, with the effect concentrated in ESR1-mutant disease (45% vs 30% risk reduction). Be honest about scale: the ITT median PFS gain is under a month.","url":"https://app.notion.com/380127970a6280639571c71c1a27b788"},{"db":"met","name":"EMILIA","year":2012,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"2L","n":null,"population":"HER2+ metastatic breast cancer with prior trastuzumab and taxane. No prior T-DM1, lapatinib or capecitabine.","treatment":"T-DM1 vs lapatinib + capecitabine","tx":["ADC","TKI","ChT"],"endpoints":[["ORR","✅ 43.6% vs 30.8%, P<0.001"],["PFS (co-1°)","✅ 9.6 vs 6.4 mo — HR 0.65 (0.55–0.77), P<0.001"],["OS (co-1°)","✅ 30.9 vs 25.1 mo — HR 0.68 (0.55–0.85), P<0.001 (27% crossover by final analysis)"]],"takeaway":"The first antibody-drug conjugate to beat chemotherapy on both PFS and OS, with less toxicity. Made T-DM1 the second-line standard — a position it held until DESTINY-Breast03.","url":"https://app.notion.com/385127970a62817a8f34eea17a355aab"},{"db":"met","name":"EORTC 62024","year":2021,"phase":"III","cancer":"GIST","biomarker":null,"setting":"Adjuvant","n":908,"population":"Localised intermediate-/high-risk GIST after R0–R1 resection. Median age 59, 86% PS 0, 55% gastric, 11% tumour rupture. 112 centres, 12 countries.","treatment":"Adjuvant imatinib 400 mg/d × 2 years vs observation","tx":["TKI"],"endpoints":[["Imatinib-failure-free survival (1°)","⚠️ NOT MET — HR 0.87 (0.65–1.15), P=0.31"],["RFS","✅ 5-yr 70.4% vs 62.7% — HR 0.71 (0.57–0.89), P=0.002; 10-yr 62.5% vs 61.0% — curves converge"],["OS","⚠️ 10-yr 80.4% vs 78.2% — HR 0.88 (0.65–1.21), P=0.43"]],"takeaway":"Two years of adjuvant imatinib improved RFS but missed its primary endpoint and showed no OS benefit — and by 10 years the RFS curves converge. Adjuvant imatinib delays relapse rather than curing it.","url":"https://app.notion.com/3ce127970a6281c396c8e93b043dc1bc"},{"db":"met","name":"EV-301","year":2021,"phase":"III","cancer":"UC","biomarker":null,"setting":"2L","n":null,"population":"Advanced urothelial carcinoma progressing after BOTH platinum chemotherapy AND a checkpoint inhibitor. ECOG 0–1.","treatment":"Enfortumab vedotin vs physician's-choice chemotherapy","tx":["ADC"],"endpoints":[["ORR","✅ 41.3% vs 18.6%"],["DCR","✅ 71.9% vs 53.4%"],["PFS","✅ 5.55 vs 3.71 mo — HR 0.63 (0.53–0.76), P<0.00001"],["OS (1°)","✅ 12.91 vs 8.94 mo — HR 0.70 (0.58–0.85), P=0.00015"]],"takeaway":"Enfortumab vedotin delivers a clear OS benefit in the hardest urothelial population — progressed on both platinum and ICI. Watch skin toxicity, hyperglycaemia and peripheral neuropathy.","url":"https://app.notion.com/2bc127970a62802dbc66dc9f8cd1ebb1"},{"db":"met","name":"EV-302 / KEYNOTE-A39","year":2024,"phase":"III","cancer":"UC","biomarker":null,"setting":"1L","n":null,"population":"Previously untreated locally advanced or metastatic urothelial carcinoma, ECOG 0–2, eGFR ≥30 — cisplatin-eligible AND ineligible.","treatment":"Enfortumab vedotin + pembrolizumab vs gemcitabine/platinum","tx":["ICI","ADC"],"endpoints":[["ORR","✅ 67.7% vs 44.4%"],["PFS (co-1°)","✅ 12.5 vs 6.3 mo — HR 0.45 (0.38–0.54), P<0.001"],["OS (co-1°)","✅ 33.6 vs 15.9 mo — HR 0.47, P<0.001"]],"takeaway":"More than doubled median OS — 33.6 vs 15.9 months — and displaced platinum chemotherapy as first-line standard in advanced urothelial carcinoma. One of the largest OS effects in any solid-tumour phase III.","url":"https://app.notion.com/2ba127970a6280d3befbf406e7b94126"},{"db":"met","name":"FALCON","year":2016,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"1L","n":null,"population":"Postmenopausal HR+ advanced breast cancer, ENDOCRINE-THERAPY NAIVE.","treatment":"Fulvestrant 500 mg vs anastrozole","tx":["Endocrine"],"endpoints":[["ORR","46% vs 45%"],["DCR","78% vs 74%"],["PFS (1°)","✅ ITT 16.6 vs 13.8 mo — HR 0.797 (0.637–0.999), P=0.049"],["By site","⚠️ Non-visceral 22.3 vs 13.8 mo; ❌ visceral 13.8 vs 15.9 mo"],["OS","⚠️ 44.8 vs 42.7 mo — HR 0.97, P=0.76"]],"takeaway":"Fulvestrant beats anastrozole in endocrine-naive disease — but the entire benefit comes from non-visceral disease, where PFS is 22 vs 14 months. In visceral disease it was numerically worse.","url":"https://app.notion.com/2d1127970a6280e18a80d762f1675dc6"},{"db":"met","name":"FIRE-3","year":2014,"phase":"III","cancer":"CRC","biomarker":"RAS","setting":"1L","n":null,"population":"KRAS exon 2 wild-type mCRC, ECOG ≤2, previously untreated (adjuvant allowed if ≥6 months prior).","treatment":"Cetuximab vs bevacizumab, both with FOLFIRI","tx":["Anti-VEGF","Anti-EGFR"],"endpoints":[["ORR (1°)","❌ 62.0% vs 58.0% — OR 1.18, P=0.18, primary endpoint missed"],["PFS","❌ 10.0 vs 10.3 mo — HR 1.06, P=0.55"],["OS","✅ ITT 28.7 vs 25.0 mo — HR 0.77 (0.62–0.96), P=0.017; RAS wt 33.1 vs 25.6 mo"]],"takeaway":"The trial that argued for anti-EGFR first in RAS wild-type mCRC — a 7.5-month OS gain in RAS wild-type despite identical response rate and PFS. Note the tension with CALGB 80405, which found no difference; sidedness later reconciled them.","url":"https://app.notion.com/2e3127970a6280e8b945ef16cba50beb"},{"db":"met","name":"FLAURA","year":2018,"phase":"III","cancer":"Lung","biomarker":"EGFR","setting":"1L","n":null,"population":"Treatment-naive EGFR-mutant advanced NSCLC — Ex19del 60%, L858R 40%. Stable brain mets 40%. Crossover allowed.","treatment":"Osimertinib vs gefitinib or erlotinib","tx":["TKI"],"endpoints":[["ORR","⚠️ 80% vs 76%"],["DCR","97% vs 92%"],["PFS (1°)","✅ 18.9 vs 10.2 mo — HR 0.46 (0.37–0.57), P<0.001"],["OS","✅ 38.6 vs 31.8 mo — HR 0.80 (0.64–1.00), P=0.046"]],"takeaway":"Established first-line osimertinib as standard of care in EGFR-mutant NSCLC — near-doubled PFS and an OS benefit that survived crossover.","url":"https://app.notion.com/2ac127970a6280e0b3ffec5b5826707f"},{"db":"met","name":"FLAURA2","year":2023,"phase":"III","cancer":"Lung","biomarker":"EGFR","setting":"1L","n":null,"population":"Treatment-naive EGFR-mutant advanced NSCLC — Ex19del 60%, L858R 40%. Stable brain mets 40% (brain MRI at baseline only). Crossover allowed.","treatment":"Osimertinib + platinum/pemetrexed vs osimertinib alone","tx":["TKI","ChT"],"endpoints":[["ORR","✅ 83% vs 76%"],["PFS (1°)","✅ 25.5 vs 16.7 mo — HR 0.62 (0.49–0.79), P<0.001"],["OS","✅ 47.5 vs 37.6 mo — HR 0.77 (0.61–0.96), P=0.02"]],"takeaway":"Adding chemotherapy to osimertinib extends both PFS and OS — but at a real toxicity cost, so reserve it for high-risk patients: CNS or liver metastases, TP53 co-mutation, or persistent ctDNA.","url":"https://app.notion.com/2ac127970a6280118e20d344667354e2"},{"db":"met","name":"FRESCO-2","year":2023,"phase":"III","cancer":"CRC","biomarker":null,"setting":"3L","n":null,"population":"Refractory mCRC — median 4 prior regimens, all had received TAS-102 and/or regorafenib. ECOG 0 in ~33%.","treatment":"Fruquintinib vs placebo","tx":["Anti-VEGF","TKI"],"endpoints":[["ORR","⚠️ 1.5% vs 0%"],["DCR","✅ 55.5% vs 16.1%"],["PFS","✅ 3.7 vs 1.8 mo — HR 0.32 (0.27–0.39), P<0.001"],["OS (1°)","✅ 7.4 vs 4.8 mo — HR 0.66 (0.55–0.80), P<0.001"]],"takeaway":"A genuine OS benefit after TAS-102 and regorafenib have already failed — extends the refractory treatment sequence by one more line.","url":"https://app.notion.com/303127970a628068bc3bcfb471ea28d8"},{"db":"met","name":"Gem-carboplatin (EORTC 30986)","year":2012,"phase":"III","cancer":"UC","biomarker":null,"setting":"1L","n":null,"population":"Advanced urothelial carcinoma, cisplatin-INELIGIBLE.","treatment":"Gemcitabine + carboplatin vs methotrexate/carboplatin/vinblastine (M-CAVI)","tx":["ChT"],"endpoints":[["ORR","41.2% vs 30.3%"],["PFS","5.8 vs 4.2 mo — HR 1.04 (0.80–1.35)"],["OS","9.3 vs 8.1 mo — HR 0.94 (0.72–1.22)"]],"takeaway":"Established gem/carbo as the chemotherapy backbone for cisplatin-ineligible patients — better tolerated than M-CAVI with similar survival. Now largely superseded by EV-pembrolizumab.","url":"https://app.notion.com/2bb127970a628086aba4d1f69f0754e6"},{"db":"met","name":"Gem-cisplatin (von der Maase)","year":2005,"phase":"III","cancer":"UC","biomarker":null,"setting":"1L","n":405,"population":"Advanced urothelial carcinoma, cisplatin-eligible.","treatment":"Gemcitabine + cisplatin vs MVAC","tx":["ChT"],"endpoints":[["ORR","49.4% vs 45.7%"],["PFS","↔ 7.7 vs 8.3 mo — HR 1.09 (0.89–1.34)"],["OS","↔ 14.0 vs 15.2 mo — HR 1.09 (0.88–1.34)"]],"takeaway":"Gem/cis is non-inferior to MVAC with substantially less toxicity — which is why it became the practical first-line standard for two decades.","url":"https://app.notion.com/2bb127970a62801eb242cf07e1405e63"},{"db":"met","name":"GERCOR (Tournigand)","year":2004,"phase":"III","cancer":"CRC","biomarker":null,"setting":"1L / 2L","n":null,"population":"Previously untreated mCRC, ECOG ≤2 (adjuvant allowed if ≥6 months prior).","treatment":"FOLFIRI → FOLFOX vs FOLFOX → FOLFIRI (sequence comparison)","tx":["ChT"],"endpoints":[["ORR","1L 56% vs 54%; 2L 15% vs 4%"],["PFS","PFS1 8.5 vs 8.0 mo; PFS2 4.2 vs 2.5 mo; time to 2nd progression 14.2 vs 10.9 mo, P=0.64"],["OS","↔ 21.5 vs 20.6 mo, P=0.99"]],"takeaway":"The order doesn't matter — what matters is that patients receive all three active agents (oxaliplatin, irinotecan, fluorouracil) across their treatment course. FOLFOX does work better than FOLFIRI in second line.","url":"https://app.notion.com/2e2127970a62808d81dbfa7d68f28657"},{"db":"met","name":"HER2CLIMB","year":2020,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"3L","n":612,"population":"HER2+ metastatic breast cancer after trastuzumab, pertuzumab and T-DM1. ECOG 0–1. Uniquely, ACTIVE and untreated brain metastases were allowed (~47%).","treatment":"Tucatinib + trastuzumab + capecitabine vs placebo + trastuzumab + capecitabine","tx":["TKI","ChT","Anti-HER2"],"endpoints":[["ORR","✅ 40.6% vs 22.8%"],["PFS (1°)","✅ 7.8 vs 5.6 mo — HR 0.54 (0.42–0.71), P<0.001"],["OS","✅ 21.9 vs 17.4 mo — HR 0.66 (0.50–0.88), P=0.005"],["Brain mets subgroup","✅ PFS HR 0.48, P<0.001 — benefit fully maintained"]],"takeaway":"The first regimen designed around brain metastases, and the first HER2 trial to enrol patients with active untreated CNS disease. Improves OS in heavily pretreated disease with CNS benefit intact.","url":"https://app.notion.com/385127970a6281558b82e690066bd5e0"},{"db":"met","name":"HERACLES-A","year":2016,"phase":"II","cancer":"CRC","biomarker":"HER2","setting":"3L","n":null,"population":"KRAS wild-type, HER2-amplified refractory mCRC. Prior anti-HER2 therapy excluded.","treatment":"Trastuzumab + lapatinib (single-arm)","tx":["Anti-HER2","TKI"],"endpoints":[["ORR","30%"],["DCR","70%"],["PFS","4.7 mo"],["OS","10.0 mo"]],"takeaway":"First proof that dual HER2 blockade is active in HER2-amplified colorectal cancer — opened HER2 as a therapeutic target in a disease where it affects only ~3% of patients.","url":"https://app.notion.com/2ff127970a62806a872be975982c6233"},{"db":"met","name":"HIMALAYA","year":2022,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":782,"population":"Unresectable HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Asian 40%. Vp4 excluded.","treatment":"STRIDE: single priming dose tremelimumab + durvalumab vs durvalumab alone vs sorafenib","tx":["ICI"],"endpoints":[["ORR","20.1% (STRIDE) vs 17% (durva) vs 5.1% (sorafenib); median DoR 22.3 mo"],["PFS","❌ STRIDE 3.78 vs 4.07 mo — HR 0.90 (0.77–1.05); durva HR 1.02"],["OS (1°)","✅ STRIDE 16.4 vs 13.7 mo — HR 0.78 (0.67–0.92), P=0.0035"],["Durvalumab alone","↔ 16.6 vs 13.8 mo — HR 0.86 (0.73–1.03), non-inferior"]],"takeaway":"A single priming dose of tremelimumab added to durvalumab improves OS over sorafenib without bevacizumab — so no bleeding risk and no need for endoscopy. PFS was flat; the benefit is entirely in durable responses.","url":"https://app.notion.com/2a2127970a628031bb15f0f20774204d"},{"db":"met","name":"IMbrave150","year":2020,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":501,"population":"Unresectable HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Vp4 invasion 14%. Esophageal varices not completely excluded (endoscopy required).","treatment":"Atezolizumab + bevacizumab 15 mg/kg vs sorafenib","tx":["ICI","Anti-VEGF"],"endpoints":[["ORR","✅ 30% vs 11% (RECIST); 35% vs 14% (mRECIST)"],["DCR","74% vs 55%; median DoR 18.1 vs 14.9 mo"],["PFS (co-1°)","✅ 6.9 vs 4.3 mo — HR 0.65 (0.53–0.81), P=0.001"],["OS (co-1°)","✅ 19.2 vs 13.4 mo — HR 0.66 (0.52–0.85), P=0.0009"]],"takeaway":"The trial that ended a decade of sorafenib monotherapy in first-line HCC. Atezo/bev remains the reference regimen — but requires screening endoscopy for varices before starting bevacizumab.","url":"https://app.notion.com/2a2127970a628042bdd8d1c4ebe909dd"},{"db":"met","name":"IMforte","year":2025,"phase":"III","cancer":"Lung (ES-SCLC)","biomarker":null,"setting":"1L maintenance","n":null,"population":"Treatment-naive extensive-stage SCLC with no progression after 4 cycles of IMpower133-style induction. ECOG 0–1. CNS metastases excluded.","treatment":"Maintenance lurbinectedin + atezolizumab vs atezolizumab alone","tx":["ICI","ChT"],"endpoints":[["ORR (maintenance phase)","19% vs 10%"],["PFS (1°)","✅ From maintenance 5.4 vs 2.1 mo — HR 0.54 (0.43–0.67), P<0.0001; 12-mo 20.5% vs 12.0%"],["OS","✅ 13.2 vs 10.6 mo — HR 0.73 (0.57–0.95), P=0.017; 12-mo 56.3% vs 44.1%"]],"takeaway":"Adding lurbinectedin to maintenance atezolizumab improves OS in extensive-stage SCLC — the first real advance in maintenance since IMpower133. More haematologic toxicity; G-CSF is mandatory.","url":"https://app.notion.com/339127970a62801a8459f83f5ff83eba"},{"db":"met","name":"IMpower150","year":2018,"phase":"III","cancer":"Lung","biomarker":null,"setting":"1L / 2L","n":null,"population":"Chemo-naive non-squamous NSCLC. 13% had progressed on a prior TKI (EGFR/ALK) — most reported data is the wild-type population.","treatment":"Atezolizumab + bevacizumab + carboplatin/paclitaxel (ABCP) vs bevacizumab + chemo vs atezolizumab + chemo","tx":["ICI","Anti-VEGF","ChT"],"endpoints":[["ORR","63.5% vs 48.0%"],["PFS","✅ Wild-type 8.3 vs 6.8 mo — HR 0.62 (0.52–0.74), P<0.001; EGFR/ALK-mutant 9.7 vs 6.1 mo"],["OS","✅ 19.5 vs 14.7 mo — HR 0.80 (0.67–0.95), P=0.02"]],"takeaway":"The four-drug ABCP regimen improves OS in non-squamous NSCLC, and notably retains activity in the EGFR/ALK-mutant subgroup after TKI failure — where ICI usually fails.","url":"https://app.notion.com/2ac127970a62808d8c26d9573ee8ca4c"},{"db":"met","name":"IMpower133","year":2018,"phase":"III","cancer":"Lung (ES-SCLC)","biomarker":null,"setting":"1L","n":null,"population":"Treatment-naive extensive-stage SCLC. Stable CNS metastases allowed.","treatment":"Atezolizumab + etoposide/carboplatin → atezolizumab maintenance vs placebo + EC","tx":["ICI","ChT"],"endpoints":[["ORR","60.2% vs 64.4%"],["PFS (co-1°)","✅ 5.2 vs 4.3 mo — HR 0.77 (0.62–0.96)"],["OS (co-1°)","✅ 12.3 vs 10.3 mo — HR 0.70 (0.54–0.91)"]],"takeaway":"The first trial in 20 years to improve survival in extensive-stage SCLC. Modest in absolute terms (2 months) but it defined the chemo-immunotherapy backbone.","url":"https://app.notion.com/339127970a62806fb979da457eaa31ba"},{"db":"met","name":"INAVO-120","year":2024,"phase":"III","cancer":"Breast","biomarker":"PIK3CA","setting":"1L","n":null,"population":"PIK3CA-mutated HR+/HER2− locally advanced or metastatic breast cancer, relapsing DURING or ≤12 months after adjuvant endocrine therapy — deliberately the highest-risk, endocrine-resistant group. De novo metastatic excluded. HbA1c <6.0% required. 93% ctDNA PIK3CA-positive.","treatment":"Inavolisib + palbociclib + fulvestrant vs placebo + palbociclib + fulvestrant","tx":["TKI","CDK4/6i","SERD"],"endpoints":[["ORR","✅ 58.4% vs 25.0%"],["PFS (1°)","✅ 15.0 vs 7.3 mo — HR 0.43 (0.32–0.59)"],["OS","✅ NR vs 31.1 mo — HR 0.64 (0.43–0.97); OS benefit confirmed at ASCO 2025"]],"takeaway":"A triplet that doubles PFS and now shows an OS benefit in the most endocrine-resistant PIK3CA-mutant population. Inavolisib's mutant selectivity means better tolerability than alpelisib.","url":"https://app.notion.com/37a127970a62800980f7febcbd0e34f7"},{"db":"met","name":"JAVELIN Bladder 100","year":2020,"phase":"III","cancer":"UC","biomarker":"PD-L1","setting":"1L maintenance","n":null,"population":"Advanced urothelial carcinoma with disease control (CR/PR/SD) after 4–6 cycles of first-line gemcitabine/platinum.","treatment":"Maintenance avelumab + best supportive care vs BSC alone","tx":["ICI"],"endpoints":[["ORR","ITT 9.7% vs 1.4%; PD-L1+ 13.8% vs 1.2%"],["PFS","✅ ITT 3.7 vs 2.0 mo — HR 0.62 (0.52–0.75); PD-L1+ 5.7 vs 2.1 mo"],["OS (1°)","✅ ITT 21.4 vs 14.3 mo — HR 0.69 (0.56–0.86), P=0.001"],["OS PD-L1+","✅ 30.9 vs 18.4 mo — HR 0.56 (0.40–0.79), P<0.001"]],"takeaway":"Switch-maintenance avelumab after platinum gives a 7-month OS gain — but the benefit is confined to PD-L1-positive patients; PD-L1-negative saw none. Was the standard until EV-pembrolizumab moved first-line.","url":"https://app.notion.com/2ba127970a62801c9ae2e2bba0377070"},{"db":"met","name":"JUPITER-02","year":2023,"phase":"III","cancer":"NPC","biomarker":null,"setting":"1L","n":289,"population":"Treatment-naive recurrent/metastatic NPC, predominantly in China. Liver mets ~40%, baseline EBV-positive ~60%, 45% prior chemoradiation.","treatment":"Toripalimab + gemcitabine/cisplatin vs placebo + GP, induction then maintenance. No crossover","tx":["ICI","ChT"],"endpoints":[["ORR","77.4% vs 66.4%, P=0.034; median DoR 10.0 vs 5.7 mo (HR 0.50)"],["DCR","87.7% vs 79.7%"],["PFS (1°, BICR)","✅ 21.4 vs 8.2 mo — HR 0.52, P<0.0001; 3-yr 44.8% vs 25.4%"],["OS","✅ NR vs 33.7 mo — HR 0.63, P=0.008; 3-yr 64.5% vs 49.2%"]],"takeaway":"Largest first-line R/M NPC trial and the first to show a clear OS benefit. Cleanest demonstration that adding PD-1 blockade to GP doesn't raise total grade ≥3 toxicity (chemo dominates that) but roughly doubles immune-related AEs. No crossover and only ~13% control-arm ICI use makes the OS signal genuinely interpretable.","url":"https://app.notion.com/3d9127970a6281e78d77e9cda85dc4cc"},{"db":"met","name":"KANDLELIT-012","year":null,"phase":"III","cancer":"CRC","biomarker":"dMMR","setting":"3L","n":null,"population":"Not yet entered in your database.","treatment":"Not entered","tx":[],"endpoints":[["Status","📝 Row is a placeholder — nothing captured yet"]],"takeaway":"Empty placeholder row in your Notion DB — worth filling in or removing.","url":"https://app.notion.com/306127970a628040881ee0ce63bddd76"},{"db":"met","name":"KCSG-LU15-09","year":2019,"phase":"II","cancer":"Lung","biomarker":"EGFR","setting":"1L–3L","n":null,"population":"UNCOMMON EGFR mutations — G719X 53%, L861Q 25%, S768I 22%. No prior EGFR-TKI. 61% first-line, 25% baseline CNS metastases.","treatment":"Osimertinib 80 mg daily (single-arm)","tx":["TKI"],"endpoints":[["ORR (1°)","50% overall — L861Q 78% (7/9), G719X 53% (10/19), S768I 38% (3/8)"],["DCR","89%"],["PFS","8.2 mo overall; 15.2 mo in L861Q"],["OS","NR; 12-mo 86%, 18-mo 56%"]],"takeaway":"First prospective evidence for osimertinib in uncommon EGFR mutations. L861Q is the standout — 78% response and 15-month PFS, outperforming historical afatinib data.","url":"https://app.notion.com/3ac127970a628151bc18f8f857c22509"},{"db":"met","name":"KEYNOTE-122","year":2023,"phase":"III","cancer":"NPC","biomarker":null,"setting":"2L / 3L","n":233,"population":"Platinum-pretreated, EBV-positive recurrent/metastatic NPC. Global trial; 86.7% were second line or later, 50% liver mets, 88% prior radiotherapy. Post-protocol crossover 60%.","treatment":"Pembrolizumab monotherapy vs investigator's-choice chemo (capecitabine 33%, gemcitabine 40%, docetaxel 25%)","tx":["ICI","ChT"],"endpoints":[["OS (1°)","❌ NOT MET — 17.2 vs 15.3 mo; HR 0.90 (0.67–1.19), P=0.226"],["PFS","❌ 4.1 vs 5.5 mo — numerically favours chemotherapy"],["Toxicity","✅ Grade 3–5 treatment-related AEs 10.3% vs 43.8%"]],"takeaway":"Negative trial, and the standing evidence that benefit in R/M NPC requires BOTH a chemotherapy backbone AND the first-line setting. The one clear win is toxicity — a four-fold reduction in severe AEs, which may still matter for a heavily pretreated patient prioritising quality of life.","url":"https://app.notion.com/3d9127970a6281dcb83dc16e04a198f5"},{"db":"met","name":"KEYNOTE-016","year":null,"phase":"—","cancer":"CRC","biomarker":"dMMR","setting":"2L","n":null,"population":"Not entered in your database.","treatment":"Not entered","tx":[],"endpoints":[["Status","📝 Row is a placeholder — nothing captured yet"]],"takeaway":"Empty placeholder — this is the landmark Le et al. trial that first showed dMMR predicts PD-1 response across tumour types. Worth filling in.","url":"https://app.notion.com/33f127970a6280aa8a88d2e208fac46c"},{"db":"met","name":"KEYNOTE-024","year":2016,"phase":"III","cancer":"Lung","biomarker":"PD-L1","setting":"1L","n":null,"population":"Treatment-naive advanced NSCLC with PD-L1 TPS ≥50%, any histology. EGFR/ALK excluded.","treatment":"Pembrolizumab monotherapy vs platinum chemotherapy","tx":["ICI"],"endpoints":[["ORR","44.8% vs 27.8%"],["PFS (1°)","✅ 10.3 vs 6.0 mo — HR 0.50 (0.37–0.68)"],["OS","✅ HR 0.60 (0.41–0.89)"]],"takeaway":"Established single-agent pembrolizumab as first-line standard for PD-L1-high NSCLC — chemotherapy-free treatment with better survival. Long-term follow-up shows a ~30% 5-year survival plateau.","url":"https://app.notion.com/2ac127970a628083b929f9a6a72a5056"},{"db":"met","name":"KEYNOTE-042","year":2019,"phase":"III","cancer":"Lung","biomarker":"PD-L1","setting":"1L","n":null,"population":"Treatment-naive advanced NSCLC with PD-L1 TPS ≥1%, any histology.","treatment":"Pembrolizumab monotherapy vs platinum chemotherapy","tx":["ICI"],"endpoints":[["Status","📝 Results not captured in your DB — design only"]],"takeaway":"Extended the KEYNOTE-024 question down to TPS ≥1%. Worth filling in the numbers — the key nuance is that the apparent benefit at TPS 1–49% is largely driven by the TPS ≥50% subgroup.","url":"https://app.notion.com/2ac127970a6280ad92f0d7339cd51018"},{"db":"met","name":"KEYNOTE-045","year":2017,"phase":"III","cancer":"UC","biomarker":"PD-L1","setting":"2L","n":null,"population":"Advanced urothelial carcinoma after 1–2 prior lines, ECOG 0–2.","treatment":"Pembrolizumab vs investigator's-choice chemotherapy (paclitaxel, docetaxel or vinflunine)","tx":["ICI"],"endpoints":[["ORR","ITT 21.1% vs 11.4%; CPS ≥10 21.6% vs 6.7%"],["PFS","❌ 2.1 vs 3.3 mo — HR 0.98 (0.81–1.19), P=0.42"],["OS (1°)","✅ 10.3 vs 7.4 mo — HR 0.73 (0.59–0.91), P=0.002"]],"takeaway":"Classic ICI pattern — PFS flat or worse, OS clearly better through durable responses. Established pembrolizumab as second-line standard in urothelial carcinoma. Watch the early non-responders who progress fast.","url":"https://app.notion.com/2bb127970a62802fa144e67f87f2de0a"},{"db":"met","name":"KEYNOTE-048","year":2019,"phase":"III","cancer":"HEENT","biomarker":"PD-L1","setting":"1L","n":null,"population":"Previously untreated recurrent/metastatic HNSCC, locally incurable, ECOG 0–1.","treatment":"Pembrolizumab monotherapy OR pembrolizumab + platinum/5-FU vs cetuximab + platinum/5-FU (EXTREME regimen)","tx":["ICI","ChT"],"endpoints":[["ORR","Pembro mono 16.9% vs EXTREME 36.0%; pembro+chemo 36.3% vs 36.3%"],["OS pembro mono","✅ CPS ≥20 HR 0.61 (0.45–0.83); CPS ≥1 HR 0.78 (0.64–0.96); total HR 0.85, non-inferior (11.6 vs 10.7 mo)"],["OS pembro+chemo","✅ Total 13.0 vs 10.7 mo — HR 0.77 (0.63–0.93)"],["PFS","⚠️ Pembro mono 2.3 vs 5.2 mo — worse early; pembro+chemo 4.9 vs 5.1 mo, not improved"]],"takeaway":"Established pembrolizumab-based first-line therapy in R/M HNSCC. The trade-off is explicit: monotherapy gives better OS in CPS ≥1/≥20 with far less toxicity but lower response rate and worse early PFS — so add chemo when the patient needs a fast response.","url":"https://app.notion.com/354127970a628049a09ff4f5d25cfc08"},{"db":"met","name":"KEYNOTE-177","year":2020,"phase":"III","cancer":"CRC","biomarker":"dMMR","setting":"1L","n":null,"population":"Treatment-naive dMMR/MSI-H metastatic colorectal cancer. 60% right-sided, 40% RAS/BRAF-mutant.","treatment":"Pembrolizumab vs chemotherapy (investigator's choice ± bevacizumab/cetuximab)","tx":["ICI"],"endpoints":[["ORR","43.8% vs 33.1%"],["Primary resistance","⚠️ 30% progressed as best response on pembrolizumab"],["PFS (co-1°)","✅ 16.5 vs 8.2 mo — HR 0.60 (0.45–0.79)"],["OS (co-1°)","⚠️ 77.5 vs 36.7 mo — HR 0.73 (0.53–0.99)"]],"takeaway":"Made first-line pembrolizumab standard for dMMR mCRC, with a remarkable 77-month median OS. But 30% have primary resistance and progress immediately — RAS/BRAF-mutant patients may still need chemotherapy, which is the gap CheckMate-8HW's dual blockade addresses.","url":"https://app.notion.com/2ad127970a6280fd85c6ea32e8da0fcf"},{"db":"met","name":"KEYNOTE-181","year":2020,"phase":"III","cancer":"Esophagus","biomarker":"PD-L1","setting":"2L","n":628,"population":"Advanced esophageal cancer — SCC 64% / adenocarcinoma 36% — after one prior fluoropyrimidine-platinum regimen. Asia 39%. PD-L1 CPS ≥10 in 35%.","treatment":"Pembrolizumab × 2 yr vs taxane or irinotecan","tx":["ICI"],"endpoints":[["ORR","✅ CPS ≥10 21.5% vs 6.1%; all 13.1% vs 6.7%"],["OS CPS ≥10 (co-1°)","✅ 9.3 vs 6.7 mo — HR 0.69 (0.52–0.93), P=0.0074, boundary met"],["OS SCC (co-1°)","⚠️ 8.2 vs 7.1 mo — HR 0.78, P=0.0095, boundary NOT met"],["OS all (co-1°)","❌ 7.1 vs 7.1 mo — HR 0.89, P=0.056"],["PFS all","❌ 2.1 vs 3.4 mo — HR 1.11"]],"takeaway":"Only the CPS ≥10 co-primary endpoint was met, so second-line pembrolizumab is approved for CPS ≥10 only. Contrast with ATTRACTION-3, where nivolumab benefited ESCC regardless of PD-L1.","url":"https://app.notion.com/3d7127970a6281759958eedd00b4790c"},{"db":"met","name":"KEYNOTE-189","year":2018,"phase":"III","cancer":"Lung","biomarker":null,"setting":"1L","n":null,"population":"Treatment-naive metastatic NON-SQUAMOUS NSCLC, any PD-L1 level, no EGFR/ALK alteration.","treatment":"Pembrolizumab + pemetrexed/platinum vs placebo + chemo","tx":["ICI","ChT"],"endpoints":[["Status","📝 Results not captured in your DB — design only"]],"takeaway":"The trial that established chemo-immunotherapy as first-line standard for non-squamous NSCLC regardless of PD-L1. Worth filling in the numbers.","url":"https://app.notion.com/2ac127970a62804cad00fc176526eb5c"},{"db":"met","name":"KEYNOTE-224 / KEYNOTE-240","year":2019,"phase":"II / III","cancer":"HCC","biomarker":null,"setting":"2L","n":413,"population":"Advanced HCC, Child-Pugh A, BCLC B/C, previously treated with sorafenib.","treatment":"Pembrolizumab vs placebo (KEYNOTE-240)","tx":["ICI"],"endpoints":[["ORR","18.3% vs 4.4%"],["DCR","62.2% vs 53.3%"],["PFS","⚠️ 3.0 vs 2.8 mo — HR 0.71, P=0.0022 vs boundary 0.002, NOT met"],["OS","⚠️ 13.9 vs 10.6 mo — HR 0.78, P=0.0238 vs boundary 0.0174, NOT met"]],"takeaway":"A near miss — both endpoints favoured pembrolizumab but neither crossed its statistical boundary. FDA's ODAC nonetheless voted in 2021 to maintain the accelerated approval.","url":"https://app.notion.com/2a2127970a6280e0bb95c53df61679bc"},{"db":"met","name":"KEYNOTE-355","year":2022,"phase":"III","cancer":"Breast","biomarker":"PD-L1","setting":"1L","n":null,"population":"Treatment-naive metastatic TNBC, NO CPS requirement for entry. DFI 6–12 mo 20%, >12 mo 50%; de novo metastatic 30%; brain mets 2–6%.","treatment":"Pembrolizumab + chemo vs placebo + chemo","tx":["ICI","ChT"],"endpoints":[["ORR","CPS ≥10 52.7% vs 40.8%; ITT 40.8% vs 37.0%"],["PFS CPS ≥10 (1°)","✅ 9.7 vs 5.6 mo — HR 0.66 (0.50–0.88)"],["OS CPS ≥10","✅ 23.0 vs 16.1 mo — HR 0.73 (0.55–0.95)"],["CPS ≥1","⚠️ OS HR 0.86 (0.72–1.04), NS"],["ITT","⚠️ OS HR 0.89 (0.76–1.05), NS"]],"takeaway":"First-line pembrolizumab + chemo improves both PFS and OS — but only at CPS ≥10. Below that, nothing. The sharp contrast with KEYNOTE-522 in early TNBC (where PD-L1 didn't matter at all) is one of the most instructive discrepancies in breast oncology.","url":"https://app.notion.com/335127970a62801bbcc7dc4fdec617b4"},{"db":"met","name":"KEYNOTE-394","year":2022,"phase":"III","cancer":"HCC","biomarker":null,"setting":"2L","n":453,"population":"Advanced HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Conducted in Asian countries, HBV-predominant.","treatment":"Pembrolizumab vs placebo","tx":["ICI"],"endpoints":[["OS (1°)","✅ 14.6 vs 13.0 mo — HR 0.79 (0.63–0.99), P=0.018"]],"takeaway":"The Asian confirmatory study that KEYNOTE-240 failed to deliver — a modest but statistically significant OS benefit for second-line pembrolizumab in HCC.","url":"https://app.notion.com/2a2127970a6280658094e63868946119"},{"db":"met","name":"KEYNOTE-407","year":2018,"phase":"III","cancer":"Lung","biomarker":null,"setting":"1L","n":null,"population":"Treatment-naive metastatic SQUAMOUS NSCLC, any PD-L1 level.","treatment":"Pembrolizumab + carboplatin/taxane vs placebo + chemo","tx":["ICI","ChT"],"endpoints":[["Status","📝 Results not captured in your DB — design only"]],"takeaway":"The squamous counterpart to KEYNOTE-189, establishing chemo-immunotherapy as first-line standard regardless of PD-L1. Worth filling in.","url":"https://app.notion.com/2ac127970a62807c80f4fda710e63a47"},{"db":"met","name":"KEYNOTE-590","year":2021,"phase":"III","cancer":"Esophagus","biomarker":"PD-L1","setting":"1L","n":749,"population":"Treatment-naive advanced esophageal/GEJ cancer — ESCC 73%, adenocarcinoma 27%. Asia 53%. PD-L1 CPS ≥10 in 51%. HER2-positive excluded.","treatment":"Pembrolizumab + cisplatin/5-FU vs placebo + PF (double-blind)","tx":["ICI","ChT"],"endpoints":[["ORR","✅ 45.0% vs 29.3%, P<0.0001; median DoR 8.3 vs 6.0 mo"],["OS ESCC + CPS ≥10 (1°)","✅ 13.9 vs 8.8 mo — HR 0.57 (0.43–0.75), P<0.0001"],["OS all (1°)","✅ 12.4 vs 9.8 mo — HR 0.73 (0.62–0.86), P<0.0001"],["OS CPS <10","❌ 10.5 vs 10.6 mo — essentially flat"],["PFS all (1°)","✅ 6.3 vs 5.8 mo — HR 0.65 (0.55–0.76), P<0.0001"]],"takeaway":"First-line standard for both ESCC and esophageal adenocarcinoma, with both OS and PFS benefit. But read the subgroups honestly — the effect is driven almost entirely by CPS ≥10; below that the curves overlap.","url":"https://app.notion.com/3d7127970a62810aa81dec1140402ddb"},{"db":"met","name":"LEAP-002","year":2023,"phase":"III","cancer":"HCC","biomarker":null,"setting":"1L","n":null,"population":"Advanced HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Asian 40%. Vp4 excluded.","treatment":"Pembrolizumab + lenvatinib vs lenvatinib alone","tx":["ICI","TKI"],"endpoints":[["ORR","26% vs 17.5%; median DoR 16.6 vs 10.4 mo"],["PFS (co-1°)","⚠️ 8.2 vs 8.1 mo — HR 0.83 (0.71–0.98)"],["OS (co-1°)","⚠️ 21.2 vs 19.0 mo — HR 0.84 (0.71–1.00), P=0.023 vs boundary 0.0185, NOT met"]],"takeaway":"A formally negative trial that nonetheless produced the longest lenvatinib-arm OS ever reported (19 months) — the control arm performed too well for the combination to separate. A lesson in how improving standards of care raise the bar for new combinations.","url":"https://app.notion.com/2a2127970a62803d9cdbe8900f70a01e"},{"db":"met","name":"MAINTAIN","year":2023,"phase":"II","cancer":"Breast","biomarker":"HR","setting":"2L","n":null,"population":"HR+/HER2− advanced breast cancer progressing on a CDK4/6 inhibitor (86.5% palbociclib). ≤1 prior chemo line. Not biomarker-selected.","treatment":"SWITCHED endocrine therapy + ribociclib vs switched ET + placebo (NSAI → fulvestrant or exemestane)","tx":["CDK4/6i","SERD"],"endpoints":[["ORR","⚠️ 20% vs 11%"],["CBR","⚠️ 43% vs 25%"],["PFS (1°)","✅ 5.29 vs 2.76 mo — HR 0.57 (0.39–0.85), P=0.006"]],"takeaway":"Switching both the endocrine partner AND the CDK4/6 inhibitor (palbociclib → ribociclib) retains benefit after progression — the first randomised evidence for CDK4/6 inhibitor beyond progression. Benefit was significant in ESR1 wild-type; prior CDK4/6i duration ≤12 months may still leave room.","url":"https://app.notion.com/37e127970a6280fb9f4afe6a14ae110c"},{"db":"met","name":"MARIPOSA","year":2024,"phase":"III","cancer":"Lung","biomarker":"EGFR","setting":"1L","n":null,"population":"Treatment-naive EGFR-mutant advanced NSCLC — Ex19del 60%, L858R 40%. Stable brain mets 40%, with regular brain MRI. Crossover PROHIBITED.","treatment":"Amivantamab + lazertinib vs osimertinib vs lazertinib alone — chemotherapy-free","tx":["BsAb","TKI"],"endpoints":[["ORR","86% vs 85%"],["PFS (1°)","✅ 23.7 vs 16.6 mo — HR 0.70 (0.58–0.85), P<0.001"],["OS","✅ NR vs 36.7 mo — HR 0.74 (0.56–0.97), P=0.026"]],"takeaway":"A chemo-free doublet that beats osimertinib on both PFS and OS in first-line EGFR-mutant NSCLC. The catch is toxicity — infusion reactions, rash, paronychia and VTE are common and drive discontinuation.","url":"https://app.notion.com/2ac127970a6280fdac5ad3b1e73485a2"},{"db":"met","name":"MARIPOSA-2","year":2024,"phase":"III","cancer":"Lung","biomarker":"EGFR","setting":"2L","n":null,"population":"EGFR Ex19del or L858R NSCLC progressing on or after osimertinib. Stable brain metastases allowed.","treatment":"Amivantamab + chemo (± lazertinib) vs chemotherapy alone","tx":["BsAb","TKI","ChT"],"endpoints":[["ORR","✅ 64% / 63% vs 36%"],["PFS (1°)","✅ 6.3 (ami+chemo) / 8.3 (ami+laz+chemo) vs 4.2 mo — HR 0.48 (0.36–0.64) and 0.44 (0.35–0.56)"],["OS","⚠️ 17.7 vs 15.3 mo — numerically higher, not mature"]],"takeaway":"Addresses the hardest question in EGFR NSCLC — what to do after osimertinib. Amivantamab + chemo improves PFS, ORR and intracranial PFS. Costs: VTE, haematologic and skin toxicity.","url":"https://app.notion.com/31a127970a6280f2965bcb6a0cabe9bf"},{"db":"met","name":"MetaGIST","year":2010,"phase":"III (meta-analysis)","cancer":"GIST","biomarker":"KIT / PDGFRA","setting":"1L","n":1640,"population":"Unresectable or metastatic GIST on first-line imatinib. Pooled individual-patient data from two phase III trials (EORTC 62005 and SWOG S0033). Median follow-up 45 months; mutation data in 772 patients.","treatment":"Imatinib 800 mg/d vs 400 mg/d, first line","tx":["TKI"],"endpoints":[["ORR","⚠️ 54% vs 51%, P=0.08. ✅ KIT exon 9: 47% vs 21%, P=0.004; exon 11: 64% in both"],["PFS","✅ 23.4 vs 19.0 mo — HR 0.89 (0.79–1.00), P=0.041"],["KIT exon 9 PFS","✅ 42% risk reduction with 800 mg (interaction P=0.012)"],["OS","⚠️ 48.6 vs 49.0 mo — HR 1.00 (0.86–1.15), P=0.97, identical"]],"takeaway":"Upfront high-dose imatinib buys only a small early PFS advantage and no survival benefit — 400 mg remains the standard starting dose. The single exception is KIT exon 9-mutant GIST, where 800 mg more than doubles response rate.","url":"https://app.notion.com/3ce127970a62817995cdc029703e650b"},{"db":"met","name":"ML18147 (TML)","year":2013,"phase":"III","cancer":"CRC","biomarker":null,"setting":"2L","n":null,"population":"mCRC progressing after first-line bevacizumab-containing chemotherapy. Sidedness not analysed. First line was not anti-EGFR.","treatment":"Bevacizumab BEYOND progression + second-line chemo vs chemo alone","tx":["ChT","Anti-VEGF"],"endpoints":[["ORR","⚠️ 5% vs 4%"],["DCR","✅ 68% vs 54%"],["PFS","✅ 5.7 vs 4.1 mo — HR 0.68 (0.59–0.78), P<0.0001"],["OS (1°)","✅ 11.2 vs 9.8 mo — HR 0.81 (0.69–0.94), P=0.006"]],"takeaway":"Continuing bevacizumab past progression with a changed chemotherapy backbone improves survival — regardless of tumour sidedness. Established 'bev beyond progression' as a legitimate strategy.","url":"https://app.notion.com/2fc127970a628036929be3f0cf6cae09"},{"db":"met","name":"MONALEESA-2","year":2016,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"1L","n":null,"population":"Postmenopausal ER+/HER2− advanced breast cancer with no prior treatment for advanced disease.","treatment":"Ribociclib + letrozole vs placebo + letrozole","tx":["CDK4/6i","NSAI"],"endpoints":[["ORR","✅ 40.7% vs 27.5%"],["PFS (1°)","✅ 25.3 vs 16.0 mo — HR 0.56 (0.43–0.72), P=3.3×10⁻⁶"],["OS","✅ 63.9 vs 51.4 mo — HR 0.76 (0.63–0.93), P=0.008"]],"takeaway":"Ribociclib + letrozole delivers both PFS and OS benefit first-line, with median OS exceeding 5 years. Notably, ribociclib has shown OS benefit where palbociclib has not.","url":"https://app.notion.com/2d1127970a62805b8994fdd6c4bbfd65"},{"db":"met","name":"MONALEESA-3","year":2019,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"1L / 2L","n":null,"population":"Postmenopausal HR+/HER2− advanced breast cancer. Half first-line (de novo or relapse >12 mo); half second-line (early relapse ≤12 mo or progression on ET), all CDK4/6i-naive.","treatment":"Ribociclib + fulvestrant vs placebo + fulvestrant","tx":["CDK4/6i","SERD"],"endpoints":[["ORR","✅ 32.4% vs 21.5%"],["PFS (1°)","✅ Overall 20.6 vs 12.8 mo — HR 0.59 (0.49–0.71); 1L 33.6 vs 19.2 mo; 2L 14.6 vs 9.1 mo"],["OS","✅ Overall NR vs 40.0 mo — HR 0.72 (0.57–0.92), P=0.0046"]],"takeaway":"Ribociclib works with fulvestrant as well as with an AI, and the OS benefit holds in both first and second line. First-line PFS of 33.6 months is the standout figure.","url":"https://app.notion.com/379127970a628005a533fe589c8e1475"},{"db":"met","name":"MONALEESA-7","year":2019,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"1L","n":null,"population":"PRE/PERI-MENOPAUSAL women with ER+/HER2− advanced breast cancer. One prior line of chemotherapy allowed. The only CDK4/6 trial dedicated to this group.","treatment":"Ribociclib + endocrine therapy + ovarian function suppression vs placebo + ET + OFS","tx":["CDK4/6i","NSAI"],"endpoints":[["ORR","✅ 41% vs 30%"],["CBR","✅ 79% vs 70%"],["PFS (1°)","✅ 23.8 vs 13.0 mo — HR 0.55 (0.44–0.69), P<0.0001"],["OS","✅ NR vs 40.9 mo — HR 0.71 (0.54–0.95), P=0.0097"]],"takeaway":"The only CDK4/6 inhibitor trial designed specifically for premenopausal women, and it delivered both PFS and OS benefit — nearly doubling PFS.","url":"https://app.notion.com/2d1127970a6280059aadfa1f57863198"},{"db":"met","name":"MONARCH-2","year":2017,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"2L","n":null,"population":"HR+/HER2− advanced breast cancer progressing on endocrine therapy but CDK4/6i-naive. Any menopausal status; ≤1 prior metastatic chemo line. Primary endocrine resistance in ~25%.","treatment":"Abemaciclib + fulvestrant vs placebo + fulvestrant","tx":["CDK4/6i","SERD"],"endpoints":[["ORR","48.1% vs 21.3%"],["DCR","83.0% vs 75.8%"],["PFS (1°)","✅ 16.9 vs 9.3 mo — HR 0.539 (0.449–0.647), P<0.0001"],["OS","✅ 45.8 vs 37.3 mo — HR 0.784 (0.644–0.955), P=0.016"]],"takeaway":"Abemaciclib + fulvestrant improves PFS and OS after endocrine progression, delaying the move to chemotherapy by well over a year.","url":"https://app.notion.com/37a127970a62805c9cdde48517c8c516"},{"db":"met","name":"MONARCH-3","year":2017,"phase":"III","cancer":"Breast","biomarker":"HR","setting":"1L","n":null,"population":"Postmenopausal ER+/HER2− advanced breast cancer with no prior treatment for advanced disease.","treatment":"Abemaciclib + non-steroidal AI vs placebo + NSAI","tx":["CDK4/6i","NSAI"],"endpoints":[["ORR","✅ 48.2% vs 34.5%, P=0.002"],["CBR","78.0% vs 71.5%"],["PFS (1°)","✅ 29.0 vs 14.8 mo — HR 0.535 (0.429–0.668), P<0.0001"],["OS","⚠️ 66.8 vs 53.7 mo (Δ13.1) — HR 0.804 (0.637–1.015), P=0.066, just missed"]],"takeaway":"Doubles first-line PFS, and the 13-month numerical OS gain narrowly missed significance. Side effects differ from the other CDK4/6 inhibitors: diarrhoea and VTE dominate over neutropenia.","url":"https://app.notion.com/2d1127970a6280dabf95e1c34236924a"},{"db":"met","name":"MORPHEUS-Liver","year":2025,"phase":"I/II","cancer":"HCC","biomarker":null,"setting":"1L","n":58,"population":"Unresectable HCC, Child-Pugh A, ECOG ≤1, BCLC B/C. Asian 40%.","treatment":"Atezolizumab + bevacizumab + tiragolumab (anti-TIGIT) vs atezolizumab + bevacizumab","tx":["ICI","Anti-VEGF","Others"],"endpoints":[["ORR","43% vs 11% (RECIST); 55% vs 17% (mRECIST)"],["DCR","78% vs 44%"],["PFS","✅ 12.3 vs 4.2 mo — HR 0.51 (0.27–0.95)"],["OS","✅ 28.9 vs 15.1 mo — HR 0.39 (0.19–0.78)"]],"takeaway":"Adding anti-TIGIT to atezo/bev produced striking early signals — but with only 58 patients in a randomised phase Ib/II, treat these hazard ratios as hypothesis-generating. Phase III is the test.","url":"https
