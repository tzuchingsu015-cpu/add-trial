ts had metastatic disease; 50.2% had biochemical/clinical relapse after curative local therapy and 27.1% had advanced localized disease. This is a head-to-head ADT-formulation trial (oral GnRH antagonist vs injectable LHRH agonist), not a disease-stage treatment trial — testosterone suppression and cardiovascular safety are the endpoints, not oncologic efficacy.","treatment":"Relugolix (oral GnRH antagonist) vs leuprolide (injectable LHRH agonist)","tx":["Endocrine"],"endpoints":[["Sustained castration rate through 48 wk (1°)","✅ 96.7% vs 88.8% — +7.9 pts (95% CI 4.1–11.8), P<0.001 superiority"],["Castration by day 4","✅ 56.0% vs 0% — leuprolide causes an initial testosterone surge, relugolix does not"],["Major adverse cardiovascular events","✅ 2.9% vs 6.2% — HR 0.46 (0.24–0.88)"]],"takeaway":"Oral relugolix suppresses testosterone faster (no initial surge) and more completely than injectable leuprolide, with a 54% lower risk of major cardiovascular events — most pronounced in the >90% of patients with pre-existing cardiovascular risk factors. This is a drug-formulation comparison usable across disease stages, not a stage-specific treatment-intensification trial, so its 'line of therapy' is not applicable the way other cards in this deck are.","url":"https://app.notion.com/3df127970a6281a8a222cdf2ca26be25"},{"db":"early","name":"HERO","year":2020,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"Other","n":930,"population":"⚠️ Cross-listed with the Metastatic deck entry for the same trial — the population spans curative-intent, biochemically-relapsed, and metastatic settings (only 31.7% metastatic), so it doesn't fit either database's usual disease-stage framing. Testosterone suppression and cardiovascular safety are the endpoints, not DFS/OS/pCR.","treatment":"Relugolix (oral GnRH antagonist) vs leuprolide (injectable LHRH agonist)","tx":["ET"],"endpoints":[["Sustained castration rate through 48 wk (1°)","✅ 96.7% vs 88.8% — +7.9 pts (95% CI 4.1–11.8), P<0.001 superiority"],["Castration by day 4","✅ 56.0% vs 0% — leuprolide causes an initial testosterone surge, relugolix does not"],["Major adverse cardiovascular events","✅ 2.9% vs 6.2% — HR 0.46 (0.24–0.88)"]],"takeaway":"Same trial as the Metastatic deck's HERO card, filed here too because the population is mostly non-metastatic. Oral relugolix suppresses testosterone faster and more completely than injectable leuprolide, with a 54% lower risk of major cardiovascular events. It's a drug-formulation comparison usable across stages, not a curative-intent neoadjuvant/adjuvant trial.","url":"https://app.notion.com/3df127970a62818bac26e3a1401b5d0b"},{"db":"met","name":"STAMPEDE (Docetaxel, Arm C)","year":2019,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1086,"population":"Newly diagnosed M1 (metastatic) hormone-naïve prostate cancer, randomised 2:1 SOC vs SOC+docetaxel. Median age 65. Metastatic burden (CHAARTED definition) assessable in 830/1086 (76%): 44% low-burden, 56% high-burden. ~95% de novo M1.","treatment":"SOC (lifelong ADT) vs SOC + docetaxel 75 mg/m² IV Q3W ×6 (+ prednisolone 5 mg BID)","tx":["ChT","Endocrine"],"endpoints":[["OS (1°)","✅ Median 59.1 vs 43.1 mo — HR 0.81 (0.69–0.95), P=0.009"],["FFS","✅ RMST 36.7 vs 25.3 mo — HR 0.66 (0.57–0.76), P<0.001"],["PFS","✅ RMST 53.4 vs 40.7 mo — HR 0.69 (0.59–0.81), P<0.001"],["mPFS","✅ RMST 55.3 vs 44.1 mo — HR 0.72 (0.62–0.84), P<0.001"],["PCSS","✅ RMST 67.9 vs 60.3 mo — HR 0.78 (0.66–0.93), P=0.005"],["OS by burden","↔ No heterogeneity — low-burden HR 0.76 (0.54–1.07), high-burden HR 0.81 (0.64–1.02), interaction P=0.827"]],"takeaway":"Long-term STAMPEDE follow-up (median 78.2 mo) confirms upfront docetaxel + ADT improves OS, FFS, PFS, mPFS and PCSS in metastatic hormone-naïve prostate cancer. Unlike CHAARTED/GETUG-15 subgroup analyses, STAMPEDE found no evidence the benefit is confined to high-burden disease — its larger, mostly de-novo low-burden cohort showed no attenuation. No late toxicity signal after year 1.","url":"https://app.notion.com/3df127970a62812bae0bed25388c590d"},{"db":"met","name":"STAMPEDE (Abiraterone, Arm G) — M1","year":2017,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1002,"population":"Pre-specified metastatic (M1) subgroup of STAMPEDE's abiraterone comparison (n=1002 of 1917 total). Newly diagnosed M1 prostate cancer starting long-term ADT. Trial-wide: median age 67, median PSA 53 ng/mL, ~95% newly diagnosed. Companion card: STAMPEDE (Abiraterone, Arm G) — M0.","treatment":"SOC (ADT) vs SOC + abiraterone acetate 1000 mg + prednisolone 5 mg once daily","tx":["ARPI","Endocrine"],"endpoints":[["OS (1°)","✅ Deaths 150/500 (30%) vs 218/502 (43%) — HR 0.61 (0.49–0.75)"],["FFS","✅ Events 210/500 (42%) vs 393/502 (78%) — HR 0.31 (0.26–0.37)"],["OS by metastatic status","↔ No heterogeneity vs M0 subgroup (interaction P=0.37)"],[">= Gr.3 AE (trial-wide)","⚠️ 47% abiraterone vs 33% SOC; 9 vs 3 grade-5 events"]],"takeaway":"Adding abiraterone to ADT improves OS and FFS in men with newly diagnosed metastatic hormone-naive prostate cancer, with a larger relative FFS effect than STAMPEDE's docetaxel comparison in a similar population. Benefit was consistent regardless of metastatic status, at the cost of more grade 3-5 toxicity (mainly hypertension and hepatic).","url":"https://app.notion.com/3df127970a6281798f62e3f907ed29b6"},{"db":"early","name":"STAMPEDE (Abiraterone, Arm G) — M0","year":2017,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"Other","n":915,"population":"Pre-specified non-metastatic (M0) subgroup of STAMPEDE's abiraterone comparison (n=915 of 1917 total): node-positive nonmetastatic, or node-negative high-risk locally advanced (≥2 of T3/T4, Gleason 8–10, PSA ≥40) disease. RT mandatory (node-negative) or encouraged (node-positive). Companion card: STAMPEDE (Abiraterone, Arm G) — M1.","treatment":"SOC (ADT ± RT) vs SOC + abiraterone acetate 1000 mg + prednisolone 5 mg once daily, capped at 2 yr if RT planned","tx":["ET","RT"],"endpoints":[["FFS (1° intermediate)","✅ Events 38/460 (8%) vs 142/455 (31%) — HR 0.21 (0.15–0.31)"],["OS","⏳ Deaths 34/460 (7%) vs 44/455 (10%) — HR 0.75 (0.48–1.18), immature (78 deaths total)"],["OS by metastatic status","↔ No heterogeneity vs M1 subgroup (interaction P=0.37)"],[">= Gr.3 AE (trial-wide)","⚠️ 47% abiraterone vs 33% SOC; 9 vs 3 grade-5 events"]],"takeaway":"In men with non-metastatic, high-risk locally advanced or node-positive prostate cancer (mostly treated with concurrent definitive radiotherapy), adding abiraterone to ADT produced a large failure-free-survival benefit even though abiraterone was capped at 2 years. The overall-survival signal favors abiraterone but remains immature with few events, so it should be read alongside longer follow-up.","url":"https://app.notion.com/3df127970a6281d295fccf4bbbc17eb5"},{"db":"met","name":"TITAN","year":2019,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1052,"population":"Metastatic, castration-sensitive prostate cancer (mCSPC), mostly newly diagnosed. High-volume (CHAARTED) 62.7%, low-volume 37.3%. Prior docetaxel allowed (10.7%, max 6 cycles) and prior localized therapy allowed (16.4%). Median age 68.","treatment":"Apalutamide 240 mg/day + ADT vs placebo + ADT","tx":["ARPI","Endocrine"],"endpoints":[["rPFS (1°)","✅ 24-mo rPFS 68.2% vs 47.5% — HR 0.48 (0.39–0.60), P<0.001"],["OS (1°, interim)","✅ 24-mo OS 82.4% vs 73.5% — HR 0.67 (0.51–0.89), P=0.005"],["Time to cytotoxic chemo","✅ HR 0.39 (0.27–0.56), P<0.001"],["Time to pain progression","⚠️ HR 0.83 (0.65–1.05), NS"],[">= Gr.3 AE","⚠️ 42.2% vs 40.8%; rash 27.1% vs 8.5%, hypothyroidism 6.5% vs 1.1%"]],"takeaway":"Apalutamide added to ADT met both co-primary endpoints — radiographic PFS and overall survival — at the first interim analysis in metastatic castration-sensitive prostate cancer, with benefit consistent regardless of disease volume or prior docetaxel exposure. Grade 3/4 toxicity overall was similar to placebo, though rash and mild hypothyroidism were more common with apalutamide, and quality of life was preserved.","url":"https://app.notion.com/3df127970a6281afb253ef20abc1351e"},{"db":"met","name":"ARTEMIS-008","year":2026,"phase":"III","cancer":"Lung (relapsed SCLC)","biomarker":null,"setting":"2L","n":461,"population":"Relapsed SCLC after 1L platinum-based ± ICI (N=461); ECOG PS 0–1, measurable disease, stable brain mets allowed; ~87% extensive-stage, ~20% brain mets at baseline.","treatment":"Risvutatug rezetecan (B7-H3-directed TOP1i ADC) vs. topotecan","tx":["ADC","ChT"],"endpoints":[["OS (1°)","✅ 18.5 vs 10.3 mo — HR 0.46 (0.35–0.62), P<0.0001"],["PFS (BICR)","✅ 7.2 vs 3.0 mo — HR 0.33 (0.25–0.42), P<0.0001"],["ORR","✅ 58.3% vs 12.6%"],["DCR","✅ 90.4% vs 60.2%"],["Gr ≥3 TRAE","60.9% vs 78.2%"]],"takeaway":"First B7-H3-directed antibody-drug conjugate to significantly improve overall survival over topotecan in second-line relapsed SCLC, at a pre-planned interim analysis, positioning it as a potential new standard of care in a setting with historically poor options. Results are from a conference presentation, not yet a peer-reviewed publication.","url":"https://app.notion.com/3e0127970a6281a1b390f024bbf84dbb"},{"db":"met","name":"AFFIRM","year":2012,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"2L / 3L","n":1199,"population":"mCRPC after 1–2 prior chemo regimens (≥1 containing docetaxel), PCWG2-defined progression, castrate testosterone. ECOG PS 0–1 91%, visceral disease 23%.","treatment":"Enzalutamide vs. placebo","tx":["ARPI"],"endpoints":[["OS (1°)","✅ 18.4 vs 13.6 mo — HR 0.63 (0.53–0.75), P<0.001"],["Radiographic PFS","✅ 8.3 vs 2.9 mo — HR 0.40 (0.35–0.47), P<0.001"],["Time to PSA progression","✅ 8.3 vs 3.0 mo — HR 0.25 (0.20–0.30), P<0.001"],["Soft-tissue response","✅ 29% vs 4%"],["Gr ≥3 AE","45.3% vs 53.1% (favors enzalutamide)"]],"takeaway":"One of the first androgen-receptor-signaling inhibitors, alongside abiraterone (COU-AA-301), to show an overall-survival benefit in men with metastatic castration-resistant prostate cancer after docetaxel chemotherapy. The benefit held across all secondary endpoints and subgroups, though seizures occurred in 0.6% of treated patients — a class effect that warrants caution in patients with seizure risk factors.","url":"https://app.notion.com/3e0127970a6281428680d2cf70311f15"},{"db":"met","name":"COU-AA-301","year":2011,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"2L / 3L","n":1195,"population":"mCRPC after docetaxel-based chemotherapy (1 prior regimen 70%, 2 regimens 30%), castrate testosterone. Bone mets 89%, ECOG PS 0–1 ~90%.","treatment":"Abiraterone + prednisone vs. placebo + prednisone","tx":["ARPI"],"endpoints":[["OS (1°)","✅ 14.8 vs 10.9 mo — HR 0.65 (0.54–0.77), P<0.001"],["Radiographic PFS","✅ 5.6 vs 3.6 mo — HR 0.67 (0.58–0.78), P<0.001"],["Time to PSA progression","✅ 10.2 vs 6.6 mo — HR 0.58 (0.46–0.73), P<0.001"],["Mineralocorticoid-related AEs","⚠️ 55% vs 43%, P<0.001 (mostly grade 1–2)"]],"takeaway":"Established inhibition of extragonadal/intratumoral androgen biosynthesis (CYP17 blockade) as a life-prolonging strategy in post-docetaxel metastatic castration-resistant prostate cancer, alongside enzalutamide (AFFIRM). Toxicity is mechanism-based (fluid retention, hypokalemia, hypertension from mineralocorticoid excess) and largely manageable with the co-administered low-dose prednisone.","url":"https://app.notion.com/3e0127970a6281baa044c73a9f9dbb03"},{"db":"met","name":"COU-AA-302","year":2013,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1088,"population":"Chemotherapy-naive, asymptomatic/mildly symptomatic mCRPC, ECOG PS 0–1, no visceral metastases, ongoing ADT.","treatment":"Abiraterone + prednisone vs. placebo + prednisone","tx":["ARPI"],"endpoints":[["Radiographic PFS (co-1°)","✅ 16.5 vs 8.3 mo — HR 0.53 (0.45–0.62), P<0.001"],["OS (co-1°, interim)","⚠️ NR vs 27.2 mo — HR 0.75 (0.61–0.93), P=0.01 (did not cross the prespecified efficacy boundary at this interim analysis)"],["Time to cytotoxic chemo","✅ 25.2 vs 16.8 mo — HR 0.58 (0.49–0.69), P<0.001"],["Gr 3/4 AE","48% vs 42%"]],"takeaway":"Extended the abiraterone survival strategy from post-chemotherapy (COU-AA-301) to the chemotherapy-naive setting, delaying opiate use, chemotherapy initiation, and functional decline even before this interim analysis's OS boundary was formally crossed. This trial excluded visceral metastases, unlike the contemporaneous enzalutamide trial PREVAIL. A later publication (not the source for this card) reportedly reported a significant final OS analysis.","url":"https://app.notion.com/3e0127970a6281538e53e3502ff9146d"},{"db":"met","name":"PREVAIL","year":2014,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1717,"population":"Chemotherapy-naive mCRPC progressing despite ADT, ECOG PS 0–1, asymptomatic/mildly symptomatic; visceral (lung/liver) metastases allowed.","treatment":"Enzalutamide vs. placebo","tx":["ARPI"],"endpoints":[["Radiographic PFS at 12 mo (co-1°)","✅ 65% vs 14% — HR 0.19 (0.15–0.23), P<0.001"],["OS (co-1°, interim)","✅ NR vs 30.2 mo — HR 0.71 (0.60–0.84), P<0.001"],["Time to cytotoxic chemo","✅ 28.0 vs 10.8 mo — HR 0.35 (0.30–0.40), P<0.001"],["Objective response","✅ 59% vs 5%"],["Gr ≥3 AE","43% vs 37%"]],"takeaway":"Extended enzalutamide's post-chemotherapy benefit (AFFIRM) to the chemotherapy-naive metastatic castration-resistant prostate cancer setting with a very large radiographic PFS effect, and — unlike the contemporaneous abiraterone trial COU-AA-302 — enrolled patients with visceral metastases, broadening the evidence base for that higher-risk subgroup.","url":"https://app.notion.com/3e0127970a628190b417ff9fec77f703"},{"db":"met","name":"MAGNITUDE","year":2025,"phase":"III","cancer":"Prostate","biomarker":"BRCA (HRR+ trial; BRCA1/2 subgroup)","setting":"1L","n":423,"population":"1L mCRPC with a prospectively identified HRR gene alteration (BRCA1/2 subgroup 53%). Baseline imbalances (worse ECOG, more bone/visceral disease) disadvantaged the niraparib arm.","treatment":"Niraparib + abiraterone/prednisone (AAP) vs. placebo + AAP","tx":["PARPi","ARPI"],"endpoints":[["rPFS (1°, earlier interim analysis)","✅ HRR+ HR 0.73 (0.56–0.96); BRCA1/2 HR 0.53 (0.36–0.79) — basis for approval, not re-reported at this final analysis"],["OS, HRR+ (final, unadjusted)","❌ 30.36 vs 30.98 mo — HR 0.931 (0.720–1.203), P=0.585"],["OS, BRCA1/2 (final, unadjusted)","⚠️ 30.36 vs 28.55 mo — HR 0.788 (0.554–1.120), nominal P=0.183"],["Time to symptomatic progression, HRR+","✅ HR 0.547 (0.396–0.754), P=0.006"],["Gr 3–4 TEAE","74.1% vs 51.2%"]],"takeaway":"At long-term follow-up (37.3 mo), niraparib + abiraterone/prednisone did not significantly improve overall survival over placebo + AAP in the HRR+ population or BRCA1/2 subgroup, though baseline imbalances disadvantaged the niraparib arm and adjusted analyses trended toward benefit. The trial's primary endpoint (radiographic PFS) had already been met, which is what supports niraparib's approval in BRCA-altered first-line mCRPC; this update mainly confirms durable benefit in time to symptomatic progression and a stable, hematologic-predominant safety profile.","url":"https://app.notion.com/3e0127970a62811e9eefdce694f83aa1"},{"db":"met","name":"PROfound","year":2020,"phase":"III","cancer":"Prostate","biomarker":"BRCA (Cohort A: BRCA1/2/ATM)","setting":"2L / 3L","n":245,"population":"mCRPC progressing on enzalutamide or abiraterone, with a BRCA1, BRCA2, or ATM alteration (Cohort A); ~65% also had prior taxane chemotherapy.","treatment":"Olaparib vs. physician's choice of enzalutamide or abiraterone + prednisone","tx":["PARPi","ARPI"],"endpoints":[["Imaging-based PFS (1°)","✅ 7.4 vs 3.6 mo — HR 0.34 (0.25–0.47), P<0.001"],["OS (interim)","✅ 18.5 vs 15.1 mo — HR 0.64 (0.43–0.97), P=0.02"],["Confirmed objective response","✅ 33% vs 2%"],["Time to pain progression","✅ HR 0.44 (0.22–0.91), P=0.02"]],"takeaway":"First phase 3 trial to show that switching to a PARP inhibitor beats switching between enzalutamide and abiraterone in mCRPC with BRCA1/2/ATM alterations that progressed on one of those agents. The interim OS benefit held up despite 81% crossover from control to olaparib, which would be expected to bias toward the null, and led to olaparib's approval in this HRR-altered post-hormonal-therapy setting.","url":"https://app.notion.com/3e0127970a6281d1b61df80430ca59ff"},{"db":"met","name":"PROpel","year":2022,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":796,"population":"1L mCRPC enrolled regardless of HRR gene mutation (HRRm) status (HRRm ~28%, non-HRRm ~69%).","treatment":"Abiraterone + olaparib vs. abiraterone + placebo","tx":["PARPi","ARPI"],"endpoints":[["Imaging-based PFS (1°, investigator)","✅ 24.8 vs 16.6 mo — HR 0.66 (0.54–0.81), P<0.001"],["Imaging-based PFS (BICR)","✅ 27.6 vs 16.4 mo — HR 0.61 (0.49–0.74)"],["OS (interim, 28.6% maturity)","⏳ HR 0.86 (0.66–1.12), P=0.29 — immature"],["Objective response","✅ 58.4% vs 48.1%"]],"takeaway":"Adding olaparib to abiraterone significantly delays radiographic progression in first-line mCRPC regardless of HRR mutation status, though the OS benefit had not reached significance at this primary analysis (data still immature). Benefit was seen in both HRR-mutant and HRR-wildtype patients, consistent with a proposed mechanism where ARPI treatment itself can induce a 'functional' HRR deficiency that sensitizes tumors to PARP inhibition even without a baseline mutation.","url":"https://app.notion.com/3e0127970a6281a2b8d3e75f91483330"},{"db":"met","name":"TALAPRO-2","year":2025,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":805,"population":"1L mCRPC, unselected cohort regardless of HRR gene alteration status (HRR-deficient 21%).","treatment":"Talazoparib + enzalutamide vs. placebo + enzalutamide","tx":["PARPi","ARPI"],"endpoints":[["OS (key secondary endpoint, final analysis)","✅ 45.8 vs 37.0 mo — HR 0.80 (0.66–0.96), P=0.016"],["Radiographic PFS (updated, BICR)","✅ 33.1 vs 19.5 mo — HR 0.67 (0.55–0.81), P<0.0001"],["OS, HRR-deficient subgroup","✅ HR 0.55 (0.36–0.83), nominal P=0.0035"],["Gr 3–4 anaemia","49% vs 4%"]],"takeaway":"First trial to show a statistically significant, clinically meaningful overall-survival benefit for a PARP inhibitor + ARPI combination over an active standard-of-care ARPI (enzalutamide alone, not just placebo) in first-line mCRPC unselected for HRR status. Benefit was largest in the HRR-deficient subgroup but extended, to a lesser degree, even to patients with no detectable HRR alteration, at the cost of a substantial anaemia/neutropenia burden that was manageable with dose modification and did not compromise quality of life over more than 4 years of follow-up.","url":"https://app.notion.com/3e0127970a628189b1fbc1a5ce1a0a2d"},{"db":"met","name":"TRITON2","year":2020,"phase":"II","cancer":"Prostate","biomarker":"BRCA (BRCA1/2 required for enrollment)","setting":"2L / 3L","n":115,"population":"Heavily pretreated mCRPC with a deleterious BRCA1 or BRCA2 alteration, progressed after 1–2 lines of AR-directed therapy and 1 taxane; single-arm, no comparator.","treatment":"Rucaparib monotherapy (single-arm)","tx":["PARPi"],"endpoints":[["Confirmed ORR (1°, IRR / investigator)","✅ 43.5% / 50.8% — no comparator arm"],["Confirmed PSA response (≥50%)","✅ 54.8%"],["Disease control (SD or better)","✅ ~89%"],["Gr ≥3 TEAE","60.9% (most common: anaemia 25.2%)"]],"takeaway":"Single-arm phase 2 data showing rucaparib monotherapy has meaningful antitumor activity in heavily pretreated BRCA1/2-altered mCRPC, where response rates to further AR-directed therapy or chemotherapy are historically poor. These data supported rucaparib's accelerated FDA approval in this setting, but the lack of a comparator arm is the key limitation — the confirmatory phase 3 TRITON3 trial was designed to validate benefit against physician's choice of therapy in an earlier disease setting.","url":"https://app.notion.com/3e0127970a6281c2bc19f3f9bc64bad6"},{"db":"met","name":"ALSYMPCA","year":2013,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L / 2L","n":921,"population":"Symptomatic mCRPC with ≥2 bone metastases and no visceral metastases; median age 71, ECOG 0–2. 57% had received prior docetaxel (or were ineligible for/declined it) and 57% had WHO pain-ladder score ≥2 requiring regular analgesics or recent EBRT.","treatment":"Radium-223 vs placebo, both + best standard of care (BSC) — Ra-223 50 kBq/kg IV q4wk ×6","tx":["RT"],"endpoints":[["OS (1°)","✅ 14.9 vs 11.3 mo — HR 0.70 (0.58–0.83), P<0.001"],["Time to first SSE","✅ 15.6 vs 9.8 mo — HR 0.66 (0.52–0.83), P<0.001"],["Time to ALP increase","✅ 7.4 vs 3.8 mo — HR 0.17 (0.13–0.22), P<0.001"],["Time to PSA increase","✅ 3.6 vs 3.4 mo — HR 0.64 (0.54–0.77), P<0.001"]],"takeaway":"First survival benefit ever shown for a bone-targeted radiopharmaceutical: radium-223 improved overall survival and delayed skeletal complications versus placebo plus best standard of care in symptomatic mCRPC with bone-only metastases. Its favorable safety profile — lower rates of high-grade AEs than placebo, with low myelosuppression — set it apart from beta-emitting radiopharmaceuticals and chemotherapy, establishing radium-223 as a standard of care in this setting.","url":"https://app.notion.com/p/3e1127970a6281faa959f7c34efe0d48"},{"db":"met","name":"ERA-223","year":2019,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":806,"population":"Chemotherapy-naive, asymptomatic or mildly symptomatic mCRPC with ≥2 bone metastases and no visceral/brain metastases; median age 71, ECOG 0–1. Excluded prior cytotoxic chemotherapy or prior abiraterone/prednisone use for CRPC.","treatment":"Radium-223 + abiraterone acetate/prednisone(-lone) vs placebo + abiraterone acetate/prednisone(-lone) — Ra-223 55 kBq/kg IV q4wk ×6, AA 1000 mg/d + prednisone 5 mg BID","tx":["ARPI","RT"],"endpoints":[["SSE-free survival (1°)","❌ 22.3 vs 26.0 mo — HR 1.122 (0.917–1.374), P=0.2636"],["OS","⚠️ 30.7 vs 33.3 mo (numerically worse with Ra-223) — HR 1.195 (0.950–1.505), P=0.128"],["rPFS (central review)","⚠️ 11.2 vs 12.4 mo — HR 1.152 (0.960–1.383)"],["Fractures (time-to-first)","❌ 29% vs 11% — HR 3.135 (2.206–4.455)"]],"takeaway":"Adding radium-223 to abiraterone plus prednisone did not improve symptomatic skeletal-event-free survival and numerically worsened OS, while more than doubling fracture risk (29% vs 11%) versus abiraterone/prednisone alone. The combination is now contraindicated, and the safety signal prompted mandatory bone-protecting-agent use in the companion trial PEACE-3.","url":"https://app.notion.com/p/3e1127970a6281e1a224dcd839684245"},{"db":"met","name":"PEACE-3","year":2025,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":446,"population":"First-line mCRPC with ≥2 bone metastases (≥4 required in Europe from Jul 2018) ± nodal metastases, no visceral metastases; asymptomatic or mildly symptomatic. Median age 70; ~30% prior docetaxel (given in the mHSPC setting), only 2.5% had prior ARPI exposure.","treatment":"Enzalutamide alone vs enzalutamide + radium-223 (open-label, no placebo) — Enza 160 mg/d; Ra-223 55 kBq/kg IV q4wk ×6; bone-protecting agent mandatory in both arms from 2018","tx":["ARPI","RT"],"endpoints":[["rPFS (1°, final analysis)","✅ 16.4 vs 19.2 mo — HR 0.71 (0.57–0.89)"],["OS (final analysis)","✅ 32.6 vs 38.2 mo — HR 0.76 (0.60–0.96), P=0.0096"],["Time to next systemic treatment","✅ HR 0.57 (0.44–0.75), P<0.0001"],["Time to first SSE","↔ HR 0.93 (0.62–1.38), NS"],["Fractures (time-to-first)","❌ 14.3% vs 27.1% — HR 2.05 (1.33–3.18)"]],"takeaway":"Adding radium-223 to first-line enzalutamide improved radiographic PFS and, in the mature final analysis, overall survival (HR 0.76, P=0.0096; roughly +5.6 months median OS) versus enzalutamide alone in mCRPC. The benefit required a mandatory bone-protecting agent in both arms from 2018 onward, and even with that safeguard the combination still carried a higher risk of fractures and osteonecrosis of the jaw than enzalutamide alone.","url":"https://app.notion.com/p/3e1127970a6281cfbd6eff5535693821"},{"db":"met","name":"CARD","year":2019,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"3L","n":255,"population":"mCRPC after ≥3 cycles of docetaxel plus progression within 12 months on an ARSI (abiraterone or enzalutamide, given before or after docetaxel); median age 70–71, ≈67% had pain at entry, Gleason 8–10 at diagnosis in 57–64%.","treatment":"Cabazitaxel vs the alternative ARSI not yet received (abiraterone or enzalutamide) — cabazitaxel 25 mg/m² IV q3w + prednisone + mandatory prophylactic G-CSF","tx":["ChT","ARPI"],"endpoints":[["Imaging-based PFS (1°)","✅ 8.0 vs 3.7 mo — HR 0.54 (0.40–0.73), P<0.001"],["OS","✅ 13.6 vs 11.0 mo — HR 0.64 (0.46–0.89), P=0.008"],["PFS","✅ 4.4 vs 2.7 mo — HR 0.52 (0.40–0.68), P<0.001"],["Tumor response","✅ 37% vs 12%, P=0.004"],["Time to first symptomatic skeletal event","⚠️ HR 0.59 (0.35–1.01)"]],"takeaway":"The first prospective trial to show that switching to a second ARSI after early progression (≤12 months) on a first ARSI has poor efficacy, consistent with shared resistance mechanisms between abiraterone and enzalutamide. Cabazitaxel's distinct microtubule-targeting mechanism overcame this cross-resistance, improving imaging-based PFS and OS and establishing cabazitaxel — not a second ARSI — as the preferred next therapy in this setting.","url":"https://app.notion.com/p/3e1127970a62813b83acde9013536858"},{"db":"met","name":"VISION","year":2021,"phase":"III","cancer":"Prostate","biomarker":"PSMA-PET-positive","setting":"3L","n":831,"population":"mCRPC, centrally PSMA-PET-positive, progressed after ≥1 ARPI and 1–2 taxane regimens (97% prior docetaxel, 38% prior cabazitaxel); median age 71, ECOG 0/1 ≈92%.","treatment":"¹⁷⁷Lu-PSMA-617 + standard care vs standard care alone — ¹⁷⁷Lu-PSMA-617 7.4 GBq IV q6wk ×4–6 cycles","tx":["RT"],"endpoints":[["rPFS (1°, co-primary)","✅ 8.7 vs 3.4 mo — HR 0.40 (99.2% CI 0.29–0.57), P<0.001"],["OS (1°, co-primary)","✅ 15.3 vs 11.3 mo — HR 0.62 (0.52–0.74), P<0.001"],["Time to first symptomatic skeletal event","✅ HR 0.50 (0.40–0.62), P<0.001"],["Objective response (measurable disease)","✅ 51% vs 3% (CR+PR)"]],"takeaway":"The first phase 3 trial to establish an overall survival benefit for a PSMA-targeted radioligand therapy, using theranostic PSMA-PET selection in post-taxane, post-ARPI mCRPC. It led to FDA approval of ¹⁷⁷Lu-PSMA-617 (Pluvicto) in this setting; unlike TheraP, it compared against standard care rather than an active life-prolonging comparator.","url":"https://app.notion.com/p/3e1127970a62816d80e4fc6b6ac89d96"},{"db":"met","name":"TheraP","year":2021,"phase":"II","cancer":"Prostate","biomarker":"PSMA-PET-positive (dual PSMA/FDG-selected)","setting":"2L / 3L","n":200,"population":"mCRPC post-docetaxel, PSMA-PET-positive (SUVmax ≥20) without FDG-discordant disease (28% of screened men excluded on this basis); 91% had prior enzalutamide or abiraterone.","treatment":"¹⁷⁷Lu-PSMA-617 vs cabazitaxel — ¹⁷⁷Lu-PSMA-617 6.0–8.5 GBq IV q6wk ×6 (dose-decrementing) vs cabazitaxel 20 mg/m² IV q3w ×10","tx":["RT","ChT"],"endpoints":[["PSA response ≥50% (1°)","✅ 66% vs 37% — diff 29% (16–42), P<0.0001"],["PFS","✅ 5.1 vs 5.1 mo — HR 0.63 (0.46–0.86), P=0.0028"],["Objective response (measurable disease)","✅ 49% vs 24% — RR 2.12 (1.10–4.08), P=0.019"],["OS (mature, 35.7-mo follow-up)","↔ 16.4 vs 19.4 mo — HR 0.97 (0.70–1.35), P=0.99"]],"takeaway":"A randomized phase 2 trial — the first to test a PSMA-targeted radioligand against an active, life-prolonging comparator (cabazitaxel) rather than placebo or standard care. ¹⁷⁷Lu-PSMA-617 gave better PSA response, objective response, PFS, safety, and quality of life, but mature follow-up showed no OS difference; the trial was powered for PSA response, not OS, and substantial post-protocol crossover in both directions (32%/20%) likely diluted any OS signal.","url":"https://app.notion.com/p/3e1127970a6281b69c53cbb039b9ca7e"},{"db":"met","name":"PSMAfore","year":2024,"phase":"III","cancer":"Prostate","biomarker":"PSMA-PET-positive","setting":"2L","n":468,"population":"Taxane-naive mCRPC, PSMA-PET-positive, progressed once on a prior ARPI (abiraterone, enzalutamide, darolutamide, or apalutamide) as most recent therapy; 81% had received that ARPI in the CRPC setting.","treatment":"¹⁷⁷Lu-PSMA-617 vs change of ARPI (investigator-selected abiraterone or enzalutamide; crossover allowed at confirmed progression) — ¹⁷⁷Lu-PSMA-617 7.4 GBq IV q6wk ×6","tx":["RT","ARPI"],"endpoints":[["rPFS (1°, 3rd cutoff)","✅ 11.6 vs 5.6 mo — HR 0.49 (0.39–0.61)"],["OS (ITT, interim, 57% crossover)","↔ 23.7 vs 23.9 mo — HR 0.98 (0.75–1.28), P=0.44"],["Time to first symptomatic skeletal event","✅ HR 0.41 (0.26–0.63)"],["Time to PSA progression","✅ 10.6 vs 4.2 mo — HR 0.40 (0.31–0.50)"]],"takeaway":"The first phase 3 trial of ¹⁷⁷Lu-PSMA-617 in taxane-naive mCRPC, complementing VISION's post-taxane population. It significantly delayed radiographic progression, skeletal events, and PSA progression versus simply switching to a second ARPI, but showed no OS difference at this interim analysis — interpretation is limited by the very high crossover rate (57% of the ARPI-change arm received ¹⁷⁷Lu-PSMA-617 after progression), and the final OS analysis is still pending.","url":"https://app.notion.com/p/3e1127970a628184ae57e066e222c899"},{"db":"met","name":"TAX 327","year":2004,"phase":"III","cancer":"Prostate","biomarker":null,"setting":"1L","n":1006,"population":"Metastatic hormone-refractory (castration-resistant) prostate cancer, progressing on ADT, chemo-naive (estramustine allowed); randomized 1:1:1 to D3P/D1P/MP; ≈45% had baseline pain, median PSA 108–123 ng/mL, ≈90% bone mets.","treatment":"Docetaxel 75 mg/m² q3w (D3P, primary comparison) vs docetaxel 30 mg/m² weekly ×5/6wk (D1P, non-significant) vs mitoxantrone 12 mg/m² q3w (MP, control) — all + prednisone 5 mg PO BID","tx":["ChT"],"endpoints":[["OS, D3P vs MP (1°, updated 2008)","✅ 19.2 vs 16.3 mo — HR 0.79 (0.67–0.93), P=0.004 [original 2004: 18.9 vs 16.5 mo, HR 0.76 (0.62–0.94), P=0.009]"],["OS, D1P vs MP (updated 2008)","↔ 17.8 vs 16.3 mo — HR 0.87 (0.74–1.02), P=0.086 [original 2004: HR 0.91 (0.75–1.11), P=0.36]"],["OS, combined docetaxel vs MP (original 2004)","✅ HR 0.83 (0.70–0.99), P=0.04"],["Tumor response (measurable disease)","12% (D3P) vs 8% (D1P) vs 7% (MP), P=0.11/0.59 — NS"],["≥Gr 3 TRAE","26% (D3P) vs 29% (D1P) vs 20% (MP); Gr 3/4 neutropenia 32% vs 2% vs 22%; impaired LVEF more frequent with mitoxantrone (22% vs ≈9% docetaxel)"]],"takeaway":"Docetaxel q3w + prednisone (D3P) improved overall survival, pain, PSA response, and quality of life versus mitoxantrone in metastatic castration-resistant prostate cancer — the first chemotherapy shown to prolong survival in this disease, confirmed with a stronger P value on 2008 updated follow-up. Weekly docetaxel (D1P) showed no survival benefit over mitoxantrone in either analysis, establishing D3P — not D1P — as the standard of care and the foundational chemotherapy regimen in mCRPC.","url":"https://app.notion.com/p/3e1127970a6281dc9c85e8be23f4527c"},{"db":"early","name":"BILCAP","year":2019,"phase":"III","cancer":"Biliary tract cancer (BTC)","biomarker":null,"setting":"Adjuvant","n":447,"population":"Resected cholangiocarcinoma (intrahepatic, hilar, or lower CBD) or muscle-invasive gallbladder cancer, stage I–III, with macroscopically complete (R0/R1) resection and ECOG PS <2; R1 margins in ~38% of each arm.","treatment":"Adjuvant capecitabine 1250 mg/m² BID D1–14 q3w ×8 cycles (24 wk) vs observation","tx":["ChT"],"endpoints":[["OS, ITT (1°)","⚠️ 51.1 vs 36.4 mo — HR 0.81 (0.63–1.04), P=0.097 — missed primary endpoint"],["OS, adjusted sensitivity analysis","✅ HR 0.71 (0.55–0.92), P=0.010"],["OS, per-protocol","✅ 53 vs 36 mo — HR 0.75 (0.58–0.97), P=0.028"],["RFS, ITT (0–24 mo)","✅ 24.4 vs 17.5 mo — HR 0.75 (0.58–0.98), P=0.033"],["RFS, beyond 24 mo","⚠️ HR 1.48 (0.80–2.77), P=0.21 — benefit not sustained"]],"takeaway":"BILCAP missed its prespecified ITT primary endpoint for overall survival (HR 0.81, 95% CI 0.63–1.04, P=0.097), but the prespecified adjusted sensitivity analysis (HR 0.71, P=0.010) and per-protocol analysis (HR 0.75, P=0.028, a 14.7-month median OS difference) were both positive, as was recurrence-free survival in the first 24 months. Despite missing its primary endpoint, this body of evidence established adjuvant capecitabine as standard of care after curative resection of biliary tract cancer — no dedicated adjuvant trial had previously defined one for this disease.","url":"https://app.notion.com/p/3e2127970a6281dcae52ff3d1b391792"},{"db":"met","name":"FUGA-BT (JCOG1113)","year":2019,"phase":"III","cancer":"Biliary tract cancer (BTC)","biomarker":null,"setting":"1L","n":354,"population":"Chemotherapy-naive advanced/recurrent biliary tract cancer (cholangiocarcinoma or gallbladder/ampullary cancer), ECOG PS 0-1, enrolled across 33 institutions in Japan. Primary tumor sites were roughly balanced (gallbladder ~39%, intrahepatic ~27%, extrahepatic ~30%, ampulla ~3-4%) and about 60% had metastatic disease.","treatment":"Gemcitabine + S-1 (GS) vs gemcitabine + cisplatin (GC)","tx":["ChT"],"endpoints":[["OS (1°, non-inferiority)","↔ 15.1 vs 13.4 mo (median) — HR 0.945 (90% CI 0.777-1.149), P=0.046 for non-inferiority"],["PFS","6.8 vs 5.8 mo (median) — HR 0.864 (95% CI 0.697-1.070)"],["ORR","29.8% vs 32.4%"]],"takeaway":"GS met its non-inferiority margin against GC as first-line therapy for advanced/recurrent BTC — this is a non-inferiority result, not a superiority win, so GS is a practical alternative rather than a new standard that beats GC on efficacy. Its main advantage is logistical: GS avoids the mandatory pre/post-hydration that cisplatin requires, and grade 3/4 anemia and peripheral neuropathy were both less frequent with GS. The trial population was exclusively Japanese, so whether a gemcitabine+capecitabine substitute would perform similarly in non-Asian patients is untested.","url":"https://app.notion.com/p/3e2127970a62811f8976ddeea6b78a5a"},{"db":"met","name":"KHBO1401-MITSUBA","year":2023,"phase":"III","cancer":"Biliary tract cancer (BTC)","biomarker":null,"setting":"1L","n":246,"population":"Advanced biliary tract cancer (unresectable or recurrent adenocarcinoma/adenosquamous carcinoma of the bile duct, gallbladder, or ampulla), ECOG PS 0-2, across 39 centers in Japan (Kansai Hepatobiliary Oncology Group). About three-quarters of patients had unresectable disease and one-quarter had recurrence after surgery.","treatment":"Gemcitabine + cisplatin + S-1 (GCS) vs gemcitabine + cisplatin (GC)","tx":["ChT"],"endpoints":[["OS (1°)","✅ 13.5 vs 12.6 mo (median) — HR 0.79 (90% CI 0.628-0.996), P=0.046"],["PFS","✅ 7.4 vs 5.5 mo (median) — HR 0.75 (95% CI 0.577-0.970), P=0.015"],["ORR","✅ 41.5% vs 15.0%, P<0.001"],["DCR","✅ 78.7% vs 62.0%, P=0.0066"]],"takeaway":"GCS became the first regimen to beat GC in advanced BTC since GC was established as standard of care a decade earlier, improving OS, PFS, and nearly tripling response rate, with manageable added toxicity attributed to the biweekly schedule. The response benefit is of practical interest for conversion to surgery in initially unresectable disease. The trial population was exclusively Japanese, and because S-1 pharmacokinetics differ in Caucasian patients, a capecitabine-based triplet may be needed to replicate the approach outside Asia.","url":"https://app.notion.com/p/3e2127970a6281b8b8d3d859898694cc"},{"db":"met","name":"TOPAZ-1","year":2022,"phase":"III","cancer":"Biliary tract cancer (BTC)","biomarker":null,"setting":"1L","n":685,"population":"Previously untreated, unresectable, locally advanced, or metastatic biliary tract cancer (cholangiocarcinoma or gallbladder cancer; ampullary carcinoma excluded), ECOG PS 0-1, at 105 sites in 17 countries. About 80% had initially unresectable disease and roughly 60% had PD-L1 tumor area positivity ≥1%.","treatment":"Durvalumab + gemcitabine/cisplatin vs placebo + gemcitabine/cisplatin","tx":["ChT","ICI"],"endpoints":[["OS (1°, updated analysis)","✅ 12.9 vs 11.3 mo (median) — HR 0.76 (95% CI 0.64-0.91); interim analysis HR 0.80 (0.66-0.97), P=0.021"],["PFS","✅ 7.2 vs 5.7 mo (median) — HR 0.75 (95% CI 0.63-0.89), P=0.001"],["ORR","✅ 26.7% vs 18.7%"],["24-mo OS rate","✅ 23.6% vs 11.5%"]],"takeaway":"TOPAZ-1 was the first phase 3 trial to show that adding a checkpoint inhibitor to first-line chemotherapy improves OS in advanced BTC, establishing durvalumab + gemcitabine/cisplatin as a new standard of care; the original interim analysis (HR 0.80, P=0.021) was confirmed and strengthened by a later analysis with 23.4-month median follow-up (HR 0.76), where the 24-month OS rate more than doubled versus chemotherapy alone — evidence of a durable rather than early/transient effect. PD-L1 expression was not predictive of benefit, with consistent hazard ratios regardless of tumor area positivity status.","url":"https://app.notion.com/p/3e2127970a6281f4a7ffe18dc351c444"},{"db":"met","name":"KEYNOTE-966","year":2023,"phase":"III","cancer":"Biliary tract cancer (BTC)","biomarker":null,"setting":"1L","n":1069,"population":"Previously untreated, unresectable locally advanced or metastatic biliary tract cancer, including mixed hepatocellular-cholangiocarcinoma, ECOG PS 0-1, at 175 sites across Asia-Pacific, Europe, North America, and South America — a larger and more globally representative population than TOPAZ-1 (55% enrolled outside Asia). About 68% had PD-L1 combined positive score ≥1.","treatment":"Pembrolizumab + gemcitabine/cisplatin vs placebo + gemcitabine/cisplatin","tx":["ChT","ICI"],"endpoints":[["OS (1°)","✅ 12.7 vs 10.9 mo (median) — HR 0.83 (95% CI 0.72-0.95), one-sided P=0.0034"],["PFS","⚠️ 6.5 vs 5.6 mo (median) — HR 0.86 (95% CI 0.75-1.00), P=0.023 — efficacy boundary not met"],["ORR","⚠️ 29% vs 29% — no difference"]],"takeaway":"KEYNOTE-966 was the second global chemo-immunotherapy trial to show a statistically significant OS benefit in advanced BTC, after TOPAZ-1, with pembrolizumab + gemcitabine/cisplatin lowering the risk of death by 17% (HR 0.83). That OS win should not be read as a positive trial across the board: PFS (HR 0.86, P=0.023) and ORR (29% vs 29%, no difference) both failed to cross their pre-specified statistical efficacy boundaries despite the OS benefit. PD-L1 expression was not associated with benefit, echoing TOPAZ-1.","url":"https://app.notion.com/p/3e2127970a628127a5e6e859ad69d874"},{"db":"met","name":"ABC-02","year":2010,"phase":"III","cancer":"Biliary tract cancer (BTC)","biomarker":null,"setting":"1L","n":410,"population":"Previously untreated, locally advanced or metastatic biliary tract cancer (cholangiocarcinoma, gallbladder cancer, or ampullary cancer), ECOG PS 0-2, across 37 centres in the UK.","treatment":"Cisplatin + gemcitabine (GC) vs gemcitabine alone","tx":["ChT"],"endpoints":[["OS (1°)","✅ 11.7 vs 8.1 mo (median) — HR 0.64 (95% CI 0.52-0.80), P<0.001"],["PFS","✅ 8.0 vs 5.0 mo (median) — HR 0.63, P<0.001"]],"takeaway":"ABC-02 is the foundational trial of advanced biliary tract cancer: it established cisplatin + gemcitabine (GC) as the first-line standard of care, a position GC has held ever since and against which every later regimen in this cancer (FUGA-BT's gemcitabine+S-1, KHBO1401-MITSUBA's added S-1, TOPAZ-1's and KEYNOTE-966's addition of a checkpoint inhibitor) has had to prove itself as the comparator arm. Adding cisplatin to gemcitabine alone cut the risk of death by 36% with no unacceptable increase in toxicity, turning a single-agent regimen into a two-drug backbone that later trials build on rather than replace.","url":"https://app.notion.com/p/3e2127970a628147918fd5992e4d6db5"},{"db":"met","name":"ABC-06","year":2021,"phase":"III","cancer":"BTC","biomarker":null,"setting":"2L","n":null,"population":"Advanced biliary tract cancer (intra-/extrahepatic CCA, gallbladder, or ampullary), with radiological progression on 1L gemcitabine+cisplatin. ECOG 0-1; 81-83% metastatic disease; median age 65.","treatment":"FOLFOX + ASC vs. ASC alone","tx":["ChT"],"endpoints":[["OS (1°)","✅ 6.2 vs 5.3 mo — HR 0.69 (0.50–0.97), P=0.031"],["6-mo OS","✅ 50.6% vs 35.5%"],["12-mo OS","✅ 25.9% vs 11.4%"],["PFS","4.0 mo (FOLFOX arm only — no routine imaging in ASC-alone arm)"],["ORR","4% (FOLFOX arm; CR 1%, PR 4%)"]],"takeaway":"First randomized phase 3 evidence for second-line chemotherapy in advanced BTC, establishing FOLFOX as the standard-of-care 2L regimen. The absolute median OS gain looks modest, but the real signal is the doubling of 6- and 12-month OS rates over active symptom control alone. Complements NIFTY (a different 2L chemotherapy backbone) as a second positive randomized 2L option.","url":"https://app.notion.com/p/3e3127970a62810ea64be775f76692b2"},{"db":"met","name":"ClarIDHy","year":2020,"phase":"III","cancer":"BTC","biomarker":"IDH1 (mutant)","setting":"2L / 3L","n":null,"population":"IDH1-mutant advanced cholangiocarcinoma, centrally confirmed, 1-2 prior treatment regimens with progression on prior therapy. ECOG 0-1; 92% metastatic disease; R132C was the most prevalent IDH1 mutation (70%).","treatment":"Ivosidenib vs. placebo (2:1); crossover to open-label ivosidenib permitted on placebo progression","tx":["IDH1i"],"endpoints":[["PFS (1°, IRC)","✅ 2.7 vs 1.4 mo — HR 0.37 (0.25–0.54), P<0.0001"],["OS, ITT","⚠️ 10.8 vs 9.7 mo — HR 0.69 (0.44–1.10), P=0.060 (confounded by 57% crossover)"],["OS, RPSFT-adjusted","✅ 10.8 vs 6.0 mo — HR 0.46 (0.28–0.75), P=0.0008"],["DCR","53% vs 28%"]],"takeaway":"First randomized phase 3 evidence for a targeted therapy in IDH1-mutant, chemotherapy-refractory cholangiocarcinoma (~13% of intrahepatic CCA), establishing ivosidenib as an option in this molecularly-defined subgroup. The PFS win is clean, but the intention-to-treat OS analysis is diluted by 57% of placebo patients crossing over to ivosidenib; a pre-specified crossover-adjusted (RPSFT) analysis shows a real OS benefit. Ivosidenib also had a favorable, well-tolerated safety profile with no treatment-related deaths.","url":"https://app.notion.com/p/3e3127970a628165bd75c759741af621"},{"db":"met","name":"HERIZON-GEA-01","year":2026,"phase":"III","cancer":"GC / Esophagus","biomarker":"HER2","setting":"1L","n":null,"population":"Previously untreated, HER2-positive (IHC3+ or IHC2+/ISH+) unresectable locally advanced/recurrent/metastatic gastric, GEJ, or esophageal adenocarcinoma. No prior HER2-targeted agents or checkpoint inhibitors allowed; 94-97% metastatic disease; ~60% PD-L1 TAP ≥1%.","treatment":"Zanidatamab + tislelizumab + chemo vs. zanidatamab + chemo vs. trastuzumab + chemo (comparator), 1:1:1","tx":["BsAb","ICI","ChT"],"endpoints":[["PFS (1°, BICR)","✅ Zani-tisle-ChT 12.4 vs trastuzumab-ChT 8.1 mo — HR 0.63 (0.51–0.78), P<0.001"],["PFS (1°, BICR)","✅ Zani-ChT 12.4 vs trastuzumab-ChT 8.1 mo — HR 0.65 (0.52–0.81), P<0.001"],["OS (1°, 1st interim)","✅ Zani-tisle-ChT 26.4 vs trastuzumab-ChT 19.2 mo — HR 0.72 (0.57–0.90), P=0.004"],["OS (1°, 1st interim)","⚠️ Zani-ChT 24.4 vs trastuzumab-ChT 19.2 mo — HR 0.80 (0.64–1.01), P=0.06, not yet significant at this interim"],["ORR","70.7% vs 69.6% vs 65.7%"]],"takeaway":"First phase 3 trial to beat trastuzumab + chemotherapy — the 15-year first-line standard since ToGA — in HER2-positive advanced gastroesophageal adenocarcinoma, with both zanidatamab-containing regimens improving PFS. At this first OS interim, the triplet with tislelizumab also beat trastuzumab on OS, but the zanidatamab+chemo doublet's OS has not yet reached significance and awaits the planned final analyses. Diarrhea, not myelosuppression, is the dominant zanidatamab-class toxicity.","url":"https://app.notion.com/p/3e3127970a62813c9991ff8f67e9c830"},{"db":"met","name":"KEYNOTE-158","year":2020,"phase":"II","cancer":"BTC","biomarker":"MSI-H / dMMR","setting":"2L / 3L","n":null,"population":"Previously-treated, advanced/metastatic MSI-H/dMMR noncolorectal solid tumors (27 tumor types, N=233), progressed on or intolerant to ≥1 prior therapy. Cholangiocarcinoma was the third most common tumor type (9.4%, n=22).","treatment":"Pembrolizumab monotherapy (single-arm, pan-tumor basket trial)","tx":["ICI"],"endpoints":[["ORR (1°)","✅ 34.3% (28.3–40.8), all tumor types"],["ORR, cholangiocarcinoma cohort","40.9% (20.7–63.6), n=22"],["OS, cholangiocarcinoma cohort","24.3 mo (6.5–NR)"],["Durability","87% of responders ongoing ≥12 mo"]],"takeaway":"Pan-tumor evidence that pembrolizumab monotherapy is highly active in MSI-H/dMMR solid tumors regardless of anatomic origin, supporting a biomarker-driven, tumor-agnostic option rather than a BTC-specific trial design. Directly relevant to BTC: the cholangiocarcinoma subgroup (n=22) had an ORR of 40.9% and median OS of 24.3 months, dramatically better than unselected chemo-refractory BTC. MSI-H/dMMR is uncommon in BTC (roughly 1-3% of cases) but identifies a small subset with markedly better immunotherapy outcomes when present.","url":"https://app.notion.com/p/3e3127970a6281f8a305dd08a10be7cd"},{"db":"met","name":"NIFTY","year":2021,"phase":"II","cancer":"BTC","biomarker":null,"setting":"2L","n":null,"population":"Metastatic biliary tract cancer (intra-/extrahepatic CCA, gallbladder), with radiological progression on 1L gemcitabine+cisplatin. ECOG 0-1; South Korea, 5 centres; 100% metastatic by design.","treatment":"Liposomal irinotecan + 5-FU/LV vs. 5-FU/LV alone","tx":["ChT"],"endpoints":[["PFS (1°, BICR)","✅ 7.1 vs 1.4 mo — HR 0.56 (0.39–0.81), P=0.0019"],["OS","✅ 8.6 vs 5.5 mo — HR 0.68 (0.48–0.98), P=0.035"],["DCR","✅ 64.8% vs 34.9%, P=0.0002"],["ORR","⚠️ 14.8% vs 5.8%, P=0.068 — trend only, not significant"]],"takeaway":"First randomized trial to show superiority of a combination regimen over a fluoropyrimidine-alone backbone in second-line advanced BTC after gemcitabine-platinum failure. PFS, OS, and disease control rate all met, though the response-rate difference was only a trend — response-based endpoints appear to under-detect benefit in BTC, where disease stabilization often drives the survival gain. Complements ABC-06 (chemotherapy vs. active symptom control) as a second evidence-based 2L option.","url":"https://app.notion.com/p/3e3127970a628149b623f2123edbeb73"},{"db":"met","name":"VISION","year":2020,"phase":"II","cancer":"Lung","biomarker":"MET (exon 14 skipping)","setting":"1L–3L","n":99,"population":"Advanced/metastatic NSCLC with centrally-confirmed MET exon 14 skipping mutation, detected by liquid and/or tissue biopsy. Efficacy population (combined-biopsy, N=99): median age 74, 90% adenocarcinoma; up to 2 prior lines (43% treatment-naïve, 33% 1 prior line, 23% ≥2 prior lines). Stable/treated brain metastases eligible (11% had brain mets).","treatment":"Tepotinib monotherapy (single-arm)","tx":["TKI"],"endpoints":[["ORR (1°)","✅ 46% (36–57), combined biopsy — consistent whether MET ex14 skipping was detected by liquid biopsy (48%, 36–61) or tissue biopsy (50%, 37–63)"],["DOR","Median 11.1 mo (combined biopsy); up to 15.7 mo (tissue-biopsy group) — durable"],["PFS","8.5 mo (6.7–11.0), combined biopsy; 11.0 mo (5.7–17.1), tissue-biopsy group"],["ORR, brain metastases (n=11)","55% (23–83)"],["OS","⏳ 17.1 mo (immature at cutoff; 35% had received subsequent therapy)"]],"takeaway":"Establishes tepotinib, an oral MET TKI, as a targeted option for advanced NSCLC with MET exon 14 skipping mutations (~3-4% of NSCLC) — a single-arm trial with no internal comparator, but its ORR (46%) and durability (DOR up to 15.7 months) compare favorably with earlier-generation MET-directed therapy such as crizotinib and capmatinib. Response was consistent whether MET exon 14 skipping was detected by liquid or tissue biopsy, supporting either as an adequate diagnostic strategy, and activity was maintained in patients with brain metastases (ORR 55%). Peripheral edema (7% grade ≥3) is the class-defining toxicity of MET inhibitors.","url":"https://app.notion.com/p/3e3127970a6281789380fcf74be9b5d3"},{"db":"met","name":"LUMINOSITY","year":2024,"phase":"II","cancer":"Lung","biomarker":"MET (protein overexpression, IHC)","setting":"2L / 3L","n":161,"population":"Previously-treated, c-Met protein-overexpressing (IHC ≥25% 3+), nonsquamous EGFR-wildtype NSCLC. Up to 2 prior lines (≤1 prior cytotoxic chemo); heavily pretreated (98% prior platinum, 82% prior checkpoint inhibitor). Split into c-Met high (≥50% 3+, n=78) and c-Met intermediate (25–<50% 3+, n=83) subgroups.","treatment":"Telisotuzumab vedotin (Teliso-V) monotherapy (single-arm)","tx":["ADC"],"endpoints":[["ORR (1°)","✅ 28.6% (21.7–36.2), c-Met OE total — 34.6% (24.2–46.2) c-Met high; 22.9% (14.4–33.4) c-Met intermediate"],["DCR","59.0% (51.0–66.7) — 60.3% c-Met high; 57.8% c-Met intermediate"],["PFS","5.7 mo (4.6–6.9) — comparable across c-Met high (5.5 mo) and intermediate (6.0 mo)"],["OS","14.5 mo (9.9–16.6) — comparable across c-Met high (14.6 mo) and intermediate (14.2 mo)"],["DOR","8.3 mo (5.6–11.3); DOR ≥6 mo in 56.5% of responders"]],"takeaway":"Establishes c-Met protein overexpression by IHC — not a genomic MET alteration — as the selection biomarker for telisotuzumab vedotin (Teliso-V), a c-Met-directed ADC, in previously-treated nonsquamous EGFR-wildtype NSCLC; this protein-expression strategy is eligible in a much larger population (~25% of nonsquamous EGFR-wildtype NSCLC) than genomic MET exon 14 skipping (~3-4%). ORR was numerically higher in c-Met-high (34.6%) than c-Met-intermediate (22.9%) tumors, but DCR, PFS, and OS were comparable across both tiers, so efficacy is not confined to the c-Met-high group alone. Single-arm with no internal comparator; ILD (9.9%, including 3 grade 5 events) and peripheral neuropathy are the notable toxicities, and the squamous/EGFR-mutant cohorts closed for futility, supporting an ongoing phase 3 trial vs docetaxel in this population.","url":"https://app.notion.com/p/3e3127970a628119a67cdddeea95fdd8"}];</script>
<title>Trial Recall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#eceff1; --surface:#ffffff; --surface-2:#f4f7f8; --surface-3:#e4e9ec;
  --ink:#11171b; --ink-2:#3e4b53; --ink-3:#6c7b84;
  --rule:#d3dadd; --rule-2:#c2cbd0;
  --early:#0d6e5f; --early-tint:#dcecea; --early-line:#9ecabf;
  --met:#8c3a6b; --met-tint:#f3e1ec; --met-line:#d5a6c2;
  --pos:#1c7a4f; --cau:#8a6400; --neg:#a33232; --neu:#5b6b74; --pend:#5a6a99;
  --shadow:0 1px 2px rgba(17,23,27,.06), 0 8px 28px -12px rgba(17,23,27,.22);
  --accent:var(--early); --accent-tint:var(--early-tint); --accent-line:var(--early-line);
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1215; --surface:#161d21; --surface-2:#1b242a; --surface-3:#243036;
    --ink:#e9eff2; --ink-2:#aab9c1; --ink-3:#7d8e98;
    --rule:#2a353b; --rule-2:#35434a;
    --early:#4fd3ba; --early-tint:#0f302b; --early-line:#1f5a50;
    --met:#e78fbe; --met-tint:#35182b; --met-line:#6b3354;
    --pos:#5ad19a; --cau:#dfb54c; --neg:#f2908e; --neu:#8fa0aa; --pend:#9aabe0;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0d1215; --surface:#161d21; --surface-2:#1b242a; --surface-3:#243036;
  --ink:#e9eff2; --ink-2:#aab9c1; --ink-3:#7d8e98;
  --rule:#2a353b; --rule-2:#35434a;
  --early:#4fd3ba; --early-tint:#0f302b; --early-line:#1f5a50;
  --met:#e78fbe; --met-tint:#35182b; --met-line:#6b3354;
  --pos:#5ad19a; --cau:#dfb54c; --neg:#f2908e; --neu:#8fa0aa; --pend:#9aabe0;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:1080px; margin:0 auto; padding-inline:18px; padding-block:22px 56px}
a{color:var(--accent)}
button,select,input{font:inherit; color:inherit; touch-action:manipulation}
button{-webkit-appearance:none; appearance:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* installed as an app: no browser chrome, so clear the status bar ourselves */
body.standalone .wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))}

/* ---------- masthead ---------- */
.head{display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 16px; margin-bottom:16px}
.head h1{
  font-family:var(--serif); font-weight:600; font-size:27px; letter-spacing:-.01em;
  margin:0; text-wrap:balance;
}
.head .sub{color:var(--ink-3); font-size:13px; margin:0}
.head .sub b{color:var(--ink-2); font-weight:500; font-family:var(--mono); font-size:12.5px}
.spacer{flex:1 1 auto}

/* ---------- controls ---------- */
.rail{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:10px; background:var(--surface); border:1px solid var(--rule);
  border-radius:10px; margin-bottom:14px;
}
.seg{display:flex; border:1px solid var(--rule-2); border-radius:7px; overflow:hidden}
.seg button{
  background:transparent; border:0; padding:6px 11px; cursor:pointer;
  font-size:12.5px; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--surface)}
.seg button[aria-pressed="true"].d-early{background:var(--early)}
.seg button[aria-pressed="true"].d-met{background:var(--met)}
select,.srch{
  background:var(--surface-2); border:1px solid var(--rule-2); border-radius:7px;
  padding:6px 9px; font-size:12.5px; max-width:100%;
  -webkit-appearance:none; appearance:none;
}
select{padding-right:26px; background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%); background-position:right 12px center,right 7px center; background-size:5px 5px,5px 5px; background-repeat:no-repeat}
.srch{min-width:150px; flex:1 1 150px}
.more{display:contents}
.only-mobile{display:none}
.btn{
  background:var(--surface-2); border:1px solid var(--rule-2); border-radius:7px;
  padding:6px 11px; font-size:12.5px; font-weight:500; cursor:pointer; white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn.on{background:var(--accent); border-color:var(--accent); color:var(--surface)}

/* ---------- progress ---------- */
.meter{display:flex; align-items:center; gap:11px; margin-bottom:6px}
.meter .track{flex:1; height:3px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.meter .fill{height:100%; background:var(--accent); transition:width .25s ease}
.meter .count{
  font-family:var(--mono); font-size:12px; color:var(--ink-3);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.runbar{
  display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
  font-size:11.5px; color:var(--ink-3); margin-bottom:14px; min-height:17px;
}
.runbar button{
  background:none; border:0; padding:0; font-size:11.5px; color:var(--accent);
  cursor:pointer; text-decoration:underline; text-underline-offset:2px;
}

/* ---------- card ---------- */
.stage{display:flex; flex-direction:column; gap:12px}
.card{
  background:var(--surface); border:1px solid var(--rule); border-top:3px solid var(--accent);
  border-radius:12px; box-shadow:var(--shadow); overflow:hidden;
}
.card.d-early{--accent:var(--early); --accent-tint:var(--early-tint); --accent-line:var(--early-line)}
.card.d-met{--accent:var(--met); --accent-tint:var(--met-tint); --accent-line:var(--met-line)}

.face{padding:26px 26px 22px; display:flex; flex-direction:column; gap:13px}
.chips{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chip{
  font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  padding:3px 8px; border-radius:4px; background:var(--surface-3); color:var(--ink-2);
}
.chip.deck{background:var(--accent-tint); color:var(--accent); border:1px solid var(--accent-line)}
.chip.bm{background:transparent; border:1px dashed var(--rule-2); color:var(--ink-3); letter-spacing:.05em}
.title{
  font-family:var(--serif); font-weight:600; font-size:clamp(25px,4.6vw,36px);
  line-height:1.14; letter-spacing:-.015em; margin:0; text-wrap:balance;
}
.facts{
  display:flex; flex-wrap:wrap; gap:4px 16px; font-family:var(--mono);
  font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;
}
.facts span b{color:var(--ink-2); font-weight:500}
.cue{
  font-size:13px; color:var(--ink-3); font-style:italic; font-family:var(--serif);
  border-top:1px dashed var(--rule); padding-top:13px; margin:0;
}

/* revealed body */
.body{border-top:1px solid var(--rule); padding:4px 26px 24px; display:flex; flex-direction:column}
.block{padding-top:19px; display:flex; flex-direction:column; gap:6px}
.block+.block{border-top:1px solid var(--rule); margin-top:19px}
.lbl{
  font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3);
}
.block p{margin:0; max-width:66ch; color:var(--ink-2)}
.block p.arms{color:var(--ink); font-weight:500}

/* endpoint table */
.ep{display:flex; flex-direction:column; gap:1px; margin-top:2px}
.ep .row{display:grid; grid-template-columns:132px 1fr; gap:0 14px; padding:7px 0 7px 11px; border-left:3px solid var(--neu)}
.ep .row.pos{border-left-color:var(--pos)}
.ep .row.cau{border-left-color:var(--cau)}
.ep .row.neg{border-left-color:var(--neg)}
.ep .row.pend{border-left-color:var(--pend)}
.ep .row.note{border-left-color:var(--accent)}
.ep .k{
  font-size:11.5px; font-weight:600; letter-spacing:.03em; color:var(--ink-2);
  text-transform:uppercase; padding-top:2px;
}
.ep .v{font-family:var(--mono); font-size:12.8px; line-height:1.5; color:var(--ink); font-variant-numeric:tabular-nums}
.ep .row.pos .v{color:var(--pos)}
.ep .row.neg .v{color:var(--neg)}
.ep .row.cau .v{color:var(--cau)}
.ep .row.pend .v{color:var(--pend)}

/* takeaway */
.take{background:var(--accent-tint); border-top:1px solid var(--accent-line); padding:20px 26px 22px}
.take .lbl{color:var(--accent)}
.take p{
  margin:6px 0 0; font-family:var(--serif); font-size:17.5px; line-height:1.45;
  color:var(--ink); max-width:62ch;
}
.src{padding:13px 26px 16px; border-top:1px solid var(--rule); font-size:12px; color:var(--ink-3)}
.src a{text-decoration:none; border-bottom:1px solid var(--accent-line)}

/* footer nav */
.nav{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.nav .hint{
  flex:1 1 auto; text-align:right; font-size:11.5px; color:var(--ink-3);
  font-family:var(--mono);
}
kbd{
  font-family:var(--mono); font-size:10.5px; background:var(--surface-3);
  border:1px solid var(--rule-2); border-bottom-width:2px; border-radius:4px;
  padding:1px 5px; color:var(--ink-2);
}
.primary{background:var(--accent); border-color:var(--accent); color:var(--surface); font-weight:600}
.primary:hover{filter:brightness(1.08); background:var(--accent)}

/* ---------- index ---------- */
.index{background:var(--surface); border:1px solid var(--rule); border-radius:12px; overflow:hidden}
.index .grp{
  padding:9px 16px; background:var(--surface-2); border-bottom:1px solid var(--rule);
  font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3);
  position:sticky; top:0;
}
.index button.item{
  display:grid; grid-template-columns:1fr auto; gap:3px 14px; align-items:baseline;
  width:100%; text-align:left; background:transparent; border:0;
  border-bottom:1px solid var(--rule); padding:10px 16px; cursor:pointer;
}
.index button.item:hover{background:var(--surface-2)}
.index .nm{font-family:var(--serif); font-size:16px; font-weight:500; color:var(--ink)}
.index .mt{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); text-align:right}
.index .tk{grid-column:1/-1; font-size:12.5px; color:var(--ink-3); max-width:80ch}
.star-on{color:var(--cau)}
.empty{padding:34px 20px; text-align:center; color:var(--ink-3); font-size:14px}

/* ---------- install sheet ---------- */
.sheet[hidden]{display:none}
.sheet{
  position:fixed; inset:0; z-index:60; background:rgba(8,12,15,.55);
  display:flex; align-items:center; justify-content:center; padding:18px;
}
.sheet .panel{
  background:var(--surface); border:1px solid var(--rule); border-radius:12px;
  box-shadow:var(--shadow); max-width:430px; width:100%;
  max-height:86vh; overflow-y:auto; padding:22px 22px 18px;
}
.sheet h2{font-family:var(--serif); font-size:20px; margin:0 0 4px; font-weight:600}
.sheet .note{font-size:12.5px; color:var(--ink-3); margin:0 0 16px}
.sheet h3{
  font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); margin:16px 0 5px;
}
.sheet ol{margin:0; padding-left:19px; font-size:13.5px; color:var(--ink-2)}
.sheet li{margin:3px 0}
.sheet .close{margin-top:18px; width:100%; text-align:center}

@media (max-width:640px){
  .wrap{padding-block:14px 20px}
  .head{gap:4px 12px; margin-bottom:12px}
  .head h1{font-size:23px}
  .head .sub{font-size:12px}
  .face{padding:20px 18px 18px}
  .body{padding-inline:18px}
  .take{padding-inline:18px}
  .src{padding-inline:18px}
  .ep .row{grid-template-columns:1fr; gap:3px; padding-left:10px}
  .index button.item{grid-template-columns:1fr; padding-block:13px}
  .index .mt{text-align:left}

  /* 16px stops iOS Safari zooming the page when a field takes focus */
  .srch{font-size:16px; padding:9px 11px; flex:1 1 100%; min-width:0}
  select{font-size:16px; padding:9px 26px 9px 11px}
  .only-mobile{display:inline-flex}
  .seg button{padding:9px 12px; font-size:13px}
  .rail{padding:9px; gap:7px}
  .more{display:none; width:100%; flex-wrap:wrap; gap:7px}
  .more.open{display:flex}
  .more select{flex:1 1 46%}
  .more .btn{flex:1 1 auto; text-align:center}

  /* actions stay under the thumb instead of below a long card */
  .nav{
    position:sticky; bottom:0; z-index:20; gap:7px;
    background:var(--paper); border-top:1px solid var(--rule);
    margin-inline:-18px; margin-top:0;
    padding:9px 18px calc(9px + env(safe-area-inset-bottom,0px));
  }
  .nav .hint{display:none}
  .nav .btn{min-height:44px; display:inline-flex; align-items:center; justify-content:center}
  .nav #next{flex:1 1 auto}
  .stage{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <h1>Trial Recall</h1>
    <p class="sub"><b id="tot">—</b> trials from your Oncology Database</p>
    <span class="spacer"></span>
    <p class="sub" id="deckcount"></p>
  </header>

  <div class="rail">
    <div class="seg" role="group" aria-label="Database">
      <button type="button" id="dAll" data-deck="all" aria-pressed="true">All</button>
      <button type="button" id="dEarly" class="d-early" data-deck="early" aria-pressed="false">Early stage</button>
      <button type="button" id="dMet" class="d-met" data-deck="met" aria-pressed="false">Metastatic</button>
    </div>
    <input class="srch" id="q" type="search" placeholder="Search trial, drug, biomarker…" aria-label="Search">
    <button type="button" class="btn only-mobile" id="moreBtn" aria-expanded="false" aria-controls="more">Filters</button>
    <div class="more" id="more">
      <select id="fCancer" aria-label="Cancer type"><option value="">All cancers</option></select>
      <select id="fSetting" aria-label="Setting or line"><option value="">All settings</option></select>
      <select id="fTx" aria-label="Treatment class"><option value="">All treatments</option></select>
      <button type="button" class="btn" id="shuffle">New run</button>
      <button type="button" class="btn" id="starOnly" aria-pressed="false">★ Starred</button>
      <button type="button" class="btn" id="viewBtn">Index</button>
    </div>
    <button type="button" class="btn" id="installBtn">Add to device</button>
  </div>

  <div class="meter">
    <span class="count" id="pos">0 / 0</span>
    <span class="track"><span class="fill" id="fill" style="width:0%"></span></span>
    <span class="count" id="starCount">★ 0</span>
  </div>
  <div class="runbar" id="runbar"></div>

  <section class="stage" id="stage">
    <article class="card" id="card" aria-live="polite"></article>
    <div class="nav">
      <button type="button" class="btn" id="prev">← Previous</button>
      <button type="button" class="btn primary" id="next">Reveal</button>
      <button type="button" class="btn" id="star">★ Star</button>
      <span class="hint"><kbd>space</kbd> reveal · <kbd>←</kbd><kbd>→</kbd> move · <kbd>s</kbd> star · <kbd>/</kbd> search</span>
    </div>
  </section>

  <section class="index" id="index" hidden></section>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="panel">
    <h2 id="sheetTitle">Keep Trial Recall on your device</h2>
    <p class="note" id="sheetNote">Adds a home-screen or dock icon that opens the deck full screen, without browser chrome.</p>
    <div id="sheetBody"></div>
    <button type="button" class="btn close" id="sheetClose">Close</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============ persistence ============
     One record holds the shuffled run, the position in it, the revealed
     depth and the filters, so reopening resumes exactly where you stopped.
     Stars are keyed by Notion url, not name: a sync can rename a card. */
  var KEY="trialrecall.v2", OLDKEY="trialrecall.stars";
  var S={order:[],pos:0,stage:0,stars:{},filters:{deck:"all",cancer:"",setting:"",tx:"",q:"",starOnly:false}};
  var resumed=false, saveTimer=null;

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(raw){
        var d=JSON.parse(raw);
        if(d&&typeof d==="object"){
          S.order=Array.isArray(d.order)?d.order:[];
          S.pos=typeof d.pos==="number"?d.pos:0;
          S.stage=typeof d.stage==="number"?d.stage:0;
          S.stars=d.stars&&typeof d.stars==="object"?d.stars:{};
          if(d.filters&&typeof d.filters==="object"){
            for(var k in S.filters) if(k in d.filters) S.filters[k]=d.filters[k];
          }
        }
      }
    }catch(e){}
    return migrateStars();
  }
  /* v1 keyed stars by trial name; carry them over once we know the deck */
  var legacyStarNames=null;
  function migrateStars(){
    try{
      var old=localStorage.getItem(OLDKEY);
      if(old&&!Object.keys(S.stars).length) legacyStarNames=JSON.parse(old);
    }catch(e){}
  }
  function save(){
    if(saveTimer) return;
    saveTimer=setTimeout(function(){
      saveTimer=null;
      try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    },150);
  }

  var CARDS=[], byUrl=Object.create(null), view=[], mode="card";
  var card=document.getElementById("card"), index=document.getElementById("index");

  /* ---- helpers ---- */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  var MARK={"✅":"pos","❌":"neg","⚠":"cau","↔":"neu","⏳":"pend","\u{1F4DD}":"pend","⭐":"note"};
  function grade(v){
    var s=String(v||"").trim();
    for(var k in MARK){ if(s.indexOf(k)===0) return {cls:MARK[k], text:s.slice(k.length).replace(/^️?\s*/,"")}; }
    return {cls:"neu", text:s};
  }
  /* plain scan, not a lookbehind regex — Safari before iOS 16.4 throws on those */
  function firstSentence(s){
    s=String(s==null?"":s).trim();
    var k=s.search(/\.[\s]/);
    return k<0 ? s : s.slice(0,k+1);
  }
  function toTop(){
    try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); }
  }
  function group(c){
    if(/^Lung/.test(c)) return "Lung";
    if(/^Pan-tumour/.test(c)) return "Pan-tumour";
    if(/^Sarcoma/.test(c)) return "Sarcoma";
    if(/^Skin/.test(c)) return "Skin";
    return c;
  }
  function bucket(s){
    if(s==="Adjuvant"||s==="Neoadjuvant"||s==="Peri-OP") return s;
    if(/1L/.test(s)&&!/2L|3L/.test(s)) return "1st line";
    if(/^2L/.test(s)) return "2nd line";
    if(/^3L/.test(s)) return "3rd line";
    return "Multi-line";
  }
  function shuffled(a){
    a=a.slice();
    for(var k=a.length-1;k>0;k--){ var j=Math.floor(Math.random()*(k+1)); var t=a[k]; a[k]=a[j]; a[j]=t; }
    return a;
  }

  /* ---- the run: a shuffled pass over the current filtered view ---- */
  function pool(){
    var f=S.filters, qv=(f.q||"").trim().toLowerCase();
    return CARDS.filter(function(c){
      if(f.deck!=="all" && c.db!==f.deck) return false;
      if(f.starOnly && !S.stars[c.url]) return false;
      if(f.cancer && group(c.cancer)!==f.cancer) return false;
      if(f.setting && bucket(c.setting)!==f.setting) return false;
      if(f.tx && (c.tx||[]).indexOf(f.tx)<0) return false;
      if(qv && c._hay.indexOf(qv)<0) return false;
      return true;
    });
  }

  /* Rebuild the run for the current filters, keeping as much of the saved
     progress as still applies. Cards added by a sync are shuffled into the
     part of the run you have not reached yet, so a sync never restarts you. */
  function rebuild(fresh){
    var p=pool(), live=Object.create(null), k;
    p.forEach(function(c){ live[c.url]=1; });

    var kept=[];
    if(!fresh){
      for(k=0;k<S.order.length;k++) if(live[S.order[k]]) kept.push(S.order[k]);
    }
    var seen=Object.create(null);
    kept.forEach(function(u){ seen[u]=1; });
    var added=[];
    for(k=0;k<p.length;k++) if(!seen[p[k].url]) added.push(p[k].url);

    if(!kept.length){                       /* nothing to resume: fresh shuffle */
      S.order=shuffled(added); S.pos=0; S.stage=0;
    }else{
      added=shuffled(added);
      var at=Math.min(Math.max(S.pos+1,0), kept.length);
      S.order=kept.slice(0,at).concat(added, kept.slice(at));
      if(S.pos>=S.order.length) S.pos=0;
    }
    view=S.order.map(function(u){ return byUrl[u]; }).filter(Boolean);
    if(S.pos>=view.length) S.pos=0;
    save();
  }

  function current(){ return view[S.pos]; }

  /* ---- render ---- */
  function render(){
    var n=view.length, c=current();
    document.getElementById("pos").textContent=(n?S.pos+1:0)+" / "+n;
    document.getElementById("fill").style.width=(n?((S.pos+1)/n*100):0)+"%";
    document.getElementById("starCount").textContent="★ "+Object.keys(S.stars).length;
    document.getElementById("deckcount").textContent=n+" in view";
    renderRunbar(n);

    if(mode==="index"){ renderIndex(); return; }
    if(!n){
      card.className="card";
      card.innerHTML='<div class="empty">No trials match these filters. Clear the search or pick another cancer type.</div>';
      document.getElementById("next").textContent="Reveal";
      return;
    }
    card.className="card d-"+c.db;
    var chips='<span class="chip deck">'+(c.db==="early"?"Early stage":"Metastatic")+'</span>'+
      '<span class="chip">'+esc(c.cancer)+'</span>'+
      '<span class="chip">'+esc(c.setting)+'</span>'+
      (c.biomarker?'<span class="chip bm">'+esc(c.biomarker)+'</span>':"")+
      (S.stars[c.url]?'<span class="chip star-on">★ starred</span>':"");

    var facts=[];
    if(c.phase) facts.push("<span>Phase <b>"+esc(c.phase)+"</b></span>");
    if(c.year)  facts.push("<span>Reported <b>"+esc(c.year)+"</b></span>");
    if(c.n)     facts.push("<span>n = <b>"+c.n.toLocaleString("en-US")+"</b></span>");

    var h='<div class="face">'+
      '<div class="chips">'+chips+'</div>'+
      '<h2 class="title">'+esc(c.name)+'</h2>'+
      (facts.length?'<div class="facts">'+facts.join("")+'</div>':"")+
      (S.stage===0?'<p class="cue">Who was enrolled, what were they given, and what did it show?</p>':"")+
      '</div>';

    if(S.stage>=1){
      var eps=(c.endpoints||[]).map(function(e){
        var g=grade(e[1]);
        return '<div class="row '+g.cls+'"><div class="k">'+esc(e[0])+'</div><div class="v">'+esc(g.text)+'</div></div>';
      }).join("");
      h+='<div class="body">'+
        '<div class="block"><div class="lbl">Key patient population</div><p>'+esc(c.population)+'</p></div>'+
        '<div class="block"><div class="lbl">Treatment</div><p class="arms">'+esc(c.treatment)+'</p></div>'+
        '<div class="block"><div class="lbl">Efficacy endpoints</div><div class="ep">'+eps+'</div></div>'+
        '</div>';
    }
    if(S.stage>=2){
      h+='<div class="take"><div class="lbl">Key takeaway</div><p>'+esc(c.takeaway)+'</p></div>';
      h+='<div class="src">Source: <a href="'+esc(c.url)+'" target="_blank" rel="noopener">open in Notion ↗</a></div>';
    }
    card.innerHTML=h;
    document.getElementById("next").textContent =
      S.stage===0?"Reveal answer" : S.stage===1?"Reveal takeaway" : "Next trial →";
    document.getElementById("star").textContent = S.stars[c.url]?"★ Starred":"☆ Star";
  }

  function renderRunbar(n){
    var el=document.getElementById("runbar");
    if(!n){ el.innerHTML=""; return; }
    var bits=[];
    if(resumed && S.pos>0) bits.push("Resumed where you left off");
    else if(S.pos===0) bits.push("Shuffled run — random order");
    if(S.pos>=n-1) bits.push("Last card in this run");
    el.innerHTML=(bits.join(" · ")||"&nbsp;")+
      ' <button type="button" id="newrun">Start a new shuffled run</button>';
    var b=document.getElementById("newrun");
    if(b) b.addEventListener("click",newRun);
  }

  /* the index is for lookup, so it stays alphabetical whatever the run order */
  function renderIndex(){
    if(!view.length){ index.innerHTML='<div class="empty">No trials match these filters.</div>'; return; }
    var sorted=view.slice().sort(function(a,b){
      return (a.db+group(a.cancer)+a.name).localeCompare(b.db+group(b.cancer)+b.name);
    });
    var out=[], last="";
    sorted.forEach(function(c){
      var g=(c.db==="early"?"Early stage":"Metastatic")+" · "+group(c.cancer);
      if(g!==last){ out.push('<div class="grp">'+esc(g)+"</div>"); last=g; }
      out.push('<button type="button" class="item" data-u="'+esc(c.url)+'">'+
        '<span class="nm">'+esc(c.name)+(S.stars[c.url]?' <span class="star-on">★</span>':"")+'</span>'+
        '<span class="mt">'+esc(c.setting)+" · "+esc(c.phase||"—")+(c.year?" · "+c.year:"")+'</span>'+
        '<span class="tk">'+esc(firstSentence(c.takeaway))+'</span>'+
        '</button>');
    });
    index.innerHTML=out.join("");
  }

  /* ---- navigation ---- */
  function go(d){
    if(!view.length) return;
    resumed=false;
    S.pos=(S.pos+d+view.length)%view.length; S.stage=0;
    save(); render(); toTop();
  }
  function advance(){
    if(!view.length) return;
    if(S.stage<2){ S.stage++; save(); render(); } else go(1);
  }
  function newRun(){
    resumed=false;
    rebuild(true); S.stage=0; mode="card";
    document.getElementById("stage").hidden=false; index.hidden=true;
    var v=document.getElementById("viewBtn"); v.textContent="Index"; v.classList.remove("on");
    render(); toTop();
  }
  function toggleStar(){
    var c=current(); if(!c||mode==="index") return;
    if(S.stars[c.url]) delete S.stars[c.url]; else S.stars[c.url]=1;
    save(); render();
  }
  function filtersChanged(){
    resumed=false;
    S.filters.deck=document.querySelector('.seg button[aria-pressed="true"]').dataset.deck;
    S.filters.q=document.getElementById("q").value;
    S.filters.cancer=document.getElementById("fCancer").value;
    S.filters.setting=document.getElementById("fSetting").value;
    S.filters.tx=document.getElementById("fTx").value;
    rebuild(true); S.stage=0; render();
  }

  /* ---- wiring ---- */
  document.querySelectorAll(".seg button").forEach(function(b){
    b.addEventListener("click",function(){
      document.querySelectorAll(".seg button").forEach(function(x){
        x.setAttribute("aria-pressed", String(x===b)); });
      filtersChanged();
    });
  });
  ["q","fCancer","fSetting","fTx"].forEach(function(id){
    document.getElementById(id).addEventListener("input",filtersChanged);
  });
  document.getElementById("shuffle").addEventListener("click",newRun);
  document.getElementById("starOnly").addEventListener("click",function(){
    S.filters.starOnly=!S.filters.starOnly;
    this.setAttribute("aria-pressed",String(S.filters.starOnly));
    this.classList.toggle("on",S.filters.starOnly);
    filtersChanged();
  });
  document.getElementById("viewBtn").addEventListener("click",function(){
    mode = mode==="card" ? "index" : "card";
    this.textContent = mode==="card" ? "Index" : "Cards";
    this.classList.toggle("on", mode==="index");
    document.getElementById("stage").hidden = mode==="index";
    index.hidden = mode!=="index";
    render();
  });
  index.addEventListener("click",function(e){
    var b=e.target.closest("button.item"); if(!b) return;
    var u=b.dataset.u, k=S.order.indexOf(u);
    if(k<0) return;
    resumed=false;
    S.pos=k; S.stage=0; mode="card";
    var v=document.getElementById("viewBtn"); v.textContent="Index"; v.classList.remove("on");
    document.getElementById("stage").hidden=false; index.hidden=true;
    save(); render(); toTop();
  });
  document.getElementById("moreBtn").addEventListener("click",function(){
    var m=document.getElementById("more"), open=m.classList.toggle("open");
    this.setAttribute("aria-expanded",String(open));
    this.classList.toggle("on",open);
    this.textContent = open ? "Hide filters" : "Filters";
  });
  document.getElementById("next").addEventListener("click",advance);
  document.getElementById("prev").addEventListener("click",function(){ go(-1); });
  document.getElementById("star").addEventListener("click",toggleStar);
  card.addEventListener("click",function(e){
    if(e.target.closest("a")) return;
    if(swiped) return;                       /* a swipe is not a tap */
    var sel=window.getSelection&&window.getSelection();
    if(sel&&!sel.isCollapsed) return;        /* let people select the numbers */
    advance();
  });

  /* swipe between trials — the natural phone gesture */
  var tx0=0, ty0=0, swiped=false;
  var stageEl=document.getElementById("stage");
  stageEl.addEventListener("touchstart",function(e){
    if(e.touches.length!==1){ swiped=true; return; }
    swiped=false; tx0=e.touches[0].clientX; ty0=e.touches[0].clientY;
  },{passive:true});
  stageEl.addEventListener("touchend",function(e){
    var t=e.changedTouches&&e.changedTouches[0]; if(!t||swiped) return;
    var dx=t.clientX-tx0, dy=t.clientY-ty0;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.6){ swiped=true; go(dx<0?1:-1); }
  },{passive:true});

  document.addEventListener("keydown",function(e){
    if(!document.getElementById("sheet").hidden){
      if(e.key==="Escape") closeSheet();
      return;
    }
    var t=e.target.tagName;
    if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA"){ if(e.key==="Escape") e.target.blur(); return; }
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); advance(); }
    else if(e.key==="ArrowRight"){ e.preventDefault(); go(1); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); go(-1); }
    else if(e.key==="s"||e.key==="S"){ toggleStar(); }
    else if(e.key==="/"){ e.preventDefault(); document.getElementById("q").focus(); }
  });
  /* last-moment save, for a swipe-away that fires no unload */
