<script>window.TRIAL_RECALL_DATA=[{"db":"early","name":"ABCSG-16 (SALSA)","year":2021,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":3484,"population":"Postmenopausal HR+ who already completed 5 yr adjuvant ET. Median age 64. T1 73%, N0 67%. 71% no chemo.","treatment":"Extended anastrozole 2 more yr (total 7) vs 5 more yr (total 10)","tx":["ET"],"endpoints":[["DFS (1°)","❌ 8-yr DFS 73.6% vs 73.9% — HR 0.99 (0.85–1.15), P=0.90"],["OS","❌ 8-yr 87.5% vs 87.3% — HR 1.02 (0.83–1.25)"],["Distant recurrence","❌ HR 0.99 (0.74–1.31)"],["Harm","⚠️ Clinical fracture HR 1.35 (1.00–1.84) — favours shorter arm"]],"takeaway":"5 extra yr of anastrozole is no better than 2 after an initial 5 yr of ET — and costs more fractures. Shorter extension is enough.","url":"https://app.notion.com/3cf127970a62817d8fa2ced9568e84f0"},{"db":"early","name":"ACOSOG Z1031","year":2011,"phase":"II","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Neoadjuvant","n":377,"population":"Postmenopausal, ER+, clinical stage II–III (>2 cm; T2–T4c, N0–3), regardless of HER2.","treatment":"Neoadjuvant exemestane vs letrozole vs anastrozole × 16–18 wk","tx":["ET"],"endpoints":[["PEPI-0 rate (1°)","15.6% (Exe) vs 15.9% (Let) vs 17.3% (Ana), P=0.9 — no difference"],["BCS rate","68% pooled"],["Subtype","Luminal A → PEPI-0 27.1% vs Luminal B 10.7%, P=0.004"]],"takeaway":"All three AIs perform alike as neoadjuvant ET; big breast-conservation gain (68%). Luminal A responds far better than Luminal B.","url":"https://app.notion.com/3a4127970a62819793b8f4c10bed0acb"},{"db":"early","name":"ACTS-GC","year":2007,"phase":"III","cancer":"GC","biomarker":null,"setting":"Adjuvant","n":1059,"population":"Japanese, stage II/IIIa/IIIb (T1 excluded), after R0 gastrectomy + D2 lymphadenectomy.","treatment":"S-1 (TS-1) × 1 year vs surgery alone","tx":["ChT"],"endpoints":[["RFS","✅ 3-yr 72.2% vs 59.6%; 5-yr 65.4% vs 53.1% — HR 0.62 (0.50–0.77), P<0.001"],["OS","✅ 3-yr 80.1% vs 70.1%; 5-yr 71.7% vs 61.1% — HR 0.68 (0.52–0.87), P=0.003"]],"takeaway":"1 year of adjuvant S-1 after D2 resection improves both RFS and OS in Asian gastric cancer. S-1 alone is under-powered for stage III/N2.","url":"https://app.notion.com/2a3127970a6280a083eefd38287175e4"},{"db":"early","name":"ADAURA","year":2020,"phase":"III","cancer":"Lung","biomarker":"EGFR","setting":"Adjuvant","n":682,"population":"Completely resected EGFR Ex19del/L858R NSCLC, stage IB–IIIA (AJCC 7th), ECOG 0–1. Adjuvant chemo allowed pre-randomisation (60%).","treatment":"Osimertinib up to 3 yr vs placebo","tx":["TKI","ChT"],"endpoints":[["DFS (1°)","✅ 65.8 vs 28.1 mo — HR 0.20 (99.12% CI 0.14–0.30); stage II–IIIA HR 0.17"],["CNS DFS","✅ NR vs 48.2 mo — HR 0.18"],["OS","✅ 5-yr 88% vs 78% — HR 0.49 (0.34–0.70)"]],"takeaway":"3 years of adjuvant osimertinib in resected EGFR-mutant stage IB–IIIA NSCLC delivers both DFS and OS benefit, with striking CNS protection.","url":"https://app.notion.com/2ac127970a62809c9b46c4d301c0a33d"},{"db":"early","name":"AEGEAN","year":2023,"phase":"III","cancer":"Lung","biomarker":null,"setting":"Peri-OP","n":802,"population":"Resectable stage IIA–IIIB(N2) NSCLC (AJCC 8th), no EGFR/ALK alteration, ECOG 0–1.","treatment":"Perioperative durvalumab + chemo vs placebo + chemo; adjuvant durvalumab × 1 yr","tx":["ICI"],"endpoints":[["pCR","✅ 17.2% vs 4.3% (Δ13%, P<0.001)"],["EFS (1°)","✅ mEFS NR vs 25.9 mo — HR 0.68 (0.53–0.88), P=0.004; 2-yr 63.3% vs 52.4%"],["OS","⚠️ Immature"]],"takeaway":"Perioperative durvalumab improves pCR and EFS in resectable NSCLC → FDA approved. OS still maturing.","url":"https://app.notion.com/376127970a6280a9b184f3498f3d4865"},{"db":"early","name":"ALASCCA","year":2025,"phase":"III","cancer":"CRC","biomarker":"PIK3CA","setting":"Adjuvant","n":626,"population":"Radically resected PI3K-pathway–altered CRC — stage II–III colon, stage I–III rectum. Median age 66, 52% female, 33% rectal. Grp A = PIK3CA exon 9/20 hotspot; Grp B = other PIK3CA/PIK3R1/PTEN variants.","treatment":"Aspirin 160 mg daily × 3 yr vs placebo, started ≤12 wk after R0 resection","tx":["Others"],"endpoints":[["Recurrence (1°)","✅ Grp A 3-yr 7.7% vs 14.1% — HR 0.49 (0.24–0.98), P=0.04; Grp B HR 0.42 (0.21–0.83)"],["DFS","⚠️ Grp A HR 0.61 (0.34–1.08); ✅ Grp B HR 0.51 (0.29–0.88)"],["OS","⚠️ 5-yr ~91–93% vs ~90%; NS"]],"takeaway":"Cheap, repurposed aspirin halves recurrence in PI3K-altered resected CRC — and the benefit extends past PIK3CA hotspots to PIK3R1/PTEN (~37% of all CRC eligible). Largest effect in rectal cancer and in women.","url":"https://app.notion.com/3d4127970a6281b98c1aeef61986e9b6"},{"db":"early","name":"ALINA","year":2024,"phase":"III","cancer":"Lung","biomarker":"ALK","setting":"Adjuvant","n":257,"population":"Completely resected ALK+ NSCLC, stage IB (≥4 cm)–IIIA (AJCC 7th), ECOG 0–1, no prior systemic therapy.","treatment":"Alectinib 600 mg BID × 2 yr vs platinum chemo × 4 cycles","tx":["TKI","ChT"],"endpoints":[["DFS (1°)","✅ 2-yr 93.6% vs 63.7%; mDFS NR vs 41.3 mo — HR 0.24 (0.13–0.43); updated ITT HR 0.35 (0.23–0.54)"],["CNS DFS","✅ HR 0.37 (0.19–0.74)"],["OS","⚠️ 4-yr 98.4% vs 92.4% — HR 0.40 (0.12–1.32), immature"]],"takeaway":"Chemo-free adjuvant alectinib × 2 yr is now SOC for resected ALK+ NSCLC — dramatic DFS and CNS benefit; OS immature.","url":"https://app.notion.com/2ac127970a6280ae8101d33941a6d2dc"},{"db":"early","name":"AMBASSADOR","year":2024,"phase":"III","cancer":"UC","biomarker":null,"setting":"Adjuvant","n":702,"population":"Muscle-invasive urothelial carcinoma — pT2–T4 after neoadjuvant chemo, or pT3–T4 without.","treatment":"Pembrolizumab vs observation","tx":["ICI"],"endpoints":[["DFS (1°)","✅ 29.6 vs 14.2 mo — HR 0.73 (0.59–0.90), P=0.003"],["OS","❌ 3-yr 60.8% vs 61.9% — HR 0.98 (0.76–1.26)"]],"takeaway":"Adjuvant pembrolizumab doubles DFS in MIBC but shows no OS gain — likely confounded by crossover to adjuvant/salvage nivolumab.","url":"https://app.notion.com/2b7127970a6280acbdd4e0ab5ad43596"},{"db":"early","name":"APHINITY","year":2017,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Adjuvant","n":4805,"population":"HER2+ EBC, node-positive (63%) or high-risk node-negative (tumour >1 cm).","treatment":"Pertuzumab + trastuzumab + chemo (1 yr dual anti-HER2) vs placebo + trastuzumab + chemo","tx":["Anti-HER2"],"endpoints":[["iDFS (1°)","✅ 8-yr 88.4% vs 85.8% — HR 0.77 (0.66–0.91)"],["iDFS node+","✅ 86.1% vs 81.2% — HR 0.72 (0.60–0.87)"],["iDFS node−","❌ 93.3% vs 92.3% — HR 1.01 (0.72–1.42)"],["OS","❌ 8-yr 92.7% vs 92.0% — HR 0.83 (0.68–1.02), P=0.078"]],"takeaway":"Adding 1 yr of pertuzumab is SOC only for node-positive HER2+ EBC. High-risk node-negative gains nothing; OS shows a trend but never reaches significance.","url":"https://app.notion.com/391127970a6281d3a8caeb387aafb202"},{"db":"early","name":"ARTIST","year":2012,"phase":"III","cancer":"GC","biomarker":null,"setting":"Adjuvant","n":458,"population":"Korean, ECOG 0–1, stage IB–IIIB/IV M0, after R0 resection + D2.","treatment":"Capecitabine/cisplatin (XP) + RT vs XP alone","tx":["RT","ChT"],"endpoints":[["DFS (1°)","⚠️ 5-yr 78.2% vs 74.2% — HR 0.74 (0.52–1.05), P=0.09"],["OS","⚠️ 5-yr 75% vs 73% — HR 1.13 (0.78–1.65)"],["Subgroups","✅ N+ 3-yr DFS 76% vs 72%, P=0.04; ✅ intestinal type 94% vs 83%, P=0.01"]],"takeaway":"After a proper D2 resection, adding RT to adjuvant chemo helps locoregional control but not survival — except in node-positive and intestinal-type subgroups.","url":"https://app.notion.com/2a4127970a628093af32f997f5e1b30b"},{"db":"early","name":"ARTIST 2","year":2020,"phase":"III","cancer":"GC","biomarker":null,"setting":"Adjuvant","n":546,"population":"Korean, ECOG 0–1, stage IIA–IIIC, node-positive, after R0 + D2.","treatment":"SOX vs SOX + RT vs S-1 alone","tx":["ChT","RT"],"endpoints":[["3-yr DFS (1°)","S-1 64.8% vs SOX 74.3% vs SOX-RT 72.8%"],["SOX vs S-1","✅ HR 0.69 (0.41–0.99), P=0.042"],["SOX-RT vs SOX","⚠️ HR 0.97 (0.66–1.42), P=0.88 — RT adds nothing"],["OS","⚠️ Pending"]],"takeaway":"Doublet SOX beats single-agent S-1 after D2 resection; adding radiotherapy on top of D2 + doublet is redundant.","url":"https://app.notion.com/2a4127970a6280489ce1c236b02105a7"},{"db":"early","name":"ASTRRA","year":2023,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":1483,"population":"Premenopausal (age ≤45; 58% aged 40–45), ER+, post-surgery + (neo)adjuvant chemo, who remained premenopausal or regained ovarian function within 2 yr of chemo.","treatment":"Tamoxifen 5 yr + ovarian function suppression 2 yr vs tamoxifen alone 5 yr","tx":["ET"],"endpoints":[["DFS (1°)","✅ 8-yr 85.4% vs 80.2% (Δ5.2%) — HR 0.67 (0.51–0.87), P=0.003"],["DMFS","✅ 89.4% vs 85.1% — HR 0.71 (0.52–0.96)"],["OS","⚠️ 8-yr 96.5% vs 95.3% — HR 0.78 (0.49–1.25), NS (only 70 deaths)"]],"takeaway":"Just 2 years of added OFS buys a durable 8-year DFS benefit, greatest at age 40–45 (HR 0.50). Under 40 saw no gain — suggesting they need the full 5 years of OFS.","url":"https://app.notion.com/3ce127970a6281448024d1db1131bd1c"},{"db":"early","name":"ATAC","year":2008,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":9366,"population":"Postmenopausal after surgery ± RT ± chemo. Mean age 64. HR status unrestricted but 84% HR+ (the analysis focus).","treatment":"Anastrozole 1 mg/d vs tamoxifen 20 mg/d × 5 yr","tx":["ET"],"endpoints":[["DFS (1°)","✅ HR+ 9-yr event rate 25.8% vs 29.9% — HR 0.85 (0.76–0.94), P=0.003"],["Time to recurrence","✅ HR 0.76 (0.67–0.87); 5-yr Δ2.8% → 9-yr Δ4.8% — gap widens"],["Carryover","✅ After treatment ends HR 0.75 (0.61–0.94), P=0.01"],["OS","❌ HR 0.97 (0.86–1.11), P=0.7 — ~40% of deaths non-breast-cancer"]],"takeaway":"5 yr of upfront anastrozole beats tamoxifen on DFS but not OS, with a real carryover effect after stopping. Early ET side effects at 3 months predicted lower recurrence in both arms.","url":"https://app.notion.com/3ce127970a6281ae85a8e6748dadc058"},{"db":"early","name":"ATLAS","year":2013,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":12894,"population":"Women already several years into tamoxifen, uncertain whether to stop. Age, HR/nodal status unrestricted. Main efficacy population ER+ (n=6,846).","treatment":"Extended tamoxifen — continue to 10 yr vs stop at 5 yr","tx":["ET"],"endpoints":[["Recurrence (1°)","✅ ER+ yr 5–14 cumulative 21.4% vs 25.1% — RR 0.84 (0.76–0.94), P=0.002"],["Time dependence","⭐ yr 5–9 RR 0.90 → yr ≥10 RR 0.75"],["BC mortality","✅ yr 5–14 12.2% vs 15.0% — P=0.01; yr ≥10 RR 0.71 (0.58–0.88)"],["All-cause mortality","✅ 639 vs 722 deaths, P=0.01"],["Harm","❌ Endometrial CA RR 1.74, PE RR 1.87 — no net excess non-BC mortality"]],"takeaway":"10 years of tamoxifen beats 5 on both recurrence and survival, and the benefit is strongly time-delayed — it roughly halves breast-cancer mortality in the second decade after diagnosis.","url":"https://app.notion.com/3cf127970a62817284f5d1fd560bbfac"},{"db":"early","name":"ATOMIC","year":2026,"phase":"III","cancer":"CRC","biomarker":"MSI-H / dMMR","setting":"Adjuvant","n":712,"population":"R0-resected stage III colon cancer (any T, N1–2, M0), dMMR/MSI-H, ECOG 0–2. 54% high-risk (T4, N2 or both).","treatment":"Atezolizumab + mFOLFOX6 vs mFOLFOX6 alone (6 months)","tx":["ICI"],"endpoints":[["DFS (1°)","✅ 3-yr 86.3% vs 76.2% — HR 0.50 (0.35–0.73), P<0.001"],["OS","⚠️ 5-yr 89.7% vs 87.9% — HR 0.90 (0.55–1.47), NS at first analysis"],["Safety","⚠️ More grade 3–4 AEs"]],"takeaway":"Adding atezolizumab to adjuvant FOLFOX halves recurrence risk in resected stage III dMMR colon cancer. OS not yet separated.","url":"https://app.notion.com/330127970a628014a1f3fc9bca5fa1e8"},{"db":"early","name":"AVANT","year":2012,"phase":"III","cancer":"CRC","biomarker":null,"setting":"Adjuvant","n":3451,"population":"Stage III or high-risk stage II colon cancer after resection.","treatment":"Adjuvant FOLFOX4 vs bevacizumab-FOLFOX4 vs bevacizumab-XELOX × 6 months","tx":["ChT"],"endpoints":[["3-yr DFS (1°)","❌ 76% vs 73% vs 75% — bev-FOLFOX HR 1.17 (0.98–1.39)"],["5-yr OS","❌ 85% vs 81% vs 82% — bev-FOLFOX HR 1.27 (1.03–1.57), P=0.02 (worse)"]],"takeaway":"Bevacizumab added to adjuvant chemo made outcomes worse, not better — a definitive negative trial. Not recommended.","url":"https://app.notion.com/316127970a6280a4a87dd513bb3875b1"},{"db":"early","name":"AZUR-2","year":null,"phase":"III (Ongoing)","cancer":"CRC","biomarker":null,"setting":"Neoadjuvant","n":null,"population":"Not yet reported.","treatment":"Perioperative dostarlimab","tx":["ICI"],"endpoints":[["Status","⏳ Ongoing — no results reported"]],"takeaway":"Ongoing phase III of perioperative dostarlimab in colorectal cancer. Watch this space.","url":"https://app.notion.com/33f127970a6280fab510c12046c333d2"},{"db":"early","name":"BCIRG-006","year":2011,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Adjuvant","n":3222,"population":"HER2+, node-positive or high-risk node-negative (T1–T3). ER/PR+ ≈54%.","treatment":"3 arms — AC-T (control) vs AC-T + trastuzumab vs TCH (non-anthracycline). Trastuzumab × 1 yr","tx":["ChT","Anti-HER2"],"endpoints":[["5-yr DFS (1°)","✅ AC-T+H 84% vs TCH 81% vs AC-T 75% — HR 0.64 (P<0.001) and 0.75 (P=0.04) vs AC-T"],["5-yr OS","✅ 92% vs 91% vs 87% — HR 0.63 and 0.77"],["Head-to-head","No significant difference between the two trastuzumab arms"]],"takeaway":"Adjuvant trastuzumab × 1 yr improves DFS and OS. The anthracycline-free TCH regimen matches it with less cardiotoxicity — a better risk–benefit profile.","url":"https://app.notion.com/38d127970a6281bf8f51d4120edc3630"},{"db":"early","name":"BIG 1-98","year":2005,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":8010,"population":"Postmenopausal ER+ after surgery. Median age 61, 57% node-positive, 25% prior chemo, 39% prior HRT.","treatment":"Letrozole 2.5 mg/d vs tamoxifen 20 mg/d × 5 yr (4-arm design incl. sequences; core analysis pools letrozole-initial vs tamoxifen-initial)","tx":["ET"],"endpoints":[["DFS (1°)","✅ 5-yr 84.0% vs 81.4% — HR 0.81 (0.70–0.93), P=0.003; node+ 77.9% vs 71.4%"],["Distant recurrence","✅ HR 0.73 (0.60–0.88), P=0.001 — the standout result"],["OS","❌ 166 vs 192 deaths — NS (median FU only 25.8 mo)"]],"takeaway":"5 yr of upfront letrozole beats tamoxifen on DFS, driven mainly by fewer distant recurrences. Note the subgroup pattern is the opposite of ATAC — benefit was greatest in node-positive, chemo-treated women.","url":"https://app.notion.com/3cf127970a62814ebd6cc03b8e94b3b3"},{"db":"early","name":"Cercek et al (dostarlimab rectal)","year":2022,"phase":"II","cancer":"CRC","biomarker":"MSI-H / dMMR","setting":"Neoadjuvant","n":14,"population":"dMMR locally advanced rectal cancer — stage II 1/14, stage III 13/14. Lynch syndrome 57%.","treatment":"Dostarlimab (anti–PD-1) Q3W × 6 months","tx":["ICI"],"endpoints":[["Clinical CR (1°)","✅ 100% — no patient required surgery"]],"takeaway":"Every single dMMR rectal cancer patient achieved a clinical complete response on PD-1 blockade alone. Surgery and radiation can be omitted entirely under watch-and-wait — a landmark, if tiny, result.","url":"https://app.notion.com/311127970a6280518965cea94a14d52c"},{"db":"early","name":"CLASSIC","year":2012,"phase":"III","cancer":"GC","biomarker":null,"setting":"Adjuvant","n":1035,"population":"South Korea/China/Taiwan, stage II–IIIB, after R0 + D2 resection.","treatment":"CAPOX (capecitabine + oxaliplatin) vs surgery alone","tx":["ChT"],"endpoints":[["DFS (1°)","✅ 3-yr 74% vs 59%; 5-yr 68% vs 53% — HR 0.56 (0.44–0.72), P<0.0001"],["OS","✅ 3-yr 83% vs 78%; 5-yr 78% vs 69% — HR 0.72 (0.52–1.00), P=0.049"]],"takeaway":"Adjuvant CAPOX after D2 resection improves DFS and OS — and unlike S-1 alone, the benefit holds up in advanced stage and node-positive disease.","url":"https://app.notion.com/2a3127970a6280f888b6ee6585e17275"},{"db":"early","name":"CheckMate-274","year":2021,"phase":"III","cancer":"UC","biomarker":null,"setting":"Adjuvant","n":709,"population":"Muscle-invasive urothelial carcinoma — pT2–T4 after neoadjuvant chemo, or pT3–T4 without.","treatment":"Nivolumab vs placebo","tx":["ICI"],"endpoints":[["DFS (1°)","✅ 1-yr 62.8% vs 46.6% — HR 0.70 (0.55–0.90), P<0.001"],["DFS PD-L1+","✅ HR 0.55 (0.35–0.85)"],["OS","✅ 69.5 vs 50.1 mo — HR 0.76 (0.61–0.96)"]],"takeaway":"First FDA-approved adjuvant ICI in MIBC. Benefit is richest in PD-L1-positive patients and those who had cisplatin-based neoadjuvant chemo.","url":"https://app.notion.com/2b7127970a62805fb6e7dd90af8d3a90"},{"db":"early","name":"CheckMate-577","year":2021,"phase":"III","cancer":"GC / Esophagus","biomarker":"PD-L1","setting":"Adjuvant","n":794,"population":"R0 stage II–III esophageal/GEJ cancer after neoadjuvant chemoradiation with residual disease (non-pCR). Adeno 71% / SCC 29%; ≥ypN1 58%; TC ≥1% only 16%.","treatment":"Nivolumab × 1 yr vs placebo (2:1), no crossover","tx":["ICI"],"endpoints":[["DFS (1°)","✅ 22.4 vs 11.0 mo — HR 0.69 (96.4% CI 0.56–0.86), P<0.001"],["By histology","✅ SCC 29.7 vs 11.0 mo (HR 0.61); adeno 19.4 vs 11.1 mo (HR 0.75)"],["DMFS","✅ 28.3 vs 17.6 mo — HR 0.74 (0.60–0.92)"],["OS","⚠️ 51.7 vs 35.3 mo — P=0.11, NS"]],"takeaway":"Adjuvant nivolumab doubles DFS and is now SOC — but only for patients with residual disease after CRT. Benefit is greatest in squamous histology; no OS signal yet.","url":"https://app.notion.com/3d7127970a62819ba842f4943c0dfd1f"},{"db":"early","name":"CheckMate-77T","year":2024,"phase":"III","cancer":"Lung","biomarker":null,"setting":"Peri-OP","n":461,"population":"Resectable stage IIA (>4 cm)–IIIB NSCLC (AJCC 8th), no EGFR/ALK alteration, ECOG 0–1.","treatment":"Perioperative nivolumab + chemo vs placebo + chemo; adjuvant nivolumab × 1 yr","tx":["ICI"],"endpoints":[["pCR","✅ 25.3% vs 4.7%"],["EFS (1°)","✅ mEFS NR vs 18.4 mo — HR 0.58 (97.36% CI 0.42–0.81), P<0.001; 1-yr 73% vs 59%"],["OS","⚠️ Immature"]],"takeaway":"Perioperative nivolumab improves EFS and pCR. Post-hoc analysis suggests the adjuvant phase specifically helps non-pCR and PD-L1-negative patients.","url":"https://app.notion.com/2ac127970a6280be847cde2773e38d5a"},{"db":"early","name":"CheckMate-816","year":2022,"phase":"III","cancer":"Lung","biomarker":null,"setting":"Neoadjuvant","n":358,"population":"Resectable stage IB–IIIA NSCLC (AJCC 7th), no EGFR/ALK alteration, ECOG 0–1.","treatment":"Neoadjuvant nivolumab + chemo vs chemo alone — no adjuvant nivolumab","tx":["ICI","ChT"],"endpoints":[["pCR","✅ 24.0% vs 2.2% — OR 13.94 (99% CI 3.49–55.75), P<0.001"],["EFS (1°)","✅ 31.6 vs 20.8 mo — HR 0.68 (0.51–0.91), P=0.005; 5-yr 49.2% vs 34.4%"],["OS","✅ NR vs 73.7 mo — HR 0.69 (0.49–0.97); 5-yr 65.4% vs 55.0%"]],"takeaway":"Neoadjuvant-only nivolumab + chemo improves both EFS and OS — the trial that shifted the paradigm from adjuvant to neoadjuvant ICI. OS benefit does not hold in PD-L1-negative patients.","url":"https://app.notion.com/2ac127970a6280e0a568f12a814c22c1"},{"db":"early","name":"CONTINUUM","year":2024,"phase":"III","cancer":"NPC","biomarker":null,"setting":"Peri-OP","n":425,"population":"Newly diagnosed non-metastatic high-risk locoregionally advanced NPC, stage III–IVa (AJCC 8th), excluding T3–4N0 and T3N1. Age 18–65. Definitive chemoradiation, non-surgical.","treatment":"Sintilimab + GP induction → cisplatin CCRT vs GP induction → CCRT alone","tx":["ICI","ChT","RT"],"endpoints":[["EFS (1°)","✅ 3-yr 86% vs 76% — HR 0.59 (0.38–0.92), P=0.019"],["OS","❌ Not reached, no difference at 41.9-mo median FU"],["Safety","⚠️ Grade 3–4 AEs ~9 points higher"]],"takeaway":"First phase III showing PD-1 blockade across induction, concurrent and adjuvant phases improves EFS in high-risk LANPC (~10% absolute gain at 3 yr). No OS benefit yet — plausibly because 64% of controls got PD-1 blockade after progression.","url":"https://app.notion.com/3d9127970a62814ea72ad61a1bd348e9"},{"db":"early","name":"CTNeoBC (pooled analysis)","year":2014,"phase":"Meta / Retro","cancer":"Breast","biomarker":null,"setting":"Neoadjuvant","n":11955,"population":"Pooled 12 neoadjuvant trials of high-risk EBC. T2 61%, cN+ 46%, HR+ 83%, HER2+ 17%, TNBC 30%.","treatment":"Anthracycline- and taxane-based neoadjuvant chemo ± trastuzumab","tx":["ChT"],"endpoints":[["pCR rates","ypT0/is ypN0 ~18%. TNBC 33.6%; HER2+/HR− + trastuzumab 50.3%; HR+/HER2− G1-2 7.5%"],["EFS by pCR","HR 0.48 (0.43–0.54); best in TNBC HR 0.24 and HER2+/HR− HR 0.15"],["OS by pCR","HR 0.36 (0.31–0.42); TNBC HR 0.16; HER2+/HR− HR 0.08"],["Surrogacy","❌ Trial-level R² = 0.03 (EFS), 0.24 (OS) — pCR NOT a validated trial-level surrogate"]],"takeaway":"pCR strongly predicts an individual patient's outcome — especially in TNBC and HER2+/HR− — but fails as a trial-level surrogate. This analysis fixed the pCR definition as ypT0/is ypN0 and underpinned FDA's 2014 accelerated-approval guidance.","url":"https://app.notion.com/387127970a628106b016e43096882921"},{"db":"early","name":"DeCIDE","year":2014,"phase":"III","cancer":"HEENT","biomarker":null,"setting":"Neoadjuvant","n":285,"population":"N2 or N3 non-metastatic SCCHN, treatment-naive, KPS ≥70. Oropharynx 58%, stage IVa 86%, N3 11%, T3–T4 45%.","treatment":"Induction TPF ×2 → DFHX chemoradiation vs DFHX chemoradiation alone","tx":["ChT","RT"],"endpoints":[["OS (1°)","❌ HR 0.91 (0.59–1.41), P=0.68; deaths 28% vs 31%"],["RFS","⚠️ HR 0.76 (0.51–1.12), P=0.16"],["Distant failure","✅ Distant recurrence without prior locoregional failure P=0.043 (nominal)"],["Toxicity","⚠️ SAE 47% vs 28%, plus 4 toxic deaths during induction"]],"takeaway":"Induction TPF added nothing on top of an effective chemoradiation backbone. The only signal — fewer isolated distant recurrences — is hypothesis-generating. The trial was underpowered (280 vs 400 planned, 56% power).","url":"https://app.notion.com/3da127970a6281a3b35af8517adefe25"},{"db":"early","name":"DESTINY-Breast05","year":2025,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Adjuvant","n":1635,"population":"HER2+ EBC with residual disease (non-pCR in breast or nodes) after neoadjuvant taxane + anti-HER2. Inoperable at baseline 50%, node-positive 80%, dual anti-HER2 70%.","treatment":"Adjuvant T-DXd vs T-DM1 for residual disease","tx":["ADC","Anti-HER2"],"endpoints":[["iDFS (1°)","✅ 3-yr 92.4% vs 83.7% — HR 0.47 (0.34–0.66), P<0.001"],["DFS","✅ 3-yr 92.3% vs 83.5% — HR 0.47 (0.34–0.66)"],["OS","⚠️ 3-yr 97.4% vs 95.7% — HR 0.61 (0.34–1.10), immature"]],"takeaway":"T-DXd clearly outperforms T-DM1 for residual HER2+ disease after neoadjuvant therapy, including HER2 2+/ISH+. Watch for ILD.","url":"https://app.notion.com/391127970a62813bb7dbec7b341b05ad"},{"db":"early","name":"DESTINY-Breast11","year":2025,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Neoadjuvant","n":927,"population":"High-risk HER2+ early breast cancer (≥cT3 cN0, or cT0–4 cN1–3), ECOG 0–1. HR-negative capped at 30%.","treatment":"Neoadjuvant T-DXd ×4 → THP ×4 vs ddAC ×4 → THP ×4 (T-DXd ×8 monotherapy arm closed early)","tx":["ADC","Anti-HER2","ChT"],"endpoints":[["pCR (1°)","✅ 67.3% vs 56.3% (Δ+11.2%, P=0.003); HR− 83.1% vs 67.1%; HR+ 61.4% vs 52.3%"],["EFS","⚠️ HR 0.56 (0.26–1.17), immature"]],"takeaway":"First phase III to establish an anthracycline- and carboplatin-free neoadjuvant regimen in high-risk HER2+ disease, with an 11-point pCR gain. EFS still immature.","url":"https://app.notion.com/38d127970a62810a837bfcb62e2ba3a6"},{"db":"early","name":"DIPPER","year":2025,"phase":"III","cancer":"NPC","biomarker":null,"setting":"Adjuvant","n":450,"population":"T4N1M0 or T1–4N2–3M0 NPC (AJCC 8th) who completed GP induction + cisplatin CCRT. Age 18–65, ECOG 0–1, randomised within 2 wk of last radiation dose.","treatment":"Adjuvant camrelizumab 200 mg q3w × 12 cycles vs observation","tx":["ICI","RT","ChT"],"endpoints":[["EFS (1°)","✅ 3-yr 86.9% vs 77.3% (Δ9.6%) — HR 0.56 (0.36–0.89), P=0.01"],["OS","⚠️ 3-yr 96.4% vs 92.9% — HR 0.80 (0.35–1.82), P=0.59, NS"]],"takeaway":"Adjuvant-only PD-1 blockade after definitive IC-CCRT buys the same ~10% EFS gain as CONTINUUM with markedly less toxicity and no QoL hit. Supports adjuvant sequencing as the lower-toxicity way to deliver ICI in high-risk LANPC.","url":"https://app.notion.com/3d9127970a628145875bf52a562de24a"},{"db":"early","name":"ExteNET","year":2016,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Adjuvant","n":2840,"population":"HER2+ stage 1–3 (amended to stage 2–3) who completed neo/adjuvant trastuzumab ≤1 yr earlier.","treatment":"Neratinib × 1 yr maintenance vs placebo","tx":["TKI","Anti-HER2"],"endpoints":[["iDFS (1°)","✅ 5-yr 90.2% vs 87.7% — HR 0.73 (0.57–0.92), P=0.008"],["iDFS HR+/≤1 yr","✅ 90.8% vs 85.7% — HR 0.58 (0.41–0.82)"],["OS","⚠️ 8-yr HR+/≤1 yr 91.5% vs 89.4% — HR 0.79 (0.55–1.13), immature"]],"takeaway":"A year of maintenance neratinib improves iDFS, with benefit concentrated in HR+ disease. Severe diarrhoea is the limiting toxicity.","url":"https://app.notion.com/390127970a62813c9d51d313706a751a"},{"db":"early","name":"FLOT4","year":2019,"phase":"II/III","cancer":"GC","biomarker":null,"setting":"Peri-OP","n":716,"population":"German, ECOG 0–1, gastric/GEJ adenocarcinoma stage ≥cT2 or node-positive.","treatment":"FLOT ×4 pre + ×4 post vs ECF/ECX ×3 pre + ×3 post","tx":["ChT"],"endpoints":[["pCR","✅ 15.6% vs 5.8%"],["DFS","✅ 30 vs 18 mo — HR 0.75 (0.62–0.91), P=0.004"],["OS (1°)","✅ 50 vs 35 mo — HR 0.77 (0.63–0.94), P=0.012"]],"takeaway":"FLOT beats ECF/ECX on every axis — OS, DFS, R0 rate and pCR. The perioperative standard for gastric/GEJ adenocarcinoma.","url":"https://app.notion.com/2a5127970a62801e88addf58b4599b79"},{"db":"early","name":"FNCLCC-FFCD","year":2011,"phase":"III","cancer":"GC","biomarker":null,"setting":"Peri-OP","n":224,"population":"French, ECOG 0–1, all stages except CIS. Predominantly GEJ tumours. R0 rate 84% (chemo) vs 74% (surgery alone).","treatment":"Cisplatin/5-FU ×3 pre + ×4 post vs surgery alone","tx":["ChT"],"endpoints":[["pCR","3%"],["DFS","✅ 5-yr 34% vs 19% — HR 0.65 (0.48–0.89), P=0.003"],["OS","✅ 5-yr 38% vs 24% — HR 0.69 (0.50–0.95), P=0.02"]],"takeaway":"Perioperative cisplatin/5-FU improves survival even in a GEJ-heavy population — a European companion to MAGIC.","url":"https://app.notion.com/2a5127970a62807d8734ca9c4ba54cee"},{"db":"early","name":"FOxTROT","year":2023,"phase":"III","cancer":"CRC","biomarker":"MSI-H / dMMR","setting":"Neoadjuvant","n":1053,"population":"CT-staged T3–4, N0–2 colon cancer with extramural extension ≥5 mm (≥1 mm after pilot). Median age 63; cT4 25%; cN+ 75%.","treatment":"6 wk neoadjuvant mFOLFOX/CAPOX → surgery → 18 wk adjuvant chemo, vs 24 wk adjuvant chemo (2:1) ± panitumumab in RAS-wt","tx":["ChT"],"endpoints":[["2-yr residual/recurrent dz (1°)","✅ 16.9% vs 21.5% — RR 0.72 (0.54–0.98), P=0.037"],["By MMR","✅ pMMR RR 0.69 (0.50–0.97); ❌ dMMR RR 0.86 (0.42–1.76)"],["Regression","Complete 4% vs 0%; any regression 66% vs 18%; R0 94% vs 89%"],["Mortality","❌ Colon-cancer death RR 0.74, all-cause RR 0.76 — both NS"],["Panitumumab","❌ RR 0.67 (0.36–1.23), P=0.19"]],"takeaway":"First phase III of neoadjuvant chemo in colon cancer — fewer 2-yr recurrences, more R0, more downstaging. dMMR tumours get nothing from it (they need immunotherapy instead).","url":"https://app.notion.com/3d4127970a6281d28475e61fd6d3a0fc"},{"db":"early","name":"GEICAM/2006-03","year":2012,"phase":"II","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Neoadjuvant","n":95,"population":"Operable luminal breast cancer (ER+/PR+/HER2−). Premenopausal ~53%, T2 ~74%, N0 55%, Ki67 ≤10% in 42%.","treatment":"Neoadjuvant chemo (EC ×4 → docetaxel ×4) vs endocrine therapy (exemestane ± goserelin) × 24 wk","tx":["ChT","ET"],"endpoints":[["pCR","~2% (1 patient) vs 0 — near-zero in both arms"],["Response by Ki67","High Ki67 >10%: 67% (ChT) vs 42% (ET); Low Ki67: 63% vs 58% — comparable"]],"takeaway":"In luminal early breast cancer, chemo only outperforms endocrine therapy when Ki67 is high. Low-Ki67 (luminal A) tumours respond equally to ET and may safely skip chemo.","url":"https://app.notion.com/396127970a62810a9ad9c7e5a11fea02"},{"db":"early","name":"GORTEC 2007-02","year":2018,"phase":"III","cancer":"HEENT","biomarker":null,"setting":"Neoadjuvant","n":370,"population":"Non-metastatic, non-operated stage III–IV SCC of oral cavity/oro-hypopharynx/larynx with bulky nodal spread (N2b palpable, N2c or N3). Age 18–80, ECOG 0–1. T4 49%, oropharynx 64%, p16-negative 74% of tested OPC, smokers 90%.","treatment":"Induction TPF ×3 → cetuximab-RT vs concurrent carboplatin/5-FU + RT","tx":["ChT","RT","Others"],"endpoints":[["PFS (1°)","❌ NOT MET — 2-yr 36% vs 38%; HR 0.93 (0.73–1.20), P=0.58"],["Locoregional control","↔ HR 0.98, P=0.90"],["OS","⚠️ HR 1.12 (0.86–1.46), P=0.39 — numerically favours chemoRT"],["Distant mets","✅ First event HR 0.54 (0.30–0.99), P=0.05"],["Toxicity","⚠️ 6.6% TPF-related mortality, 17% febrile neutropenia"]],"takeaway":"Induction TPF → cetuximab-RT failed on PFS, locoregional control and OS. The only reproducible signal is fewer distant metastases (echoing DeCIDE and MACH-NC). 17% of the induction arm never received curative RT — induction can forfeit the treatment that cures.","url":"https://app.notion.com/3da127970a6281659e2cff9738d8dbe5"},{"db":"early","name":"HERA","year":2005,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Adjuvant","n":5102,"population":"HER2+ EBC after surgery + ≥4 cycles (neo)adjuvant chemo ± RT; node-positive (any) or node-negative if >1 cm.","treatment":"Adjuvant trastuzumab 1 yr vs 2 yr vs observation","tx":["Anti-HER2"],"endpoints":[["DFS (1°)","✅ 10-yr 69% vs 63% — HR 0.76 (0.68–0.86), P<0.0001"],["OS","✅ 12-yr 79% vs 73% — HR 0.74 (0.64–0.86)"],["2 yr vs 1 yr","❌ HR 1.02 (0.89–1.17) — no added benefit, more cardiotoxicity"]],"takeaway":"Established 1 year of adjuvant trastuzumab as the standard. Doubling to 2 years adds only cardiotoxicity.","url":"https://app.notion.com/390127970a62813aafe7c22289a77d65"},{"db":"early","name":"IDEAL","year":2018,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":1824,"population":"Postmenopausal who completed 5 yr of any adjuvant ET — but ~88% had prior AI exposure (unlike MA.17). pN1 47.5%, 68% prior chemo.","treatment":"Extended letrozole 2.5 yr vs 5 yr (open-label, up-front randomisation)","tx":["ET"],"endpoints":[["DFS (1°)","❌ NO DIFFERENCE — events 16.6% (5 yr) vs 18.0% (2.5 yr); HR 0.92 (0.74–1.16), P=0.49"],["DMFi","❌ HR 1.06 (0.78–1.45), P=0.71"],["OS","❌ 104 vs 96 deaths — HR 1.04 (0.78–1.38), numerically favours shorter arm"],["2nd primary breast CA","✅ 1.1% vs 3.1% — HR 0.39 (0.19–0.81), P=0.01"]],"takeaway":"5 extra yr of letrozole is no better than 2.5 — except for preventing second primary breast cancers. Caveats: open-label, ~30% attrition before the arms diverge, and only 60% total compliance.","url":"https://app.notion.com/3cf127970a6281c18c1ce3243073b344"},{"db":"early","name":"IES","year":2017,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":4724,"population":"Postmenopausal, disease-free after 2–3 yr of adjuvant tamoxifen (median 2.4 yr). Mean age 64, 44% node-positive, 33% prior chemo.","treatment":"Switch strategy — switch to exemestane vs continue tamoxifen, to 5 yr total ET","tx":["ET"],"endpoints":[["DFS (1°)","✅ Initial 3-yr 91.5% vs 86.8% — HR 0.68 (0.56–0.82); final HR 0.85 (0.76–0.94), P=0.002"],["BCFS (final 1°)","✅ 22.1% vs 26.2% events — HR 0.81 (0.72–0.92), P<0.001"],["Distant recurrence","✅ TTDR HR 0.84 (0.74–0.96) — gap entirely in bone sites; non-bone identical"],["Carryover","⚠️ TTDR after 2.5 yr HR 0.94 (0.80–1.10) — no carryover effect"],["OS","⚠️ HR 0.89 (0.78–1.01), P=0.08, never formally significant"]],"takeaway":"After 2–3 years of tamoxifen, switching to exemestane beats completing 5 years of tamoxifen on DFS but not OS. Unlike ATAC, there is no carryover once treatment stops.","url":"https://app.notion.com/3cf127970a62812bbfeacae4ecc6257d"},{"db":"early","name":"IMpassion031","year":2020,"phase":"III","cancer":"Breast","biomarker":"PD-L1","setting":"Neoadjuvant","n":333,"population":"Untreated stage II–III TNBC; cT2–T4, cN0–N3, centrally confirmed triple-negative. PD-L1 unselected (SP142 IC ≥1% = positive, 46% positive). ECOG 0–1, node+ 38%, median age 51.","treatment":"Neoadjuvant atezolizumab + nab-paclitaxel → AC vs placebo + chemo; atezolizumab arm continued adjuvant atezo ×11","tx":["ICI"],"endpoints":[["pCR ITT (co-1°)","✅ 58% vs 41% (Δ17%), P=0.0044 — boundary crossed"],["pCR PD-L1+ (co-1°)","⚠️ 69% vs 49% (Δ20%), P=0.021 — boundary α=0.0184 NOT crossed"],["pCR PD-L1−","48% vs 34% (Δ13%) — benefit regardless of PD-L1"],["EFS / DFS / OS","⚠️ HR 0.76 / 0.74 / 0.69 — all immature and underpowered"]],"takeaway":"Atezolizumab raises pCR in early TNBC regardless of PD-L1 status — but the PD-L1+ co-primary formally missed, and the time-to-event endpoints were never mature, so it never became practice-changing the way KEYNOTE-522 did. The anthracycline backbone may matter: AC-free NeoTRIPaPDL1 was negative.","url":"https://app.notion.com/3d8127970a6281639001eac2b7af6fe2"},{"db":"early","name":"IMpower010","year":2021,"phase":"III","cancer":"Lung","biomarker":"PD-L1","setting":"Adjuvant","n":1005,"population":"Completely resected NSCLC, stage IB (≥4 cm)–IIIA (AJCC 7th), ECOG 0–1, after 1–4 cycles adjuvant platinum chemo.","treatment":"Atezolizumab ×16 cycles (~1 yr) vs best supportive care; no crossover","tx":["ICI"],"endpoints":[["DFS stage II–IIIA PD-L1 ≥1%","✅ NR vs 35.3 mo — HR 0.66 (0.50–0.88)"],["DFS stage II–IIIA all","✅ 42.3 vs 35.3 mo — HR 0.79 (0.64–0.96)"],["DFS ITT","⚠️ HR 0.81 (0.67–0.99) — not significant at ≥5 yr"],["PD-L1 ≥50%","✅ DFS HR 0.48 (0.32–0.72); OS HR 0.47 (0.28–0.77)"],["OS ITT","❌ HR 0.97 (0.78–1.22)"]],"takeaway":"Benefit is concentrated in stage II–IIIA with high PD-L1 (TC ≥50%, especially EGFR/ALK wild-type). ITT DFS never reached significance → FDA approval limited to stage II–IIIA, PD-L1 ≥1%.","url":"https://app.notion.com/2ac127970a6280ae8c9de1d4567c1ca9"},{"db":"early","name":"IMvoke010","year":2025,"phase":"III","cancer":"HEENT","biomarker":"PD-L1","setting":"Adjuvant","n":406,"population":"High-risk locally advanced SCCHN with no progression after definitive therapy. Stage IVa/IVb p16− or stage III p16+ (18%). Required ≥2 treatment modalities; CR to prior therapy 84%; no primary surgery 62%; PD-L1 TAP ≥5% ~80%.","treatment":"Adjuvant atezolizumab 1200 mg q3w × 1 yr vs placebo after definitive therapy; no crossover","tx":["ICI"],"endpoints":[["EFS (1°)","❌ NOT MET — 59.5 vs 52.7 mo; HR 0.94 (0.70–1.26), P=0.68"],["EFS by BICR","❌ HR 0.98 (0.73–1.32)"],["OS","❌ HR 0.96 (0.68–1.36); 36-mo curves actually cross"]],"takeaway":"Adjuvant atezolizumab after definitive therapy failed on EFS and OS. Only PD-L1 TAP ≥5% showed a numerical trend; a longer interval between RT and ICI may matter.","url":"https://app.notion.com/3da127970a62816699c0f84c8b18b3cd"},{"db":"early","name":"INT-0116 (Macdonald)","year":2001,"phase":"III","cancer":"GC","biomarker":null,"setting":"Adjuvant","n":559,"population":"Predominantly Caucasian, ECOG 0–2, stage ≥IB/M0 after resection. Only 10% had a D2 lymphadenectomy.","treatment":"5-FU/leucovorin + radiotherapy vs surgery alone","tx":["ChT","RT"],"endpoints":[["RFS (1°)","✅ 30 vs 19 mo — HR 1.51 (1.25–1.83), P<0.001"],["OS","✅ 36 vs 27 mo — HR 1.32 (1.10–1.60), P=0.005"]],"takeaway":"The first trial proving adjuvant therapy helps in gastric cancer — but because D2 dissection was rare, adjuvant chemoradiation is best read as compensating for inadequate surgery. Consider RT when the resection was not D2.","url":"https://app.notion.com/2a3127970a628056aa00e4afbe8996f8"},{"db":"early","name":"JACCRO GC-07","year":2019,"phase":"III","cancer":"GC","biomarker":null,"setting":"Adjuvant","n":915,"population":"Japanese, ECOG 0–1, stage IIIA/IIIB/IIIC after R0 + D2 resection.","treatment":"Docetaxel + S-1 (DS-1) vs S-1 alone","tx":["ChT"],"endpoints":[["RFS (1°)","✅ 3-yr 67.7% vs 57.4%; 5-yr 59.8% vs 50.6% — HR 0.73 (0.60–0.88), P=0.001"],["OS","✅ 3-yr 77.7% vs 71.2%; 5-yr 67.9% vs 60.3% — HR 0.75 (0.61–0.92), P=0.006"]],"takeaway":"Adding docetaxel to S-1 improves RFS and OS in stage III gastric cancer at the cost of more toxicity. Oddly, stage IIIB alone showed no survival benefit.","url":"https://app.notion.com/2a4127970a628065a54ed86a00fe9a9b"},{"db":"early","name":"KATHERINE","year":2019,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Adjuvant","n":1486,"population":"HER2+ EBC with residual disease (non-pCR) after neoadjuvant taxane + trastuzumab. Inoperable at baseline 20%, node-positive 45%, dual anti-HER2 only 20%.","treatment":"Adjuvant T-DM1 vs trastuzumab for residual disease","tx":["ADC","Anti-HER2"],"endpoints":[["iDFS (1°)","✅ 3-yr 88.3% vs 77.0%; 7-yr 80.8% vs 67.1% — HR 0.54 (0.44–0.66)"],["OS","✅ 7-yr 89.1% vs 84.4% (Δ4.7 pp) — HR 0.66 (0.51–0.87), P=0.003, crossed the boundary"],["By IHC","IHC3+ HR 0.47 (0.37–0.60); IHC2+ HR 0.84 (0.56–1.25)"]],"takeaway":"Escalating to T-DM1 for residual HER2+ disease improves both iDFS and OS — the trial that made post-neoadjuvant escalation standard of care.","url":"https://app.notion.com/391127970a6281718965d788226def2c"},{"db":"early","name":"KEYNOTE-412","year":2024,"phase":"III","cancer":"HEENT","biomarker":"PD-L1","setting":"Peri-OP","n":804,"population":"High-risk UNRESECTED locally advanced HNSCC requiring definitive chemoradiation. p16+ 26%, stage IV 66%, T3–T4 83–86%, CPS ≥1 ~85%, CPS ≥20 ~36%.","treatment":"Pembrolizumab priming → pembrolizumab + cisplatin CCRT → adjuvant pembrolizumab ×14 vs placebo + CCRT","tx":["ICI","RT"],"endpoints":[["EFS (1°)","❌ NOT MET — HR 0.83 (0.68–1.03), P=0.043 vs threshold P≤0.024; 24-mo 63% vs 56%"],["EFS CPS ≥1","⚠️ HR 0.80 (0.64–1.00)"],["OS","❌ 36-mo 72% vs 70% — HR 0.90 (0.71–1.15)"],["DMFS","⚠️ HR 0.84 (0.67–1.05)"]],"takeaway":"The third negative trial of concurrent ICI plus (chemo)radiation — failed both EFS and OS. CPS ≥1 came closest. Contrast with KEYNOTE-689, where the neoadjuvant sequence worked.","url":"https://app.notion.com/3da127970a628114bc90d505515e6084"},{"db":"early","name":"KEYNOTE-522","year":2026,"phase":"III","cancer":"Breast","biomarker":"PD-L1","setting":"Peri-OP","n":1174,"population":"Untreated, non-metastatic, centrally confirmed TNBC; T1c N1–2 or T2–4 N0–2 = stage II–III. PD-L1 unselected (CPS ≥1 in 83%). ECOG 0–1, node+ 52%, stage III 25%.","treatment":"Perioperative pembrolizumab + chemo (paclitaxel/carbo ×4 → AC/EC ×4) → adjuvant pembrolizumab ×9 vs placebo + chemo","tx":["ICI","ChT"],"endpoints":[["pCR (co-1°)","✅ 64.8% vs 51.2% (Δ13.6 pp), P<0.001. PD-L1+ 68.9% vs 54.9%; PD-L1− 45.3% vs 30.3%"],["EFS (co-1°)","✅ 7-yr 78.3% vs 69.8% — HR 0.68 (0.54–0.86)"],["OS","✅ 7-yr 85.1% vs 77.2% — HR 0.64 (0.49–0.85); 5-yr P=0.002"],["Non-proportionality","Piecewise HR 0.87 <2 yr → 0.51 ≥2 yr — curves separate late"],["Toxicity","⚠️ Immune AEs 35% vs 13%, some irreversible (endocrinopathy)"]],"takeaway":"The first and only ICI regimen in early TNBC to improve pCR, EFS and OS — practice-defining SOC. Benefit holds regardless of PD-L1 CPS, unlike metastatic TNBC. The OS gain exceeds what the pCR gain alone would predict.","url":"https://app.notion.com/3d8127970a6281699c2bed39b7947074"},{"db":"early","name":"KEYNOTE-671","year":2024,"phase":"III","cancer":"Lung","biomarker":null,"setting":"Peri-OP","n":797,"population":"Resectable stage II–IIIB (N2) NSCLC (AJCC 8th), molecularly unselected, ECOG 0–1.","treatment":"Perioperative pembrolizumab + cisplatin-based chemo vs placebo + chemo; adjuvant pembrolizumab × 1 yr","tx":["ICI"],"endpoints":[["pCR","✅ 18.1% vs 4.0% (Δ14.2%)"],["EFS (1°)","✅ 47.2 vs 18.3 mo — HR 0.58 (0.46–0.72); 3-yr 54.3% vs 35.4%"],["OS","✅ NR vs 52.4 mo — HR 0.72 (0.56–0.93); 3-yr 71% vs 64%"]],"takeaway":"First perioperative ICI + chemo regimen in NSCLC to show both EFS and OS benefit → FDA approved. pCR and major pathologic response predict survival; TPS <1% benefits less.","url":"https://app.notion.com/376127970a628074bc5cd55bea90d84e"},{"db":"early","name":"KEYNOTE-689","year":2025,"phase":"III","cancer":"HEENT","biomarker":"PD-L1","setting":"Peri-OP","n":714,"population":"RESECTABLE locally advanced HNSCC (p16+ stage III, others stage III–IVA). Oral cavity 60%, HPV− ~95%, CPS ≥10 ~65%, CPS ≥1 ~95%.","treatment":"Pembrolizumab ×2 → surgery → pembrolizumab ×3 with RT/CRT → pembrolizumab ×12 vs surgery → RT/CRT","tx":["ICI","RT"],"endpoints":[["EFS (1°, all 3 populations)","✅ CPS ≥10 59.7 vs 26.9 mo, HR 0.66 (0.49–0.88), P=0.004; CPS ≥1 HR 0.70, P=0.003; total HR 0.73, P=0.008"],["pCR / mPR","✅ pCR 4.3% vs 0%; mPR 13.7% vs 0% (CPS ≥10), all P<0.001 — none in CPS <1"],["OS","⚠️ 3-yr CPS ≥10 68.2% vs 59.2% — HR 0.72 (0.52–0.98), P=0.04 vs boundary 0.0104, not crossed"],["Surgery","Resection rate unaffected: 88.4% vs 87.7%"]],"takeaway":"First positive perioperative ICI trial in resectable LA-HNSCC — improves EFS without compromising surgery, driven by fewer distant recurrences. Pathological response is real but modest; OS not yet significant.","url":"https://app.notion.com/3da127970a62815790afe15205788b6d"},{"db":"early","name":"KEYNOTE-905 / EV-303","year":2025,"phase":"III","cancer":"UC","biomarker":null,"setting":"Peri-OP","n":344,"population":"Cisplatin-INELIGIBLE muscle-invasive bladder cancer, relatively advanced disease.","treatment":"Enfortumab vedotin + pembrolizumab (perioperative) vs surgery alone","tx":["ICI","ADC"],"endpoints":[["pCR","✅ 57.1% vs 8.6%"],["EFS (1°)","✅ NR vs 15.7 mo — HR 0.40 (0.28–0.57), P<0.0001"],["OS","✅ NR vs 41.7 mo — HR 0.50 (0.33–0.74), P=0.0002"]],"takeaway":"EV + pembrolizumab transforms outcomes in cisplatin-ineligible MIBC — pCR, EFS and OS all dramatically positive. Note the control arm received no chemotherapy at all, which flatters the comparison.","url":"https://app.notion.com/2b7127970a628018be38e257999f0647"},{"db":"early","name":"KRISTINE","year":2018,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Neoadjuvant","n":444,"population":"HER2+ stage II–III breast cancer (>2 cm), ECOG 0–1, LVEF ≥55%.","treatment":"Neoadjuvant T-DM1 + pertuzumab vs TCHP; adjuvant ×12 cycles of T-DM1+P vs HP","tx":["ADC","Anti-HER2"],"endpoints":[["pCR (1°)","❌ 44.4% vs 55.7% — Δ−11.3% (−20.5 to −2.0), P=0.016"],["EFS","❌ 3-yr 85.3% vs 94.2% — HR 2.61 (1.36–4.98)"],["iDFS","❌ 3-yr 93.0% vs 92.0% — HR 1.11 (0.52–2.40)"],["OS","❌ 3-yr 97.0% vs 97.6% — HR 1.21 (0.37–3.96)"]],"takeaway":"De-escalating to chemo-free T-DM1 + pertuzumab was worse than TCHP on pCR and markedly worse on EFS. TCHP remains the neoadjuvant standard.","url":"https://app.notion.com/38b127970a6281eb94e9d2c02b02842d"},{"db":"early","name":"Ludford et al (neoadjuvant pembrolizumab, dMMR)","year":2023,"phase":"II","cancer":"CRC","biomarker":"MSI-H / dMMR","setting":"Neoadjuvant","n":35,"population":"dMMR/MSI-H solid tumours — CRC 27 (colon 19, rectal 8), non-CRC 8. Stage II 8, stage III 26. Unresectable 26%. Lynch syndrome 46%.","treatment":"Pembrolizumab Q3W × 6 months","tx":["ICI"],"endpoints":[["ORR","✅ 82%"],["pCR","✅ 65% of all resected; 79% of resected CRC"],["Survival","Single-arm, follow-up too short"]],"takeaway":"Confirms the extraordinary sensitivity of dMMR tumours to PD-1 blockade beyond rectal cancer. Non-operative management (1 yr pembrolizumab + surveillance) was feasible; an early ctDNA drop predicted benefit.","url":"https://app.notion.com/311127970a62803fad0cfcdc0028b8df"},{"db":"early","name":"MA.17","year":2005,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":5187,"population":"Postmenopausal ER+ who completed 4.5–6 yr of adjuvant tamoxifen. Median age 62, 46% node-positive, 45% prior chemo.","treatment":"Extended letrozole 2.5 mg/d vs placebo × 5 yr after tamoxifen. Stopped early at first interim analysis (2.4 yr) for efficacy","tx":["ET"],"endpoints":[["DFS (1°)","✅ 4-yr 94.4% vs 89.8% (Δ4.6%) — HR 0.58 (0.45–0.76), P<0.001"],["Distant DFS","✅ HR 0.60 (0.43–0.84), P=0.002 — 40% reduction"],["OS","❌ HR 0.82 (0.57–1.19), P=0.3 overall"],["OS node+","✅ HR 0.61 (0.38–0.98), P=0.04"]],"takeaway":"Extended letrozole after 5 years of tamoxifen improves DFS, with an OS benefit confined to node-positive disease. Two caveats: the DFS definition excludes deaths, and crossover was allowed at 2.5 yr so the planned 5-year comparison never happened.","url":"https://app.notion.com/3cf127970a6281308ee8e3769e7dd164"},{"db":"early","name":"MA.17R","year":2016,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":1918,"population":"Postmenopausal, disease-free after 4.5–6 yr of any AI (preceded by tamoxifen in most). Median age 65, median 10.6 yr since diagnosis. T1–T2 90%, N0 47%/N1 48%.","treatment":"Extended letrozole × 5 further years vs placebo — AI following AI, out to 10 yr","tx":["ET"],"endpoints":[["DFS (1°)","✅ HR 0.66 (0.48–0.91), P=0.01"],["DFS counting all deaths","⚠️ HR 0.80 (0.63–1.01), P=0.06 — benefit largely evaporates"],["Contralateral breast CA","✅ 1.4% vs 3.2% — HR 0.42 (0.22–0.81), P=0.007, the most robust finding"],["OS","❌ Exactly 100 deaths in each arm — HR 0.97 (0.73–1.28), P=0.83"]],"takeaway":"10 years of AI beats 5 on DFS and contralateral breast cancer, with zero OS benefit and more cardiovascular deaths. The primary endpoint censors deaths — count them and the effect drops to borderline.","url":"https://app.notion.com/3cf127970a6281379039dc60172c662f"},{"db":"early","name":"MAGIC","year":2006,"phase":"III","cancer":"GC","biomarker":null,"setting":"Peri-OP","n":503,"population":"European, ECOG 0–1, stage ≥II gastric/GEJ. D2 in only ~30%, R0 ~70%.","treatment":"ECF ×3 pre + ×3 post vs surgery alone","tx":["ChT"],"endpoints":[["pCR","8%"],["PFS","✅ 5-yr 36% vs 24.6% — HR 0.66 (0.53–0.81), P<0.001"],["OS (1°)","✅ 5-yr 36.3% vs 23% — HR 0.75 (0.60–0.93), P=0.009"]],"takeaway":"The first perioperative chemotherapy trial in gastric cancer to show an OS benefit — established the perioperative paradigm later improved on by FLOT4.","url":"https://app.notion.com/2a5127970a628089aafcda9342829906"},{"db":"early","name":"MATTERHORN","year":2025,"phase":"III","cancer":"GC / Esophagus","biomarker":null,"setting":"Peri-OP","n":948,"population":"Global (Asian-enriched), ECOG 0–1, stage II/III/IVA gastric or GEJ adenocarcinoma (30% GEJ).","treatment":"Durvalumab + FLOT vs FLOT alone","tx":["ICI"],"endpoints":[["pCR","✅ 19.2% vs 7.2%"],["EFS (1°)","✅ 2-yr 67% vs 59%; NR vs 32.8 mo — HR 0.71 (0.58–0.86), P<0.001"],["OS","✅ 3-yr 68.8% vs 61.9% — HR 0.78 (0.63–0.96), P=0.021"]],"takeaway":"Perioperative durvalumab + FLOT improves pCR, EFS and OS — a new standard, though the Asian-enriched population raises questions about generalisability.","url":"https://app.notion.com/2ad127970a6280efa8e1f6fe375a4e00"},{"db":"early","name":"MINDACT","year":2016,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":6693,"population":"Women 18–70, initially node-negative then N1 allowed (79% N0, 21% N1). Median age 55; 88% HR+, 9.5% HER2+, 9.6% TNBC. The key group — high clinical/low genomic risk — was genuinely high-risk: 48% node+, 93% grade 2–3.","treatment":"MammaPrint 70-gene signature; chemo vs no chemo randomised only in the two discordant-risk groups","tx":["ChT","ET"],"endpoints":[["5-yr DMFS (1°)","✅ High clinical/low genomic, no chemo: 94.7% (95% CI 92.5–96.2) — lower bound >92%, non-inferiority met"],["DFS high-clin/low-gen","✅ 93.3% vs 90.3% — HR 0.64 (0.43–0.95), P=0.03 (the only nominally significant difference)"],["Low-clin/high-gen","⚠️ DMFS HR 1.17 (0.59–2.28) — chemo does not help"],["OS","⚠️ No significant difference in either discordant group"]],"takeaway":"Genomic testing spares chemotherapy in 46% of clinically high-risk women. But there is no point testing clinically low-risk patients — whatever the genomic score, they don't need chemo.","url":"https://app.notion.com/3ce127970a62813a86deea052f57b08a"},{"db":"early","name":"monarchE","year":2023,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":5637,"population":"HR+/HER2−, NODE-POSITIVE, high-risk EBC. Cohort 1 (91%): pN2, or pN1 with grade 3 or cT3. Cohort 2 (9%): pN1, grade 1–2, Ki-67 ≥20%. Median age 51, ~60% had ≥4 nodes, ~74% stage III, 95% prior chemo, 44% premenopausal. Node-negative excluded.","treatment":"Abemaciclib × 2 yr + endocrine therapy vs endocrine therapy alone","tx":["CDK4/6i"],"endpoints":[["iDFS (1°)","✅ 4-yr 85.8% vs 79.4% (Δ6.4%) — HR 0.664 (0.578–0.762), P<0.0001"],["Carryover","⭐ Benefit DEEPENS after the drug stops: Δ2.8% (2 yr) → 4.8% (3 yr) → 6.4% (4 yr)"],["DRFS","✅ HR 0.659 (0.567–0.767) — 71% of iDFS events were distant metastases"],["OS","✅ HR 0.84 (0.72–0.98), P=0.027 at 7 yr"],["Toxicity","❌ Diarrhoea"]],"takeaway":"The first CDK4/6 inhibitor to work in the adjuvant setting — cuts iDFS events by 34% in high-risk node-positive disease, and the benefit keeps widening after the 2 years of treatment end.","url":"https://app.notion.com/3d0127970a628132bec0f92bb81b28d9"},{"db":"early","name":"MOSAIC","year":2004,"phase":"III","cancer":"CRC","biomarker":null,"setting":"Adjuvant","n":2246,"population":"Resected stage II (40%) or stage III (60%) colon cancer. Rectal cancer excluded.","treatment":"Adjuvant FOLFOX4 vs 5-FU/leucovorin × 6 months","tx":["ChT"],"endpoints":[["DFS (1°)","✅ 3-yr 78.2% vs 72.9% — HR 0.77 (0.65–0.91), P=0.002"],["OS","⚠️ 3-yr 87.7% vs 86.6% — HR 0.90 (0.71–1.13), NS"]],"takeaway":"Established oxaliplatin in the adjuvant setting — DFS benefit concentrated in stage III; OS did not separate at 3 years.","url":"https://app.notion.com/316127970a62803e9febe18bc6e0543b"},{"db":"early","name":"NATALEE","year":2024,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":5101,"population":"HR+/HER2−, stage II or III — deliberately BROAD, and unlike monarchE it includes NODE-NEGATIVE disease. Median age 52; 59.6% stage III; 15.6% pN0; 88% prior chemo; 44% premenopausal.","treatment":"Ribociclib 400 mg/d × 3 yr + NSAI vs NSAI alone × 5 yr. All men and premenopausal women got OFS. Note 400 mg, not the 600 mg of MONALEESA — chosen to make 3 years tolerable","tx":["CDK4/6i"],"endpoints":[["iDFS (1°)","✅ 3-yr 90.7% vs 87.6% (Δ3.1%) — HR 0.749 (0.628–0.892), P=0.0012"],["RFS","✅ HR 0.727 (0.602–0.877), P=0.0008"],["DDFS","✅ HR 0.749 (0.623–0.900), P=0.002"],["By stage","✅ Stage II HR 0.700; stage III HR 0.755"],["Node-negative","⚠️ HR 0.723 (0.412–1.268) — right direction, only 51 events"],["OS","⚠️ 3-yr 97.0% vs 96.1% — HR 0.892 (0.661–1.203), immature"]],"takeaway":"Extends adjuvant CDK4/6 inhibition to a much broader population than monarchE — stage II–III including selected node-negative disease, which monarchE excluded entirely. Lower dose, longer duration.","url":"https://app.notion.com/3d0127970a6281dbb4f7f3209becc90a"},{"db":"early","name":"NEOADAURA","year":null,"phase":"—","cancer":"Lung","biomarker":"EGFR","setting":"Peri-OP","n":null,"population":"Not yet entered in your database.","treatment":"Neoadjuvant osimertinib (EGFR TKI)","tx":["TKI"],"endpoints":[["Status","📝 Row is a placeholder — no data captured yet"]],"takeaway":"Placeholder entry in your Notion DB — worth filling in with the neoadjuvant osimertinib results.","url":"https://app.notion.com/2ac127970a6280fd8e9bcac115f497c4"},{"db":"early","name":"NeoSphere","year":2012,"phase":"II","cancer":"Breast","biomarker":"HER2","setting":"Neoadjuvant","n":417,"population":"HER2+ breast cancer — operable (T2–3 N0–1), locally advanced, or inflammatory (T4d); primary tumour >2 cm. ER+ ~48%, operable ~61%.","treatment":"4 arms — A: trastuzumab + docetaxel; B: docetaxel + trastuzumab + pertuzumab (TPH); C: trastuzumab + pertuzumab (chemo-free); D: docetaxel + pertuzumab","tx":["Anti-HER2"],"endpoints":[["bpCR (1°)","✅ B 45.8% vs A 29.0%, P=0.014"],["tpCR","✅ B 39.3% vs A 21.5%, P=0.020. HR−: 63.2% vs 36.8%; HR+: 26.0% vs 20.0%"],["Chemo-free arm C","16.8% pCR on dual HER2 blockade alone"],["5-yr PFS","⚠️ A 81%, B 86%, C 73%, D 73% — HR 0.69 (0.34–1.40), descriptive only"]],"takeaway":"First trial establishing dual anti-HER2 blockade as the neoadjuvant standard. The chemo-free arm's 17% pCR was the first real signal that some HER2+ tumours might not need chemotherapy at all.","url":"https://app.notion.com/387127970a6281c1b707ee67293ae2e1"},{"db":"early","name":"NIAGARA","year":2024,"phase":"III","cancer":"UC","biomarker":null,"setting":"Peri-OP","n":1063,"population":"Cisplatin-ELIGIBLE muscle-invasive bladder cancer — relatively earlier disease than KEYNOTE-905.","treatment":"Durvalumab + gemcitabine/cisplatin → surgery → durvalumab vs gem/cis → observation","tx":["ICI","ChT"],"endpoints":[["pCR","⚠️ 33.8% vs 25.8% — OR 1.30 (1.09–1.56), P=0.004, modest"],["EFS (1°)","✅ 2-yr 67.8% vs 59.8% — HR 0.68 (0.56–0.82), P<0.001"],["OS","✅ 2-yr 82.2% vs 75.2% — HR 0.75 (0.59–0.93), P=0.01"]],"takeaway":"Perioperative durvalumab added to gem/cis improves EFS and OS in cisplatin-eligible MIBC. Note the disconnect: big EFS/OS gain but only a modest pCR bump. No OS benefit seen in Asian, T2N0 or PD-L1-high subgroups.","url":"https://app.notion.com/2b7127970a6280329272e2cda24a5620"},{"db":"early","name":"NICHE-2","year":2024,"phase":"II","cancer":"CRC","biomarker":"MSI-H / dMMR","setting":"Neoadjuvant","n":115,"population":"dMMR colon cancer, clinical stage I/II 12 pts, stage III 95 pts (89%). Lynch syndrome 32%.","treatment":"Nivolumab 3 mg/kg × 2 doses + ipilimumab 1 mg/kg × 1 dose","tx":["ICI"],"endpoints":[["Pathologic response (1°)","✅ Major pathologic response 95%; pCR 68% (Lynch 79% vs non-Lynch 61%)"],["Surgery","98% underwent timely surgery"],["DFS","✅ Zero recurrences at median 26-mo follow-up"]],"takeaway":"Just three doses of neoadjuvant dual checkpoint blockade produced a 95% major pathologic response and zero recurrences in dMMR colon cancer — without delaying surgery.","url":"https://app.notion.com/311127970a62804a827cec7ec04a0392"},{"db":"early","name":"NIVOPOST-OP","year":2026,"phase":"III","cancer":"HEENT","biomarker":"PD-L1","setting":"Adjuvant","n":680,"population":"High-risk R0-resected locally advanced HNSCC with ≥1 high-risk pathological feature: extranodal extension 63%, positive margin 58%, ≥4 involved nodes 13%, multifocal PNI 56%. Oral cavity 58%, p16+ only 5%, pIVa–IVb 83%.","treatment":"Nivolumab priming → cisplatin-RT + nivolumab ×3 → nivolumab ×6 vs cisplatin-RT alone","tx":["ICI","RT"],"endpoints":[["DFS (1°, investigator)","✅ MET — 3-yr 63.1% vs 52.5%; HR 0.76 (0.60–0.98), P=0.034"],["DFS by BICR","⚠️ NS — 3-yr 56.6% vs 53.1%; HR 0.89 (0.69–1.14)"],["Locoregional relapse","⭐ 3-yr 12.9% vs 19.8% — sHR 0.63 (0.42–0.94); the entire benefit"],["Distant relapse","↔ 12.6% vs 13.2% — sHR 0.95, no effect"],["OS","⚠️ Immature"]],"takeaway":"First positive adjuvant ICI trial in resected high-risk LA-SCCHN, driven entirely by reduced locoregional recurrence. Temper enthusiasm: blinded central review did not confirm the DFS benefit, OS is immature, and PD-L1 CPS was not predictive.","url":"https://app.notion.com/3da127970a6281e5b719db465d6d5e8a"},{"db":"early","name":"NO16968 (XELOXA)","year":2006,"phase":"III","cancer":"CRC","biomarker":null,"setting":"Adjuvant","n":1886,"population":"Resected stage III colon cancer.","treatment":"Adjuvant XELOX vs 5-FU/leucovorin × 6 months","tx":["ChT"],"endpoints":[["DFS (1°)","✅ 7-yr 63% vs 56% — HR 0.80 (0.69–0.93), P=0.004"],["OS","✅ 7-yr 73% vs 67% — HR 0.83 (0.70–0.99), P=0.04"]],"takeaway":"XELOX improves both DFS and OS in stage III colon cancer — the oral-fluoropyrimidine counterpart to MOSAIC, and it did reach OS significance.","url":"https://app.notion.com/316127970a6280aa9d08dc03796039e5"},{"db":"early","name":"NOAH","year":2010,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Neoadjuvant","n":235,"population":"HER2+ locally advanced breast cancer (T3N1, T4, or N2/N3/supraclavicular) or inflammatory. HR+ 36%, age ≥50 in 57%, N1/N2 85%.","treatment":"Perioperative trastuzumab + chemo ×10 → adjuvant trastuzumab ×7 (1 yr total) vs chemo alone","tx":["ChT","Anti-HER2"],"endpoints":[["bpCR","✅ 43% vs 22%, P=0.0007"],["tpCR","✅ 38% vs 19%, P=0.001"],["EFS (1°)","✅ 5-yr 58% vs 43% — HR 0.64 (0.44–0.93), P=0.016"],["OS","⚠️ 5-yr 74% vs 63% — HR 0.66 (0.43–1.01), P=0.055"],["BCSS","✅ 77% vs 64% — HR 0.59 (0.37–0.92), P=0.021"]],"takeaway":"First trial showing perioperative trastuzumab improves EFS and doubles pCR in locally advanced HER2+ disease. pCR predicts EFS benefit specifically in trastuzumab-treated patients.","url":"https://app.notion.com/387127970a62813f9992c8c4e05d9c76"},{"db":"early","name":"NSABP B-18","year":2001,"phase":"III","cancer":"Breast","biomarker":null,"setting":"Neoadjuvant","n":1523,"population":"Operable palpable breast cancer T1–3 N0–1, molecularly unselected. cN+ 26%, age <50 in 51%.","treatment":"Neoadjuvant AC ×4 → surgery vs surgery → adjuvant AC ×4","tx":["ChT"],"endpoints":[["pCR","13%"],["DFS (1°)","⚠️ 9-yr 55% vs 53% — RR 0.95 (0.88–1.10), P=0.50"],["OS","⚠️ 9-yr 69% vs 70% — RR 1.02 (0.84–1.21), P=0.80"],["pCR prognostic","9-yr OS 85% if pCR vs 73% if residual invasive disease"]],"takeaway":"Timing of chemotherapy doesn't matter for survival — neoadjuvant equals adjuvant. What it buys is more breast conservation, plus a prognostic readout: pCR predicts outcome. Laid the groundwork for FDA's 2014 pCR guidance.","url":"https://app.notion.com/386127970a6281d6852ded7f39f870e5"},{"db":"early","name":"NSABP B-27","year":2006,"phase":"III","cancer":"Breast","biomarker":null,"setting":"Neoadjuvant","n":2411,"population":"Operable breast cancer T1c–T3 N0–N1, molecularly unselected. cN+ 30%, age <50 in 57%. Tamoxifen given to all ≥50 regardless of ER.","treatment":"Neoadjuvant AC ×4 → surgery vs AC ×4 → docetaxel ×4 → surgery vs AC ×4 → surgery → adjuvant docetaxel ×4","tx":["ChT"],"endpoints":[["pCR (1°)","✅ Preop docetaxel 26.1% vs AC alone 13.7%, P<0.001; postop docetaxel 13.7%"],["DFS","⚠️ HR ~0.94, NS"],["OS","⚠️ NS across all arms"]],"takeaway":"Adding preoperative docetaxel doubled pCR and cut local recurrence — but never translated into DFS or OS benefit. The cleanest demonstration that pCR predicts individual outcome yet fails as a trial-level surrogate.","url":"https://app.notion.com/386127970a6281e7910bf28252710b5b"},{"db":"early","name":"NSABP B-31 / NCCTG N9831","year":2005,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Adjuvant","n":4046,"population":"HER2+ operable node-positive (both trials) or high-risk node-negative (N9831 only).","treatment":"AC ×4 → taxane vs AC ×4 → taxane + trastuzumab → trastuzumab alone, 1 year total","tx":["ChT","Anti-HER2"],"endpoints":[["DFS (1°)","✅ 10-yr 73.7% vs 62.2% — HR 0.60 (0.53–0.68), P<0.001; 2005 interim HR 0.48"],["OS","✅ 10-yr 84% vs 75.2% — HR 0.63 (0.54–0.73), P<0.001"]],"takeaway":"The landmark joint analysis that made adjuvant trastuzumab standard of care in HER2+ early breast cancer — a 40% reduction in recurrence and 37% in death.","url":"https://app.notion.com/38f127970a62819cb0f8ef93937def5e"},{"db":"early","name":"OlympiA","year":2022,"phase":"III","cancer":"Breast","biomarker":"BRCA1/2","setting":"Adjuvant","n":1836,"population":"Germline BRCA1/2 pathogenic variant, HER2-negative, high-risk EBC after local therapy + (neo)adjuvant chemo. TNBC 82%, HR+/HER2− 18%; BRCA1 72%/BRCA2 27%. Median age 42–43, ~61% premenopausal. Post-NACT entry required residual invasive disease — absence of pCR was an eligibility criterion, not an endpoint.","treatment":"Adjuvant olaparib 300 mg BID × 12 months vs placebo","tx":["PARPi"],"endpoints":[["iDFS (1°)","✅ 4-yr 82.7% vs 75.4% (Δ7.3 pp) — HR 0.58 (99.5% CI 0.41–0.82), P<0.001"],["DDFS","✅ 4-yr 86.5% vs 79.1% (Δ7.4 pp) — HR 0.57 (0.39–0.83)"],["OS","✅ 4-yr 89.8% vs 86.4% — HR 0.68 (98.5% CI 0.47–0.97), P=0.009 (boundary met at IA2)"],["Safety","✅ No excess MDS/AML (0.2% vs 0.3%)"]],"takeaway":"First PARP inhibitor to show a survival benefit in the curative setting. Benefit is consistent across BRCA1 vs BRCA2, TNBC vs HR+, and platinum exposure — and it makes germline BRCA testing mandatory in high-risk early breast cancer.","url":"https://app.notion.com/3d8127970a6281d684fac35e834fb98e"},{"db":"early","name":"OPRA","year":2024,"phase":"II","cancer":"CRC","biomarker":null,"setting":"Neoadjuvant","n":324,"population":"Stage II/III rectal cancer, cT3 76–78%, node-positive ~70%. Median distance from anal verge ~4.5 cm — the low tumours most desperate to preserve the sphincter.","treatment":"Both arms are TNT; the comparison is SEQUENCE. Induction chemo → chemoRT vs chemoRT → consolidation chemo, then watch-and-wait if complete response","tx":["RT","ChT"],"endpoints":[["Organ preservation","✅ cCR 40% + near-CR 31% → 74% watch-and-wait. CRT-first 76% WW (58% cCR) vs chemo-first 72% (51% cCR)"],["TME-free survival","✅ 39% vs 54% favouring CRT→chemo, P=0.012"],["Regrowth","✅ 44% vs 29% favouring CRT→chemo, P=0.02"],["5-yr DFS","↔ 71% vs 69% — and critically, DFS after salvage surgery for regrowth equals DFS after upfront surgery (64% vs 64%)"],["5-yr OS","↔ 88% vs 85%"],["Caution","⚠️ 9% of sustained cCR patients still developed distant metastases"]],"takeaway":"TNT lets about half of rectal cancer patients keep their rectum without sacrificing survival, and salvage surgery after regrowth costs nothing. Sequence matters: chemoRT first, then consolidation chemo. 94% of regrowths occur within 2 years.","url":"https://app.notion.com/3d4127970a6281b091a3c69a290f57c9"},{"db":"early","name":"P024","year":2001,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Neoadjuvant","n":337,"population":"Postmenopausal, HR+ (ER and/or PgR ≥10%), T2–4a-c N0–2 M0, ineligible for breast-conserving surgery.","treatment":"Neoadjuvant letrozole 2.5 mg vs tamoxifen 20 mg daily × 4 months","tx":["ET"],"endpoints":[["ORR (1°)","✅ 55% vs 36%, P<0.001 — OR 2.23 (1.43–3.50)"],["BCS rate","✅ 45% vs 35%, P=0.022"]],"takeaway":"Neoadjuvant letrozole beats tamoxifen in postmenopausal women not eligible for breast conservation, converting more to lumpectomy. Effective even in HER2+ and marginally ER+ tumours.","url":"https://app.notion.com/398127970a628168bb80c9a0cb93a9d6"},{"db":"early","name":"PARADIGM (HNSCC)","year":2013,"phase":"III","cancer":"HEENT","biomarker":null,"setting":"Neoadjuvant","n":145,"population":"Untreated stage III/IV non-metastatic SCC of oral cavity/oropharynx/hypopharynx/larynx — unresectable, low surgical curability, or organ-preservation candidates. WHO PS 0–1. Stage IV 86%, oropharynx 55%, N2 71%, T4 24%; median age 54. HPV status never tested.","treatment":"Induction TPF ×3 → response-adapted chemoradiation vs cisplatin chemoradiation alone","tx":["ChT","RT"],"endpoints":[["OS (1°)","⚠️ 3-yr 73% vs 78% — HR 1.09 (0.59–2.03), P=0.77, numerically worse"],["PFS","⚠️ 3-yr 67% vs 69% — HR 1.07, P=0.82"],["By site","Oropharynx OS HR 1.40 (worse); non-oropharynx HR 0.86"],["Toxicity","⚠️ Febrile neutropenia 23% vs 1%; mucositis 47% vs 16%"]],"takeaway":"Induction TPF gave no OS or PFS benefit — both numerically favoured chemoradiation alone. Stopped early at 145 of 330 planned patients, and outcomes far exceeded the assumed 55% 3-yr OS, almost certainly unmeasured HPV+ disease. Response to induction was strongly prognostic (3-yr OS 92% vs 52%) but intensification did not rescue poor responders.","url":"https://app.notion.com/3da127970a628134b2abd5fa6c6864a4"},{"db":"early","name":"PEARLS / KEYNOTE-091","year":2022,"phase":"III","cancer":"Lung","biomarker":"PD-L1","setting":"Adjuvant","n":1177,"population":"R0-resected NSCLC, stage IB (≥4 cm)–IIIA (AJCC 7th), ECOG 0–1. ~86% received adjuvant chemotherapy.","treatment":"Pembrolizumab × 1 yr vs placebo; no crossover","tx":["ICI"],"endpoints":[["DFS ITT (co-1°)","✅ 53.6 vs 42.0 mo — HR 0.76 (0.63–0.91); 36-mo 58% vs 50%"],["DFS PD-L1 ≥50% (co-1°)","⚠️ HR 0.82 (0.57–1.18) — NOT significant"],["OS","⚠️ HR 0.87 (0.67–1.15), immature"]],"takeaway":"Adjuvant pembrolizumab improves DFS regardless of PD-L1 → FDA approved for stage IB–IIIA. Paradoxically, the PD-L1 ≥50% co-primary missed — the mirror image of IMpower010.","url":"https://app.notion.com/2ac127970a628071b4c8c6a80679abf1"},{"db":"early","name":"PICC","year":2022,"phase":"II","cancer":"CRC","biomarker":"MSI-H / dMMR","setting":"Neoadjuvant","n":34,"population":"dMMR/MSI-H resectable locally advanced CRC (cT3–4 or any T N+). Colon 28, rectal 4, double primary 2. Stage II 4, stage III 30.","treatment":"Toripalimab ×6 cycles q2w ± celecoxib","tx":["ICI"],"endpoints":[["pCR (1°)","✅ 88% (toripalimab + celecoxib) vs 65% (toripalimab alone); overall 76%"],["Surgery","100% R0 resection, no surgical delays"],["1-yr DFS / OS","✅ 100% in both arms at median 14.9 mo"],["Safety","≥Grade 3 TRAE only 3%"]],"takeaway":"Adding celecoxib to PD-1 blockade pushed pCR from 65% to 88% in dMMR locally advanced CRC — cheap, safe, and worth a larger trial.","url":"https://app.notion.com/311127970a62800c9320e5caa9658d5b"},{"db":"early","name":"PRODIGE 23","year":2021,"phase":"III","cancer":"CRC","biomarker":null,"setting":"Neoadjuvant","n":461,"population":"Locally advanced rectal cancer, cT3 (80%) or cT4, node-positive 90%.","treatment":"TNT: FOLFIRINOX ×6 → long-course chemoRT → TME → FOLFOX ×6, vs chemoRT → TME → FOLFOX ×12","tx":["ChT","RT"],"endpoints":[["pCR","✅ 28% vs 12%, P<0.0001"],["DFS (1°)","✅ 3-yr 76% vs 69% — HR 0.69 (0.49–0.97), P=0.034"],["MFS","✅ 3-yr 79% vs 72% — HR 0.64 (0.44–0.93), P=0.017"],["OS","⚠️ 3-yr 91% vs 88%; 7-yr 82% vs 72% — HR 0.65 (0.40–1.05), P=0.077"]],"takeaway":"Induction FOLFIRINOX before chemoradiation doubles pCR and improves DFS and metastasis-free survival, with a strong OS trend by 7 years.","url":"https://app.notion.com/30d127970a62809bac7bec4d40b51c12"},{"db":"early","name":"PROSPECT","year":2023,"phase":"III","cancer":"CRC","biomarker":null,"setting":"Neoadjuvant","n":1128,"population":"cT2N+ or cT3N0-1 rectal cancer, candidates for sphincter-sparing surgery. cT3 90%. Deliberately LOWER risk than other rectal trials — the point was to omit radiation.","treatment":"Selective RT strategy: neoadjuvant mFOLFOX6 ×6 (chemoRT only if <20% response) vs standard long-course chemoRT","tx":["ChT","RT"],"endpoints":[["pCR","21.9% vs 24.3%"],["DFS (1°)","↔ 5-yr 80.8% vs 78.6% — HR 0.92 (90.2% CI 0.74–1.14), non-inferiority margin 1.29 met"],["Local recurrence","↔ 5-yr 1.8% vs 1.6%"],["OS","↔ 5-yr 89.5% vs 90.2%"]],"takeaway":"For average-risk rectal cancer eligible for sphincter-sparing surgery, FOLFOX with selective chemoradiation is non-inferior — and ~90% of patients avoided pelvic radiation altogether.","url":"https://app.notion.com/311127970a6280549c15c82d7384f3db"},{"db":"early","name":"RAPIDO","year":2023,"phase":"III","cancer":"CRC","biomarker":null,"setting":"Neoadjuvant","n":912,"population":"HIGH-risk locally advanced rectal cancer: cT4 30%, cN2 65%, EMVI 30%, MRF+ 60%, enlarged lateral nodes 15%.","treatment":"Short-course RT → CAPOX ×6 / FOLFOX ×9 → surgery (no adjuvant chemo) vs long-course chemoRT → surgery (+ adjuvant chemo in 41%)","tx":["RT","ChT"],"endpoints":[["pCR","✅ 28% vs 14%"],["Disease-related treatment failure (1°)","✅ 3-yr 23.7% vs 30.4% — HR 0.75 (0.60–0.95), P=0.019"],["Distant metastasis","✅ 3-yr 20.0% vs 26.8%"],["OS","⚠️ 3-yr 89.1% vs 88.8% — HR 0.92 (0.67–1.25), P=0.59"]],"takeaway":"Short-course RT followed by consolidation chemo cuts distant metastases and doubles pCR in high-risk rectal cancer. The mechanism is compliance — patients actually complete chemotherapy before surgery, not after.","url":"https://app.notion.com/306127970a6280bb90f2d0a00bbd028e"},{"db":"early","name":"RxPONDER","year":2021,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":5083,"population":"HR+/HER2−, 1–3 positive nodes (N1), Oncotype RS ≤25. Median age 57.5; 33% premenopausal; RS 0–13 in 43%, RS 14–25 in 57%.","treatment":"Endocrine therapy alone vs chemotherapy + endocrine therapy","tx":["ChT","ET"],"endpoints":[["Primary hypothesis","❌ NOT MET — treatment × continuous RS interaction P=0.35"],["Overall iDFS","⚠️ 5-yr 92.2% vs 91.0% — HR 0.86 (0.72–1.03), P=0.10"],["Postmenopausal","❌ HR 1.02 (0.82–1.26), P=0.89 — chemo adds nothing"],["Premenopausal","✅ 93.9% vs 89.0% (+4.9 pp) — HR 0.60 (0.43–0.83), P=0.002"],["Interaction","✅ Menopausal status × chemo P=0.008 (prespecified)"]],"takeaway":"In node-positive disease with RS ≤25, the Recurrence Score does NOT predict chemotherapy benefit — menopausal status does. Postmenopausal women can skip chemo; premenopausal women benefit. Whether that benefit is the chemotherapy itself or the ovarian suppression it causes remains unresolved.","url":"https://app.notion.com/3ce127970a6281b9b62afcacde9e4ac5"},{"db":"early","name":"SAMIT","year":2014,"phase":"III","cancer":"GC","biomarker":null,"setting":"Adjuvant","n":1495,"population":"Japanese, ECOG 0–1, advanced T4a/T4b gastric cancer after R0 + D2.","treatment":"2×2 design — paclitaxel→UFT vs paclitaxel→S-1 vs UFT alone vs S-1 alone","tx":["ChT"],"endpoints":[["Sequential vs mono","⚠️ 3-yr DFS 57.2% vs 54.0% — HR 0.92 (0.80–1.07), P=0.27"],["S-1 vs UFT","✅ 3-yr DFS 58.1% vs 53.0% — HR 0.81 (0.70–0.93), P=0.005"],["OS S-1 vs UFT","✅ 3-yr 60.7% vs 54.3% — HR 0.81 (0.69–0.93), P=0.013"]],"takeaway":"S-1 beats UFT in advanced gastric cancer. Sequential paclitaxel adds nothing overall, though it may have a role in stage IIIB.","url":"https://app.notion.com/2a4127970a628028bc0ae4c58db10725"},{"db":"early","name":"SOFT / TEXT","year":2015,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":4690,"population":"Pre/perimenopausal women with HR+ breast cancer. Higher-risk patients received chemotherapy and had to remain premenopausal afterwards.","treatment":"SOFT: tamoxifen vs tamoxifen + OFS vs exemestane + OFS. TEXT: tamoxifen + OFS vs exemestane + OFS. 5 years","tx":["ET"],"endpoints":[["SOFT 12-yr DFS","71.9% (TAM) vs 76.1% (TAM+OFS) vs 79.0% (EXE+OFS)"],["TAM+OFS vs TAM","✅ DFS HR 0.82 (0.69–0.98), P=0.03; ⚠️ OS HR 0.78 (0.60–1.01), P=0.06"],["EXE+OFS vs TAM+OFS","✅ 8-yr DFS HR 0.77 (0.67–0.90), P<0.001"],["OS","✅ Exemestane+OFS OS benefit confined to chemo-treated (high-risk) patients"]],"takeaway":"Premenopausal women benefit from ovarian function suppression for 5 years. In high-risk patients (those needing chemo, or under 35), an aromatase inhibitor with OFS beats tamoxifen with OFS.","url":"https://app.notion.com/3ce127970a628064b44ff62238814790"},{"db":"early","name":"STELLAR","year":2022,"phase":"III","cancer":"CRC","biomarker":null,"setting":"Neoadjuvant","n":599,"population":"Distal-to-middle rectal cancer, cT3–4 (15% cT4), node-positive 85% (cN2 35%), MRF+ ~50%, EMVI ~50%.","treatment":"Short-course RT → CAPOX ×4 → TME → CAPOX ×2 vs long-course chemoRT → TME → CAPOX ×6","tx":["ChT","RT"],"endpoints":[["pCR","✅ 21.8% vs 12.3%, P=0.002"],["DFS (1°)","↔ 3-yr 64.5% vs 62.3% — HR 0.883, non-inferiority met, P<0.001"],["MFS","⚠️ 3-yr 77.1% vs 75.3%"],["OS","✅ 3-yr 86.5% vs 75.1% — HR 0.67 (0.46–0.97), P=0.033"]],"takeaway":"Short-course TNT is non-inferior on DFS, doubles pCR, and unexpectedly improved OS. More haematologic toxicity.","url":"https://app.notion.com/310127970a628025890fe32369be9889"},{"db":"early","name":"TAILORx","year":2018,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Adjuvant","n":10273,"population":"Women 18–75, HR+/HER2−, NODE-NEGATIVE, meeting criteria for adjuvant chemo. In the randomised RS 11–25 cohort: median age 55, 36% premenopausal, median tumour 1.5 cm, 74% low clinical risk.","treatment":"Oncotype DX 21-gene RS. RS 11–25 randomised to ET alone vs chemo + ET. RS ≤10 → ET alone; RS ≥26 → chemo + ET (non-randomised)","tx":["ET","ChT"],"endpoints":[["iDFS (1°)","✅ 9-yr 83.3% (ET) vs 84.3% (chemo+ET) — HR 1.08 (0.94–1.24), non-inferiority met"],["Distant recurrence","9-yr 94.5% vs 95.0% — HR 1.10, P=0.48"],["OS","9-yr 93.9% vs 93.8% — HR 0.99, P=0.89"],["Interaction","⚠️ Chemo × (age × RS) P=0.004"]],"takeaway":"In node-negative disease with RS 11–25, endocrine therapy alone is non-inferior — about 85% of these patients can skip chemotherapy. The exception: women ≤50 with RS 16–25, where chemo cut distant recurrence by 6.5% at 9 years.","url":"https://app.notion.com/3ce127970a6281c29f9ee41a27856422"},{"db":"early","name":"Tislelizumab LANPC (NCT05211232)","year":2024,"phase":"III (Ongoing)","cancer":"NPC","biomarker":null,"setting":"Peri-OP","n":450,"population":"High-risk locoregionally advanced NPC, stage III–IVa (AJCC 8th), excluding T3N0 and T3N1 with positive retropharyngeal nodes. Enrolled Jun 2022 – May 2023.","treatment":"Tislelizumab + GP induction → CCRT → adjuvant tislelizumab ×8 vs placebo + same backbone","tx":["ICI","ChT","RT"],"endpoints":[["Complete response rate (co-1°)","✅ 30.5% vs 16.7% — met at planned interim"],["PFS (co-1°)","⏳ Immature, not yet reported"],["OS","⏳ Not reported"]],"takeaway":"Adding tislelizumab to GP induction deepens response without added toxicity, meeting the first of two co-primary endpoints. PFS is immature, so no survival claim yet — and this is an ASCO abstract only, so treat it as provisional. Do not confuse with RATIONALE-309 (metastatic NPC).","url":"https://app.notion.com/3d9127970a6281609977c9e7b3b2a4ab"},{"db":"early","name":"TRAIN-2","year":2018,"phase":"III","cancer":"Breast","biomarker":"HER2","setting":"Neoadjuvant","n":438,"population":"Stage II–III HER2+ breast cancer, treatment-naive. HR+ 59%, node+ 63%, grade 3 ~45%, median age ~48.","treatment":"Anthracycline: FEC ×3 → paclitaxel/carboplatin ×6 + HP, vs anthracycline-free: paclitaxel/carboplatin ×9 + HP","tx":["ChT","Anti-HER2"],"endpoints":[["tpCR (1°)","⚠️ 67% vs 68%, P=0.95 — identical. HR−: 89% vs 84%; HR+: 51% vs 55%"],["3-yr EFS","⚠️ 92.7% vs 93.6% — HR 0.90 (0.50–1.63)"],["3-yr OS","⚠️ 97.7% vs 98.2%"],["pCR prognostic","✅ pCR vs no pCR 3-yr DFS HR 0.42 (0.23–0.78), P=0.006"]],"takeaway":"Anthracyclines add nothing to a carboplatin/taxane + dual HER2 backbone — equal pCR and EFS with far less toxicity. Helped establish anthracycline-free TCHP as the neoadjuvant standard.","url":"https://app.notion.com/389127970a6281e68966e3903a5bf392"},{"db":"early","name":"TransNEOS","year":2019,"phase":"III","cancer":"Breast","biomarker":"ER/PR (HR)","setting":"Neoadjuvant","n":295,"population":"Postmenopausal women <75 y, ER+/HER2−, cN0, T1c–T2 (≥2 cm).","treatment":"Neoadjuvant letrozole × 24–28 wk, stratified by Oncotype Recurrence Score (<18, 18–30, ≥31)","tx":["ET"],"endpoints":[["Clinical response (1°)","✅ CR+PR 54% (RS<18) vs 42% (RS 18–30) vs 22% (RS ≥31), P<0.001"],["RS as predictor","OR 0.06 (0.02–0.18) per 50-unit RS increase, P<0.001"]],"takeaway":"Validates the 21-gene Recurrence Score as a predictor of response to neoadjuvant letrozole — low RS tumours are the ones that melt on endocrine therapy alone.","url":"https://app.notion.com/3a9127970a628124b630efa1756c2945"},{"db":"early","name":"TRYPHAENA","year":2013,"phase":"II","cancer":"Breast","biomarker":"HER2","setting":"Neoadjuvant","n":225,"population":"HER2+ operable (T2–3 N0–1), locally advanced, or inflammatory breast cancer; primary tumour >2 cm. HR+ 37–64% across arms.","treatment":"3-arm cardiac safety study — A: FEC+HP ×3 → TPH ×3; B: FEC ×3 → TPH ×3; C: TCHP ×6 (anthracycline-free)","tx":["ChT","Anti-HER2"],"endpoints":[["Cardiac safety (1°)","✅ Symptomatic LVSD: A 0%, B 2.7%, C 0%; all-grade 5.6% / 4.0% / 2.6%"],["tpCR","A 50.7%, B 45.3%, C 51.9%"],["By HR","HR− ~80% vs HR+ ~40% across arms"]],"takeaway":"Dual HER2 blockade with or without anthracyclines carried low cardiotoxicity, and established anthracycline-free TCHP as a legitimate neoadjuvant option.","url":"https://app.notion.com/388127970a62818dbc1cc05479851420"},{"db":"met","name":"ABBV-400 (Temab-A)","year":2025,"phase":"I (Ongoing)","cancer":"CRC","biomarker":"MET","setting":"3L","n":null,"population":"Heavily pretreated CRC; c-Met unselected cohort (Part 5 enriched for MET-amplified).","treatment":"Telisotuzumab adizutecan — c-Met–directed ADC with a topoisomerase-1 inhibitor payload","tx":["ADC"],"endpoints":[["ORR","15.6%"],["DCR","74.6%"],["PFS","4.6 mo"],["OS","10.4 mo"]],"takeaway":"Underwhelming activity in colorectal cancer — high disease control but a low response rate and short PFS.","url":"https://app.notion.com/304127970a6280ebaf9ee872dbac71f5"},{"db":"met","name":"ACOSOG Z9001","year":2014,"phase":"III","cancer":"GIST","biomarker":"KIT / PDGFRA","setting":"Adjuvant","n":713,"population":"Primary KIT(CD117)+ GIST ≥3 cm after complete gross resection, registered ≤70 days post-op. Median age 58, median size 6.5 cm; 62% gastric / 32% small intestine; 91.5% R0.","treatment":"Adjuvant imatinib 400 mg/d × 1 year vs placebo","tx":["TKI"],"endpoints":[["RFS (1°)","✅ Median NR — HR 0.60 (0.43–0.75), P<0.001; separation sustained at 74-mo follow-up"],["OS","⚠️ No difference (P=0.19)"]],"takeaway":"One year of adjuvant imatinib gives a durable RFS benefit but no OS benefit. Size, location and mitotic rate — not genotype — define GIST's natural history, and imatinib benefit concentrates in KIT exon 11 deletions.","url":"https://app.notion.com/3ce127970a62818a84cde736755bf17a"},{"db":"met","name":"ADRIATIC","year":2024,"phase":"III","cancer":"Lung (LS-SCLC)","biomarker":null,"setting":"1L","n":null,"population":"Limited-stage small cell lung cancer with no progression after definitive concurrent chemoradiation.","treatment":"Consolidation durvalumab vs placebo","tx":["ICI"],"endpoints":[["ORR","30.3% vs 32.0%"],["DCR","84.0% vs 77.0%"],["PFS","✅ 16.6 vs 9.2 mo — HR 0.76 (0.59–0.98), P=0.02"],["OS (1°)","✅ 55.9 vs 33.4 mo — HR 0.73 (0.54–0.98), P=0.01"]],"takeaway":"Consolidation durvalumab after definitive chemoradiation in limited-stage SCLC improves both OS and PFS — a 22-month median OS gain. More discontinuation for adverse events.","url":"https://app.notion.com/36f127970a62801f8013eb4b2ac12522"},{"db":"met","name":"AK105-304 (penpulimab)","year":2025,"phase":"III (Ongoing)","cancer":"NPC","biomarker":null,"setting":"1L","n":291,"population":"Treatment-naive recurrent/metastatic NPC. Global study across 46 sites with an ethnically diverse population — unlike the endemic East-Asian cohorts of the other first-line trials. 46% crossover.","treatment":"Penpulimab + gemcitabine/cisplatin vs placebo + GP, induction then maintenance","tx":["ICI","ChT"],"endpoints":[["PFS (1°, BICR)","✅ 9.63 vs 7.00 mo — HR 0.45 (0.33–0.62), P<0.0001; 12-mo 44.2%, 24-mo 22.8%"],["OS","⏳ Not mature"]],"takeaway":"The generalisability trial — basis of the first FDA approval of a PD-1 inhibitor in this setting (April 2025). Numerically the lowest PFS hazard ratio of its class, though crossover was permitted so cross-trial comparison isn't justified. Carboplatin was allowed, making it the most flexible regimen for cisplatin-unfit patients.","url":"https://app.notion.com/3d9127970a62813c8703ca49c9c8716c"},{"db":"met","name":"ALEX","year":null,"phase":"III","cancer":"Lung","biomarker":"ALK","setting":"1L","n":null,"population":"ALK-positive advanced NSCLC (details not yet captured in your database).","treatment":"Alectinib vs crizotinib","tx":["TKI"],"endpoints":[["Status","📝 Row is a placeholder — results not captured yet"]],"takeaway":"Placeholder entry — the trial that established alectinib over crizotinib in first-line ALK+ NSCLC. Worth filling in.","url":"https://app.notion.com/2ac127970a62803d9645e9bbd34d6479"},{"db":"met","name":"ASCENT","year":2021,"phase":"III","cancer":"Breast","biomarker":null,"setting":"3L","n":null,"population":"Metastatic TNBC with ≥2 prior chemotherapies. 100% prior taxane, 82% prior anthracycline, 27% prior ICI. Notably, 30% were N
